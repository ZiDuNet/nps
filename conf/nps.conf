###########################################################################
# HTTP(S) 代理配置
###########################################################################
# 应用名与运行模式（Beego 兼容字段）
appname=nps
runmode=pro
# HTTP/HTTPS 代理监听 IP，0.0.0.0 表示监听服务器所有网卡
http_proxy_ip=0.0.0.0
# HTTP 代理监听端口；留空则不启动 HTTP 主机代理
http_proxy_port=80
# HTTPS 代理监听端口；留空则不启动 HTTPS 主机代理
https_proxy_port=443
# 对外访问 HTTP 端口，仅用于管理面板生成域名访问链接；留空跟随监听端口
# 例如 NPS 监听 80、前置反代对外使用 30111 时填写 30111
# 留空表示与 http_proxy_port 相同
http_proxy_access_port=
# 对外访问 HTTPS 端口，仅用于管理面板生成域名访问链接；留空跟随监听端口
# 留空表示与 https_proxy_port 相同
https_proxy_access_port=
# 管理面板中是否展示非 80 端口的 HTTP 访问地址
show_http_proxy_port=true

###########################################################################
# Bridge 配置（NPC 与 NPS 的控制连接）
###########################################################################
# 主 Bridge 协议，可选 tcp 或 kcp；其他传输可通过下方独立端口并行启用
bridge_type=tcp
# Bridge 服务监听端口；NPC 的 -server 参数应使用此端口
bridge_port=8024
# Bridge 服务监听 IP，0.0.0.0 表示允许所有网卡接入
bridge_ip=0.0.0.0
# 可选的并行 KCP Bridge UDP 端口；0 表示关闭。主 Bridge 已使用 KCP 且端口相同时不会重复监听
bridge_kcp_port=0
# 可选 WebSocket / WebSocket TLS Bridge 端口；0 表示关闭
bridge_ws_port=0
bridge_wss_port=0
# 可选 QUIC Bridge UDP 端口；0 表示关闭。客户端使用 -type=quic
bridge_quic_port=0
# QUIC Bridge 监听 IP；留空跟随 bridge_ip
bridge_quic_ip=
# QUIC ALPN 标识；服务端与 NPC 必须一致
quic_alpn=nps
# QUIC 空闲保活周期、最大空闲超时和并发流上限
quic_keep_alive_period=10
quic_max_idle_timeout=30
quic_max_incoming_streams=100000
# 可选：HTTP/3 域名反代监听端口；需要与 HTTPS 证书和 UDP 放行一起配置，0 表示关闭
#http3_proxy_port=443
# 默认 HTTPS 证书（未配置 Host 证书时使用）
#https_default_cert_file=conf/server.pem
#https_default_key_file=conf/server.key
# 强制按 Host 自动申请 ACME 证书（需要公网 80/443 和 DNS 已解析）
force_auto_ssl=false
# ACME 证书存储目录、邮箱、CA 和缓存策略
ssl_path=conf/ssl
ssl_email=
ssl_ca=LetsEncrypt
# ZeroSSL API 密钥（仅 ssl_ca=ZeroSSL 时需要）
ssl_zerossl_api=
ssl_cache_max=0
ssl_cache_reload=3600
ssl_cache_idle=60
# 前置反向代理场景：设置密码后可用 X-NPS-Http-Only 避免 HTTP 自动跳 HTTPS
x_nps_http_only=
# WebSocket Bridge 路径，默认 /ws；反向代理/CDN 场景应同时透传 Upgrade 请求
bridge_path=/ws
# WebSocket Bridge 经过可信反向代理时，用此请求头恢复客户端真实地址
bridge_real_ip_header=
bridge_trusted_ips=127.0.0.1
# Bridge 入口地址、端口复用 Host、同 VKEY 选主策略
bridge_addr=
bridge_host=
bridge_select_mode=Primary
# 允许通过 HTTP/3 入口承载 Bridge（默认关闭）
bridge_http3=false
# Bridge 的独立证书路径；留空使用 conf/server.pem/server.key
bridge_cert_file=
bridge_key_file=
# 客户端详情保留的最近连接历史条数；0 关闭，最大 100
client_history_limit=5

###########################################################################
# 客户端认证与连接限制
###########################################################################
# 客户端连接服务端的公共验证密钥；留空则禁止使用公共密钥连接
public_vkey=
# 新版 NPC Bridge 握手允许的客户端时间偏差，单位为秒；仅 1.1.29 及以上生效
# 0 表示不校验时间戳，但每次连接仍使用一次性随机挑战
auth_time_window=300
# 是否按客户端来源 IP 限制连接；true 启用、false 禁用，留空则忽略
#ip_limit=true
# 公共 IP 登记密钥；填写后可在 /ip/register 页面登记当前访问者 IP，登记对所有启用“仅允许已登记 IP”的资源生效
public_register_key=
# IP 登记页面默认最长有效期（小时）；客户端可进一步设置更短的上限
ip_register_max_hours=2
# 可选：独立 IP 登记监听。端口为 0 时不额外监听，仅使用管理面板的 /ip/register 页面
ip_register_ip=127.0.0.1
ip_register_port=0
# 同时填写证书与私钥后，独立登记监听使用 HTTPS；路径相对程序运行目录
ip_register_cert_file=
ip_register_key_file=

###########################################################################
# 流量与日志
###########################################################################
# 流量数据持久化间隔，单位为分钟；留空或 0 表示不持久化
flow_store_interval=1
# 日志级别：0 紧急、1 警报、2 严重、3 错误、4 警告、5 通知、6 信息、7 调试
log_level=6
# 日志文件路径；相对路径以程序运行目录为准
log_path=nps.log
# 单个日志文件大小上限（MB）；超过后切割，0 表示不按大小切割
log_max_size=2
# 日志归档保留数量上限；0 表示不限制数量
log_max_files=10
# 日志归档保留天数；0 表示不按天数清理
log_max_days=7
# 是否压缩轮转后的日志归档
log_compress=false
# 是否在日期变化时轮转日志
log_rotate_daily=true
# 管理操作审计日志路径；相对路径以程序运行目录为准，文件权限为仅所有者可读写
audit_log_path=audit.log

###########################################################################
# P2P 中继配置（可选，取消注释后启用）
###########################################################################
# P2P 中继监听 IP；对外服务时通常设为 0.0.0.0
#p2p_ip=127.0.0.1
# P2P 中继监听端口；配置后才会启动 P2P 服务
#p2p_port=6000
# 新版 P2P 的 STUN 服务器列表；留空使用内置列表，none 表示关闭 STUN
#p2p_stun_servers=
# P2P 端口映射默认关闭；仅在访问端所在网关支持相应协议时生效
p2p_enable_upnp_portmap=false
p2p_enable_pcp_portmap=false
p2p_enable_natpmp_portmap=false
p2p_portmap_lease_seconds=3600
# 新版 P2P NAT 探测、协商及传输超时（毫秒）；0 使用内置默认值
p2p_probe_timeout_ms=0
p2p_handshake_timeout_ms=0
p2p_transport_timeout_ms=0

###########################################################################
# 管理面板配置
###########################################################################
# 管理面板对应的域名；端口复用场景用于区分面板流量
web_host=a.o.com
# 管理面板管理员用户名
web_username=admin
# 管理面板管理员密码；首次启动时会替换为随机值
web_password=CHANGE_ME
# 管理员登录 TOTP 密钥；留空关闭。使用 nps -gen2fa 生成后填入并重启
totp_secret=
# 管理面板监听端口
web_port = 8081
# 管理面板监听 IP；新安装默认仅本机访问。远程访问应通过 HTTPS 反向代理，或显式配置受控管理网段。
web_ip=127.0.0.1
# 管理面板 URL 前缀；反向代理到子路径时填写，例如 /nps
web_base_url=
# Web 会话实例密钥路径；留空时使用 conf/instance.key
instance_key_file=
# 是否为管理面板启用 HTTPS
web_open_ssl=false
# 管理面板 HTTPS 证书文件路径；web_open_ssl=true 时生效
web_cert_file=conf/server.pem
# 管理面板 HTTPS 私钥文件路径；web_open_ssl=true 时生效
web_key_file=conf/server.key
# 访问不存在的管理路径时尽力关闭连接，不返回 404 响应
web_close_on_not_found=false
# 子路径部署示例：访问 https://example.com/nps 时使用
#web_base_url=/nps

###########################################################################
# Web API 认证配置
###########################################################################
# Web API 认证密钥；首次启动时会替换为随机值
auth_key=CHANGE_ME
# 获取服务端 auth_key 使用的 AES 密钥，必须恰好为 16 个字符；首次启动时会替换为随机值
auth_crypt_key =CHANGE_ME_16CHAR

###########################################################################
# 端口权限配置（可选）
###########################################################################
# 限制客户端可映射的端口范围，例如 9001-9009,10001,11000-12000
#allow_ports=9001-9009,10001,11000-12000

###########################################################################
# 管理面板多用户配置
###########################################################################
# 是否允许普通用户登录管理面板
allow_user_login=true
# 是否允许普通用户使用客户端 VKEY 登录面板；关闭后仅允许用户账号登录
allow_user_vkey_login=true
# 是否允许普通用户自行注册管理面板账号
allow_user_register=false
# 注册配置：以上开关打开后，登录页才会显示注册入口
# 是否要求注册时填写图片验证码
register_captcha=true
# 新注册用户默认最大客户端数；0 表示不限制
register_max_clients=0
# 新注册用户默认总隧道数；0 表示不限制
register_max_tunnels=0
# 新注册用户默认有效天数；0 表示永久有效
register_expire_days=7
# 注册请求统计窗口（秒）
register_rate_window=60
# 同一 IP 或同一用户名在一个窗口内允许的注册提交次数；0 表示不限制
register_rate_limit=5
# 同一 IP 在一个窗口内允许成功注册的账号数；0 表示不限制
register_ip_rate_limit=3
# 是否要求邮箱验证。关闭时仅使用用户名和密码注册
register_email_verify=false
# 邮箱验证码有效期（秒）和同一邮箱/IP 的发送冷却时间（秒）
register_email_code_ttl=600
register_email_code_cooldown=60
# SMTP 邮件服务；启用 register_email_verify 时必须填写主机、端口和发件人
smtp_host=
smtp_port=587
# 加密方式：starttls（常用 587）、ssl（常用 465）或 none
smtp_security=starttls
smtp_username=
smtp_password=
smtp_from=
# 是否允许普通用户修改自己的用户名
allow_user_change_username=true
# 是否允许普通用户使用客户端本地代理（默认关闭）
allow_user_local=false
# 是否允许 Secret 代理连接任意目标（默认关闭）
allow_secret_link=false
# 是否允许 Secret 代理连接服务端本地地址（默认关闭）
allow_secret_local=false
# 是否允许管理员从 Web 面板下发客户端远程升级；设为 false 后拒绝所有升级请求
allow_remote_update=true
# 是否启用客户端时间限制
allow_time_limit=true
# 是否使用前置反向代理传入的真实 IP；默认开启，优先读取 X-Real-IP，其次读取 X-Forwarded-For 第一项。
# Docker + Nginx 场景无需额外填写可信代理 IP，但代理必须覆盖这些头，不能让客户端直接伪造。
allow_x_real_ip=true
# 旧版兼容字段；当前 Web 登录和 HTTP Host 来源 IP 不再要求填写此列表
trusted_proxy_ips=127.0.0.1

###########################################################################
# 客户端资源与代理功能开关
###########################################################################
# 是否允许在管理面板为客户端设置总流量上限
allow_flow_limit=true
# 客户端流量配额口径：total=上下行总量，actual=实际消耗（总量×2）
flow_limit_type=total
# 是否允许在管理面板为客户端设置带宽上限
allow_rate_limit=true
# 是否允许在管理面板为客户端设置最大隧道数
allow_tunnel_num_limit=true
# 是否允许客户端使用本地代理访问目标地址
allow_local_proxy=false
# 是否允许在管理面板为客户端设置最大连接数
allow_connection_num_limit=true
# 是否允许每个隧道绑定不同的服务端监听 IP
allow_multi_ip=true
# 是否在管理面板仪表盘显示 CPU、内存和网络等系统信息
system_info_display=true

###########################################################################
# HTTP 转发与缓存
###########################################################################
# 是否向后端请求添加客户端真实 IP 相关请求头
http_add_origin_header=true
# 是否启用 HTTP 响应缓存
http_cache=false
# HTTP 缓存队列长度；仅在 http_cache=true 时生效
http_cache_length=100
# 后端默认连接响应头等待超时（秒）
http_proxy_response_timeout=100

###########################################################################
# 性能调试（可选，仅建议在内网临时开启）
###########################################################################
# pprof 监听 IP
#pprof_ip=127.0.0.1
# pprof 监听端口
#pprof_port=9999

###########################################################################
# 连接保活与 TLS
###########################################################################
# 未收到 mux 心跳回包的最大次数；每次检查间隔为 5 秒
disconnect_timeout=60
# 是否在管理面板登录时启用验证码
open_captcha=false
# 是否启用管理面板登录工作量证明
force_pow=false
# PoW 难度（SHA-256 前导零位数）
pow_bits=20
# 登录安全策略
login_ban_time=5
login_ip_ban_time=180
login_user_ban_time=3600
login_max_fail_times=10
login_max_body=1024
login_max_skew=300000
# 是否启用 Bridge TLS 加密监听
tls_enable=true
# Bridge TLS 加密监听端口；tls_enable=true 时生效
tls_bridge_port=8025
# NTP 校时（留空关闭）；失败时保留上次成功的时间偏移
ntp_server=
ntp_interval=5
timezone=Asia/Shanghai
# GeoIP/Geosite 数据文件（留空使用 conf/geoip.dat、conf/geosite.dat）；规则使用 geoip: / geosite:
geoip_path=
geosite_path=
acl_max_rules=1000
geo_reload_interval=60
# DNS 服务器，仅用于新 P2P/STUN 与客户端目标解析
dns_server=8.8.8.8
# 旧配置键 bridge_tls_port 会在升级时映射到 tls_bridge_port；原字段不会被删除
