# NPS 服务端配置说明
# [代理入口] http_proxy_ip/http_proxy_port/https_proxy_port：HTTP(S) 代理监听地址和端口；端口留空表示不启用。
# [Bridge] bridge_type/bridge_port/bridge_ip：NPC 控制连接协议、端口和监听地址。
# [认证] public_vkey：客户端连接密钥；auth_key/auth_crypt_key：Web API 密钥及其 16 位 AES 密钥。
# [流量] flow_store_interval：流量持久化间隔（分钟）；allow_flow_limit、allow_rate_limit：是否允许限流。
# [面板] web_host/web_port/web_ip/web_base_url：管理面板域名、端口、监听地址和 URL 前缀。
# [面板安全] web_username/web_password：管理员账号密码；web_open_ssl/web_cert_file/web_key_file：面板 HTTPS。
# [用户与资源] allow_user_login/allow_user_register、allow_tunnel_num_limit、allow_connection_num_limit：用户和资源限制开关。
# [系统] log_level/log_path：日志级别（0-7）和文件；system_info_display：是否显示监控图表。
# [网络] allow_multi_ip：是否允许隧道绑定不同服务端 IP；http_add_origin_header：是否转发真实客户端 IP。
# [缓存与调试] http_cache/http_cache_length：HTTP 缓存；pprof_ip/pprof_port：性能调试端口（仅建议内网开启）。
# [连接] disconnect_timeout：客户端断线超时（秒）；tls_enable/tls_bridge_port：Bridge TLS 加密。

#HTTP(S) proxy port, no startup if empty
http_proxy_ip=0.0.0.0
http_proxy_port=80
https_proxy_port=443
# 是否展示非【80】端口
show_http_proxy_port=true
##bridge
bridge_type=tcp
bridge_port=8024
bridge_ip=0.0.0.0

# Public password, which clients can use to connect to the server
# After the connection, the server will be able to open relevant ports and parse related domain names according to its own configuration file.
public_vkey=123

#Traffic data persistence interval(minute)
#Ignorance means no persistence
flow_store_interval=1

# log level LevelEmergency->0  LevelAlert->1 LevelCritical->2 LevelError->3 LevelWarning->4 LevelNotice->5 LevelInformational->6 LevelDebug->7
log_level=6
log_path=nps.log

#Whether to restrict IP access, true or false or ignore
#ip_limit=true

#p2p
#p2p_ip=127.0.0.1
#p2p_port=6000

#web
web_host=a.o.com
web_username=admin
web_password=123
web_port = 8081
web_ip=0.0.0.0
web_base_url=
web_open_ssl=false
web_cert_file=conf/server.pem
web_key_file=conf/server.key
# if web under proxy use sub path. like http://host/nps need this.
#web_base_url=/nps

#Web API unauthenticated IP address(the len of auth_crypt_key must be 16)
#Remove comments if needed
#auth_key=test
auth_key=123
#获取服务端authKey时的aes加密密钥，16位
auth_crypt_key =213

#allow_ports=9001-9009,10001,11000-12000

#Web management multi-user login
allow_user_login=true
allow_user_register=false
allow_user_change_username=true

#extension
#流量限制
allow_flow_limit=true
#带宽限制
allow_rate_limit=true
#客户端最大隧道数限制
allow_tunnel_num_limit=true
allow_local_proxy=false
#客户端最大连接数
allow_connection_num_limit=true
#每个隧道监听不同的服务端端口
allow_multi_ip=true
system_info_display=true

#获取用户真实ip
http_add_origin_header=true

#cache
http_cache=false
http_cache_length=100

#get origin ip
#http_add_origin_header=false

#pprof debug options
#pprof_ip=0.0.0.0
#pprof_port=9999

#client disconnect timeout
disconnect_timeout=60

#管理面板开启验证码校验
open_captcha=false


# 是否开启tls
tls_enable=true
tls_bridge_port=8025
