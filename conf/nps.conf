# NPS bootstrap v1
# 此文件只保留常用启动参数。高级选项见 Web 面板「全局参数」和服务端配置文档。
# 注册、SMTP、HTTP 超时、审计等业务设置由 SQLite 保存。
runmode=pro
appname=nps

# 管理面板默认仅本机访问；远程访问建议使用 HTTPS 反向代理。
web_ip=127.0.0.1
web_port=8081
web_open_ssl=false
web_username=admin
# 首次启动会替换这些占位值。
web_password=CHANGE_ME
auth_key=CHANGE_ME
# 获取服务端 auth_key 使用的 AES 密钥，必须恰好为 16 个字符；首次启动时会替换为随机值
auth_crypt_key=CHANGE_ME_16CHAR

# NPC 接入：TCP 和 TLS 监听可并存。
bridge_type=tcp
bridge_ip=0.0.0.0
bridge_port=8024
bridge_tcp_show=true
tls_enable=true
tls_bridge_port=8025

# 域名反代；留空对应端口可关闭该监听。
http_proxy_ip=0.0.0.0
http_proxy_port=80
https_proxy_port=443

# 服务模式主日志；6 为信息级别。
log_path=nps.log
log_level=6
