###########################################################################
# HTTP(S) 代理配置
###########################################################################
# HTTP/HTTPS 代理监听 IP，0.0.0.0 表示监听服务器所有网卡
http_proxy_ip=0.0.0.0
# HTTP 代理监听端口；留空则不启动 HTTP 主机代理
http_proxy_port=80
# HTTPS 代理监听端口；留空则不启动 HTTPS 主机代理
https_proxy_port=443
# 对外访问 HTTP 端口，仅用于管理面板生成域名访问链接；留空跟随监听端口
# 例如 NPS 监听 80、前置反代对外使用 30111 时填写 30111
# 留空表示与 http_proxy_port 相同
http_proxy_access_port=
# 对外访问 HTTPS 端口，仅用于管理面板生成域名访问链接；留空跟随监听端口
# 留空表示与 https_proxy_port 相同
https_proxy_access_port=
# 管理面板中是否展示非 80 端口的 HTTP 访问地址
show_http_proxy_port=true

###########################################################################
# Bridge 配置（NPC 与 NPS 的控制连接）
###########################################################################
# 主 Bridge 协议，可选 tcp 或 kcp；其他传输可通过下方独立端口并行启用
bridge_type=tcp
# Bridge 服务监听端口；NPC 的 -server 参数应使用此端口
bridge_port=8024
# Bridge 服务监听 IP，0.0.0.0 表示允许所有网卡接入
bridge_ip=0.0.0.0
# 可选的并行 KCP Bridge UDP 端口；0 表示关闭。主 Bridge 已使用 KCP 且端口相同时不会重复监听
bridge_kcp_port=0
# 可选 WebSocket / WebSocket TLS Bridge 端口；0 表示关闭
bridge_ws_port=0
bridge_wss_port=0
# 可选 QUIC Bridge UDP 端口；0 表示关闭。客户端使用 -type=quic
bridge_quic_port=0
# QUIC Bridge 监听 IP；留空跟随 bridge_ip
bridge_quic_ip=
# QUIC ALPN 标识；服务端与 NPC 必须一致
quic_alpn=nps
# QUIC 空闲保活周期、最大空闲超时和并发流上限
quic_keep_alive_period=10
quic_max_idle_timeout=30
quic_max_incoming_streams=100000
# WebSocket Bridge 路径，默认 /ws；反向代理/CDN 场景应同时透传 Upgrade 请求
bridge_path=/ws
# 客户端详情保留的最近连接历史条数；0 关闭，最大 100
client_history_limit=5

###########################################################################
# 客户端认证与连接限制
###########################################################################
# 客户端连接服务端的公共验证密钥；留空则禁止使用公共密钥连接
public_vkey=
# 新版 NPC Bridge 握手允许的客户端时间偏差，单位为秒；仅 1.1.29 及以上生效
# 0 表示不校验时间戳，但每次连接仍使用一次性随机挑战
auth_time_window=300
# 是否按客户端来源 IP 限制连接；true 启用、false 禁用，留空则忽略
#ip_limit=true
# 公共 IP 登记密钥；填写后可在 /ip/register 页面登记当前访问者 IP，登记对所有启用“仅允许已登记 IP”的资源生效
public_register_key=
# IP 登记页面默认最长有效期（小时）；客户端可进一步设置更短的上限
ip_register_max_hours=2
# 可选：独立 IP 登记监听。端口为 0 时不额外监听，仅使用管理面板的 /ip/register 页面
ip_register_ip=127.0.0.1
ip_register_port=0
# 同时填写证书与私钥后，独立登记监听使用 HTTPS；路径相对程序运行目录
ip_register_cert_file=
ip_register_key_file=

###########################################################################
# 流量与日志
###########################################################################
# 流量数据持久化间隔，单位为分钟；留空或 0 表示不持久化
flow_store_interval=1
# 日志级别：0 紧急、1 警报、2 严重、3 错误、4 警告、5 通知、6 信息、7 调试
log_level=6
# 日志文件路径；相对路径以程序运行目录为准
log_path=nps.log
# 单个日志文件大小上限（MB）；超过后切割，0 表示不按大小切割
log_max_size=2
# 日志归档保留数量上限；0 表示不限制数量
log_max_files=10
# 日志归档保留天数；0 表示不按天数清理
log_max_days=7
# 是否压缩轮转后的日志归档
log_compress=false
# 是否在日期变化时轮转日志
log_rotate_daily=true
# 管理操作审计日志路径；相对路径以程序运行目录为准，文件权限为仅所有者可读写
audit_log_path=audit.log

###########################################################################
# P2P 中继配置（可选，取消注释后启用）
###########################################################################
# P2P 中继监听 IP；对外服务时通常设为 0.0.0.0
#p2p_ip=127.0.0.1
# P2P 中继监听端口；配置后才会启动 P2P 服务
#p2p_port=6000

###########################################################################
# 管理面板配置
###########################################################################
# 管理面板对应的域名；端口复用场景用于区分面板流量
web_host=a.o.com
# 管理面板管理员用户名
web_username=admin
# 管理面板管理员密码；首次启动时会替换为随机值
web_password=CHANGE_ME
# 管理员登录 TOTP 密钥；留空关闭。使用 nps -gen2fa 生成后填入并重启
totp_secret=
# 管理面板监听端口
web_port = 8081
# 管理面板监听 IP；新安装默认仅本机访问。远程访问应通过 HTTPS 反向代理，或显式配置受控管理网段。
web_ip=127.0.0.1
# 管理面板 URL 前缀；反向代理到子路径时填写，例如 /nps
web_base_url=
# Web 会话实例密钥路径；留空时使用 conf/instance.key
instance_key_file=
# 是否为管理面板启用 HTTPS
web_open_ssl=false
# 管理面板 HTTPS 证书文件路径；web_open_ssl=true 时生效
web_cert_file=conf/server.pem
# 管理面板 HTTPS 私钥文件路径；web_open_ssl=true 时生效
web_key_file=conf/server.key
# 子路径部署示例：访问 https://example.com/nps 时使用
#web_base_url=/nps

###########################################################################
# Web API 认证配置
###########################################################################
# Web API 认证密钥；首次启动时会替换为随机值
auth_key=CHANGE_ME
# 获取服务端 auth_key 使用的 AES 密钥，必须恰好为 16 个字符；首次启动时会替换为随机值
auth_crypt_key =CHANGE_ME_16CHAR

###########################################################################
# 端口权限配置（可选）
###########################################################################
# 限制客户端可映射的端口范围，例如 9001-9009,10001,11000-12000
#allow_ports=9001-9009,10001,11000-12000

###########################################################################
# 管理面板多用户配置
###########################################################################
# 是否允许普通用户登录管理面板
allow_user_login=true
# 是否允许普通用户自行注册管理面板账号
allow_user_register=false
# 是否允许普通用户修改自己的用户名
allow_user_change_username=true

###########################################################################
# 客户端资源与代理功能开关
###########################################################################
# 是否允许在管理面板为客户端设置总流量上限
allow_flow_limit=true
# 是否允许在管理面板为客户端设置带宽上限
allow_rate_limit=true
# 是否允许在管理面板为客户端设置最大隧道数
allow_tunnel_num_limit=true
# 是否允许客户端使用本地代理访问目标地址
allow_local_proxy=false
# 是否允许在管理面板为客户端设置最大连接数
allow_connection_num_limit=true
# 是否允许每个隧道绑定不同的服务端监听 IP
allow_multi_ip=true
# 是否在管理面板仪表盘显示 CPU、内存和网络等系统信息
system_info_display=true

###########################################################################
# HTTP 转发与缓存
###########################################################################
# 是否向后端请求添加客户端真实 IP 相关请求头
http_add_origin_header=true
# 是否启用 HTTP 响应缓存
http_cache=false
# HTTP 缓存队列长度；仅在 http_cache=true 时生效
http_cache_length=100

###########################################################################
# 性能调试（可选，仅建议在内网临时开启）
###########################################################################
# pprof 监听 IP
#pprof_ip=127.0.0.1
# pprof 监听端口
#pprof_port=9999

###########################################################################
# 连接保活与 TLS
###########################################################################
# 未收到 mux 心跳回包的最大次数；每次检查间隔为 5 秒
disconnect_timeout=60
# 是否在管理面板登录时启用验证码
open_captcha=false
# 是否启用管理面板登录工作量证明
force_pow=false
# PoW 难度（SHA-256 前导零位数）
pow_bits=20
# 是否启用 Bridge TLS 加密监听
tls_enable=true
# Bridge TLS 加密监听端口；tls_enable=true 时生效
tls_bridge_port=8025
# 旧配置键 bridge_tls_port 会在升级时映射到 tls_bridge_port；原字段不会被删除
