# [common] 节为客户端公共连接配置；其余节为命名的代理任务。
# server_addr：NPS 地址（IP:端口）；vkey：客户端验证密钥；conn_type：tcp 或 kcp。
# auto_reconnection：断线自动重连；max_conn/flow_limit/rate_limit：连接数、流量和速率限制。
# basic_username/basic_password：HTTP 基础认证；web_username/web_password：客户端 Web 认证。
# crypt/compress：是否启用加密和压缩；disconnect_timeout：断线检测检查次数（每次约 5 秒）；tls_enable：是否使用 TLS。
# tls_ca_file：用于验证服务端证书的 CA 文件；tls_server_name：TLS SNI/证书名称；
# tls_fingerprint：服务端证书 SHA-256 指纹（自签名证书推荐）；
# tls_insecure_skip_verify：仅为兼容旧部署显式关闭证书校验，生产环境不要启用。
# health_check_*：健康检查超时、失败次数、间隔、类型（http/tcp）和目标地址。
# mode：tcp/udp/httpProxy/socks5/file/secret/p2p；target_addr：内网目标；server_port：服务端端口。
# local_path/strip_pre：文件代理本地目录和路径前缀；multi_account：多账号文件路径。

[common]
server_addr=127.0.0.1:8024
conn_type=tcp
vkey=123
auto_reconnection=true
max_conn=1000
flow_limit=1000
rate_limit=1000
basic_username=11
basic_password=3
web_username=user
web_password=1234
crypt=true
compress=true
#pprof_addr=0.0.0.0:9999
disconnect_timeout=60
tls_enable=false
# tls_fingerprint=填入服务端启动日志中的 SHA-256 指纹
# tls_ca_file=/path/to/ca.pem

[health_check_test1]
health_check_timeout=1
health_check_max_failed=3
health_check_interval=1
health_http_url=/
health_check_type=http
health_check_target=127.0.0.1:8083,127.0.0.1:8082

[health_check_test2]
health_check_timeout=1
health_check_max_failed=3
health_check_interval=1
health_check_type=tcp
health_check_target=127.0.0.1:8083,127.0.0.1:8082

[web]
host=c.o.com
target_addr=127.0.0.1:8083,127.0.0.1:8082

[tcp]
mode=tcp
target_addr=127.0.0.1:8080
server_port=10000

[socks5]
mode=socks5
server_port=19009
multi_account=multi_account.conf

[file]
mode=file
server_port=19008
local_path=/Users/liuhe/Downloads
strip_pre=/web/

[http]
mode=httpProxy
server_port=19004

[udp]
mode=udp
server_port=12253
target_addr=114.114.114.114:53

[ssh_secret]
mode=secret
password=ssh2
target_addr=123.206.77.88:22

[ssh_p2p]
mode=p2p
password=ssh3

[secret_ssh]
local_port=2001
password=ssh2

[p2p_ssh]
local_port=2002
password=ssh3
target_addr=123.206.77.88:22
