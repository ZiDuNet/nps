# NPC 配置文件模板
#
# 本文件用于配置文件模式：./npc -config=conf/npc.conf
# 常规部署建议使用无配置文件模式：./npc -server=<NPS地址:端口> -vkey=<VerifyKey>
# 下面的规则示例默认全部注释。复制本文件后，只取消需要的规则，并替换所有示例凭据。

[common]
# NPS Bridge 地址；兼容旧键名 server
server_addr=127.0.0.1:8024
# Bridge 类型：tcp、kcp、ws、wss 或 quic；兼容旧键名 tp
conn_type=tcp
# WebSocket Bridge 路径；需与服务端 bridge_path 相同，默认 /ws
bridge_path=/ws
# QUIC Bridge 的 ALPN；需与服务端 quic_alpn 相同，默认 nps
quic_alpn=nps
# 客户端验证密钥
vkey=replace-with-verify-key
# 断线后自动重连
auto_reconnection=true

# 可选：通过 HTTP/HTTPS CONNECT、SOCKS4/4a、SOCKS5/SOCKS5H 出站代理连接 NPS
#proxy_url=socks5h://user:password@127.0.0.1:1080
# 可选：目标地址解析使用的 DNS 服务器，多个服务器用逗号分隔
#dns_server=1.1.1.1,8.8.8.8
# 新版客户端校时服务器与校时周期（分钟），留空关闭
#ntp_server=pool.ntp.org
#ntp_interval=5
# 绑定本地出口 IP；local_ip_forward=true 时也用于公网目标的隧道转发出口
#local_ip=127.0.0.1
#local_ip_forward=false
# P2P 建连失败时回退到 Secret，需同时配置对应 Secret 密钥
#fallback_secret=
# 可选：向已启用 allow_secret_link 的新版服务端发送 Secret Link 元数据。
# 旧服务端不会识别该帧，连接旧服务端时保持关闭。
#secret_link=false
# 禁止服务端下发远程升级指令（仅新版客户端生效）
#disable_remote_update=false
# 可选：客户端显示备注
#remark=office-client
# 可选：客户端数据连接数、带宽（KB/s）和流量（MB）限制
# 带宽按 1 KB/s = 1024 B/s，流量按 1 MB = 1024 × 1024 B 换算
#max_conn=1000
#rate_limit=1000
#flow_limit=1000
# 可选：HTTP 正向代理、SOCKS5 和 Host 规则使用的 Basic 认证
#basic_username=
#basic_password=
# 旧版客户端 Web 登录兼容账号（通常不需要）
#web_username=
#web_password=

# Bridge 数据传输选项
#crypt=true
#compress=true
# 心跳检查次数；每次检查间隔约 5 秒
disconnect_timeout=60

# TLS Bridge。启用后连接服务端 tls_bridge_port（默认 8025）。
tls_enable=false
# 自签名证书可指定 CA、SNI 或证书 SHA-256 指纹；生产环境不要跳过校验。
#tls_ca_file=/etc/nps/server-ca.pem
#tls_server_name=nps.example.com
#tls_fingerprint=sha256:replace-with-certificate-fingerprint
#tls_insecure_skip_verify=false

# 可选调试端口，仅建议在受控网络启用
#pprof_addr=127.0.0.1:9999

###########################################################################
# HTTP(S) Host 规则
###########################################################################
# Host 规则不填写 mode，由 host 字段识别。DNS 必须解析到 NPS。
#
#[web_app]
#host=app.example.com
#target_addr=127.0.0.1:8080,127.0.0.1:8081
# 可选：此规则的独立上下行限速（KB/s）；0 或留空表示不限速
# 上行是访问者到内网服务，下行是内网服务到访问者；同一条规则的连接共享额度
#upload_limit=0
#download_limit=0
#scheme=all
#location=/
#host_change=app.internal
# 可选：HTTP 入口自动跳转到 HTTPS；仅开启 HTTPS 入口时生效
#auto_https=false
# 可选：Host 级 Basic 认证，格式 用户名:密码；优先于客户端公共 Basic
#auth=alice:replace-with-password
# 可选：将 PROXY Protocol 来源信息发给支持该协议的后端（0 关闭、1 v1、2 v2）
#proxy_protocol=0
# 路径重写：每行一条 old => new 规则
#path_rewrite=/api => /v1/api
# 可选：配置后对此规则返回 307，不再转发到 target_addr
#redirect_url=https://example.com{path}
# 可选：按需开启 CORS 和标准反代兼容路径
#auto_cors=false
#compat_mode=false
#header_X-Environment=production
#header_X-Proxy-Source=npc
#response_Cache-Control=no-cache
# 后端使用 HTTPS 时启用；https_just_proxy=true 表示原样透传 TLS
#target_is_https=false
#https_just_proxy=false
#auto_ssl=false
#tls_offload=false

###########################################################################
# TCP、UDP 与端口范围映射
###########################################################################
#[tcp_ssh]
#mode=tcp
#target_addr=127.0.0.1:22
#server_port=10022
# 可选：开启 PROXY Protocol（0 关闭、1 v1、2 v2）。旧键 proto_version=V1/V2 仍兼容。
#proxy_protocol=0
#upload_limit=0
#download_limit=0

#[tcp_rdp]
#mode=tcp
#target_addr=192.168.10.20:3389
#server_port=13389
# 可选：开启 allow_multi_ip 后绑定指定 NPS 监听 IP
#server_ip=0.0.0.0

#[udp_dns]
#mode=udp
#target_addr=127.0.0.1:53
#server_port=5353
#upload_limit=0
#download_limit=0

#[tcp_range]
#mode=tcp
#server_port=9001-9003,9010
#target_port=8001-8003,8010
#target_ip=192.168.10.20

###########################################################################
# HTTP 正向代理、SOCKS5 与文件访问
###########################################################################
#[http_forward]
#mode=httpProxy
#server_port=18080

#[mixed_proxy]
#mode=mixProxy
#server_port=18081
# 可选：至少启用一种；两项都省略或都设为 false 时兼容为两者都启用
#http_proxy=true
#socks5_proxy=true
# 目标 ACL：0 关闭、1 白名单、2 黑名单
#dest_acl_mode=0
#dest_acl_rules=10.0.0.0/8,geosite:private

#[socks_outbound]
#mode=socks5
#server_port=19009
#multi_account=conf/multi_account.conf

#[file_share]
#mode=file
#server_port=19008
#local_path=/srv/share
#strip_pre=/files/

###########################################################################
# Secret 与 P2P
###########################################################################
#[secret_ssh]
#mode=secret
#password=replace-with-secret
#target_type=tcp
#target_addr=127.0.0.1:22

#[p2p_ssh]
#mode=p2p
#password=replace-with-p2p-secret
#target_type=tcp
#target_addr=127.0.0.1:22

# 不含 mode 的 secret/p2p 节为本地访问端。节名称必须以 secret 或 p2p 开头。
#[secret_access]
#local_port=2001
#local_ip=127.0.0.1
#password=replace-with-secret
#target_type=tcp
#fallback_secret=false
#local_proxy=false

#[p2p_access]
#local_port=2002
#local_ip=127.0.0.1
#password=replace-with-p2p-secret
#target_addr=127.0.0.1:22
#target_type=tcp
#fallback_secret=true
#local_proxy=false

###########################################################################
# 后端健康检查
###########################################################################
# 健康检查节名称必须以 health 开头。
# 配置文件模式可直接使用本地健康检查；Web 面板配置会由支持 1.1.29 及以上版本的 NPS/NPC
# 通过兼容的控制消息下发。旧版 NPC 会继续使用本地配置，不会收到新控制消息。
#[health_api]
#health_check_timeout=2
#health_check_max_failed=3
#health_check_interval=10
#health_http_url=/healthz
#health_check_type=http
#health_check_target=127.0.0.1:8080,127.0.0.1:8081
