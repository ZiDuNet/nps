<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>NPS 全球安装地图</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="logo.svg" type="image/svg+xml">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f172a; color: #e2e8f0; }
        .header {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            padding: 16px 32px;
            display: flex; align-items: center; justify-content: space-between;
            border-bottom: 1px solid #1e3a5f;
        }
        .header h1 { font-size: 20px; font-weight: 600; }
        .header h1 span { color: #3b82f6; }
        .header-links a { color: #64748b; text-decoration: none; margin-left: 20px; font-size: 14px; }
        .header-links a:hover { color: #3b82f6; }
        .stats-bar {
            display: flex; gap: 32px; padding: 20px 32px;
            background: #1e293b; border-bottom: 1px solid #1e3a5f;
        }
        .stat-item { text-align: center; }
        .stat-item .number { font-size: 28px; font-weight: 700; color: #3b82f6; }
        .stat-item .label { font-size: 13px; color: #64748b; margin-top: 4px; }
        #map-container { width: 100%; height: calc(100vh - 140px); }
        .msg {
            display: flex; align-items: center; justify-content: center;
            height: calc(100vh - 140px); color: #475569; font-size: 16px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>NPS <span>Global Map</span></h1>
        <div class="header-links">
            <a href="index.html#/README">文档</a>
            <a href="https://github.com/ZiDuNet/nps">GitHub</a>
        </div>
    </div>
    <div class="stats-bar">
        <div class="stat-item">
            <div class="number" id="total-nps">0</div>
            <div class="label">NPS Server</div>
        </div>
        <div class="stat-item">
            <div class="number" id="total-npc">0</div>
            <div class="label">NPC Client</div>
        </div>
        <div class="stat-item">
            <div class="number" id="total-countries">0</div>
            <div class="label">Countries</div>
        </div>
    </div>
    <div id="map-container"><div class="msg">Loading...</div></div>

    <script src="https://unpkg.com/echarts@5/dist/echarts.min.js"></script>
    <script src="https://unpkg.com/echarts@4/map/js/world.js"></script>
    <script>
    var API = 'https://nps-telemetry.wushuo224.workers.dev/stats';

    var COUNTRY_NAMES = {
        AF:'Afghanistan',AL:'Albania',DZ:'Algeria',AD:'Andorra',AO:'Angola',AG:'Antigua and Barbuda',
        AR:'Argentina',AM:'Armenia',AU:'Australia',AT:'Austria',AZ:'Azerbaijan',BS:'Bahamas',
        BH:'Bahrain',BD:'Bangladesh',BB:'Barbados',BY:'Belarus',BE:'Belgium',BZ:'Belize',
        BJ:'Benin',BT:'Bhutan',BO:'Bolivia',BA:'Bosnia and Herzegovina',BW:'Botswana',BR:'Brazil',
        BN:'Brunei',BG:'Bulgaria',BF:'Burkina Faso',BI:'Burundi',KH:'Cambodia',CM:'Cameroon',
        CA:'Canada',CV:'Cape Verde',CF:'Central African Republic',TD:'Chad',CL:'Chile',
        CN:'China',CO:'Colombia',KM:'Comoros',CG:'Congo',CD:'Dem. Rep. Congo',CR:'Costa Rica',
        CI:'Ivory Coast',HR:'Croatia',CU:'Cuba',CY:'Cyprus',CZ:'Czech Rep.',DK:'Denmark',
        DJ:'Djibouti',DM:'Dominica',DO:'Dominican Rep.',EC:'Ecuador',EG:'Egypt',SV:'El Salvador',
        GQ:'Eq. Guinea',ER:'Eritrea',EE:'Estonia',ET:'Ethiopia',FJ:'Fiji',FI:'Finland',
        FR:'France',GA:'Gabon',GM:'Gambia',GE:'Georgia',DE:'Germany',GH:'Ghana',GR:'Greece',
        GD:'Grenada',GT:'Guatemala',GN:'Guinea',GW:'Guinea-Bissau',GY:'Guyana',HT:'Haiti',
        HN:'Honduras',HU:'Hungary',IS:'Iceland',IN:'India',ID:'Indonesia',IR:'Iran',IQ:'Iraq',
        IE:'Ireland',IL:'Israel',IT:'Italy',JM:'Jamaica',JP:'Japan',JO:'ordan',KZ:'Kazakhstan',
        KE:'Kenya',KI:'Kiribati',KP:'North Korea',KR:'South Korea',KW:'Kuwait',KG:'Kyrgyzstan',
        LA:'Laos',LV:'Latvia',LB:'Lebanon',LS:'Lesotho',LR:'Liberia',LY:'Libya',LI:'Liechtenstein',
        LT:'Lithuania',LU:'Luxembourg',MK:'Macedonia',MG:'Madagascar',MW:'Malawi',MY:'Malaysia',
        MV:'Maldives',ML:'Mali',MT:'Malta',MH:'Marshall Islands',MR:'Mauritania',MU:'Mauritius',
        MX:'Mexico',FM:'Micronesia',MD:'Moldova',MC:'Monaco',MN:'Mongolia',ME:'Montenegro',
        MA:'Morocco',MZ:'Mozambique',MM:'Myanmar',NA:'Namibia',NR:'Nauru',NP:'Nepal',
        NL:'Netherlands',NZ:'New Zealand',NI:'Nicaragua',NE:'Niger',NG:'Nigeria',NO:'Norway',
        OM:'Oman',PK:'Pakistan',PW:'Palau',PA:'Panama',PG:'Papua New Guinea',PY:'Paraguay',
        PE:'Peru',PH:'Philippines',PL:'Poland',PT:'Portugal',QA:'Qatar',RO:'Romania',
        RU:'Russia',RW:'Rwanda',KN:'Saint Kitts',LC:'Saint Lucia',VC:'Saint Vincent',
        WS:'Samoa',SM:'San Marino',ST:'Sao Tome and Principe',SA:'Saudi Arabia',SN:'Senegal',
        RS:'Serbia',SC:'Seychelles',SL:'Sierra Leone',SG:'Singapore',SK:'Slovakia',
        SI:'Slovenia',SB:'Solomon Is.',SO:'Somalia',ZA:'South Africa',SS:'South Sudan',
        ES:'Spain',LK:'Sri Lanka',SD:'Sudan',SR:'Suriname',SZ:'Swaziland',SE:'Sweden',
        CH:'Switzerland',SY:'Syria',TW:'Taiwan',TJ:'Tajikistan',TZ:'Tanzania',TH:'Thailand',
        TL:'Timor-Leste',TG:'Togo',TO:'Tonga',TT:'Trinidad and Tobago',TN:'Tunisia',
        TR:'Turkey',TM:'Turkmenistan',TV:'Tuvalu',UG:'Uganda',UA:'Ukraine',AE:'U.A.E.',
        GB:'United Kingdom',US:'United States',UY:'Uruguay',UZ:'Uzbekistan',VU:'Vanuatu',
        VE:'Venezuela',VN:'Vietnam',YE:'Yemen',ZM:'Zambia',ZW:'Zimbabwe'
    };

    // 国家中心经纬度（用于散点图）
    var COUNTRY_COORDS = {
        CN:[104.19,35.86],US:[-95.71,37.09],GB:[-1.17,52.36],DE:[10.45,51.17],
        FR:[2.21,46.23],JP:[138.25,36.20],KR:[127.77,35.91],SG:[103.82,1.35],
        AU:[133.78,-25.27],CA:[-106.35,56.13],RU:[105.32,61.52],IN:[78.96,20.59],
        BR:[-51.93,-14.24],MX:[-102.55,23.63],IT:[12.57,41.87],ES:[-3.75,40.46],
        NL:[5.29,52.13],SE:[18.64,60.13],CH:[8.23,46.82],NO:[8.47,60.47],
        FI:[25.75,61.92],DK:[9.50,56.26],AT:[14.55,47.52],BE:[4.47,50.50],
        PL:[19.15,51.92],CZ:[15.47,49.82],PT:[-8.22,39.40],IE:[-8.24,53.41],
        ZA:[22.94,-30.56],NG:[8.68,9.08],EG:[30.80,26.82],KE:[37.91,-0.02],
        TH:[100.99,15.87],VN:[108.28,14.06],MY:[4.21,101.98],ID:[113.92,-0.79],
        PH:[121.77,12.88],TW:[120.96,23.70],HK:[114.17,22.32],PK:[69.35,30.38],
        BD:[90.36,23.68],TR:[35.92,38.96],SA:[45.08,23.89],AE:[53.85,23.42],
        IL:[34.85,31.05],NZ:[174.89,-40.90],AR:[-63.62,-38.42],CL:[-71.54,-35.68],
        CO:[-74.30,4.57],PE:[-75.02,-9.19],UA:[48.38,48.38],RO:[24.97,45.94],
        CZ:[15.47,49.82],HU:[19.50,47.16],GR:[21.82,39.07],CZ:[15.47,49.82]
    };

    var chart = echarts.init(document.getElementById('map-container'));

    function loadData() {
        fetch(API).then(function(r) { return r.json(); }).then(function(data) {
            document.getElementById('total-nps').textContent = (data.total_nps || 0).toLocaleString();
            document.getElementById('total-npc').textContent = (data.total_npc || 0).toLocaleString();
            document.getElementById('total-countries').textContent = Object.keys(data.countries || {}).length;
            renderMap(data);
        }).catch(function() {});
    }

    function renderMap(data) {
        var mapData = [];
        var scatterData = [];
        var countries = data.countries || {};
        var maxVal = 10;

        for (var code in countries) {
            var info = countries[code];
            var name = COUNTRY_NAMES[code] || code;
            var val = (info.nps || 0) + (info.npc || 0);
            if (val > maxVal) maxVal = val;
            mapData.push({ name: name, value: val, nps: info.nps || 0, npc: info.npc || 0 });
            // 发光散点
            var coord = COUNTRY_COORDS[code];
            if (coord) {
                scatterData.push({ name: name, value: coord.concat(val), nps: info.nps || 0, npc: info.npc || 0 });
            }
        }

        chart.setOption({
            backgroundColor: '#0f172a',
            tooltip: {
                trigger: 'item',
                backgroundColor: '#1e293b', borderColor: '#1e3a5f',
                textStyle: { color: '#e2e8f0', fontSize: 13 },
                formatter: function(p) {
                    if (p.seriesType === 'effectScatter') {
                        return '<b>' + p.name + '</b><br/>NPS: ' + p.data.nps + '<br/>NPC: ' + p.data.npc + '<br/>Total: ' + p.data.value[2];
                    }
                    if (p.data && p.data.nps) {
                        return '<b>' + p.name + '</b><br/>NPS: ' + p.data.nps + '<br/>NPC: ' + p.data.npc;
                    }
                    return p.name;
                }
            },
            visualMap: {
                min: 0, max: maxVal,
                text: ['High', 'Low'],
                realtime: false, calculable: true,
                inRange: { color: ['#1e3a5f', '#2563eb', '#3b82f6', '#60a5fa', '#93c5fd'] },
                textStyle: { color: '#64748b' }, left: 20, bottom: 30
            },
            geo: {
                map: 'world', roam: true,
                scaleLimit: { min: 1, max: 20 },
                itemStyle: { areaColor: '#1e293b', borderColor: '#334155', borderWidth: 0.5 },
                emphasis: { label: { show: true, color: '#fff' }, itemStyle: { areaColor: '#2563eb' } }
            },
            series: [
                {
                    type: 'map', map: 'world', geoIndex: 0,
                    data: mapData
                },
                {
                    type: 'effectScatter',
                    coordinateSystem: 'geo',
                    rippleEffect: { brushType: 'stroke', scale: 4 },
                    symbolSize: function(val) { return Math.max(val * 1.5, 10); },
                    itemStyle: { color: '#60a5fa', shadowBlur: 10, shadowColor: '#3b82f6' },
                    data: scatterData
                }
            ]
        });
    }

    // 初始渲染空地图
    chart.setOption({
        backgroundColor: '#0f172a',
        geo: {
            map: 'world', roam: true,
            scaleLimit: { min: 1, max: 20 },
            itemStyle: { areaColor: '#1e293b', borderColor: '#334155', borderWidth: 0.5 },
            emphasis: { label: { show: true, color: '#fff' }, itemStyle: { areaColor: '#2563eb' } }
        }
    });

    loadData();
    setInterval(loadData, 300000);
    window.addEventListener('resize', function() { chart.resize(); });
    </script>
</body>
</html>
