<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>NPS 文档 - 内网穿透代理服务器</title>
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1"/>

    <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">

        .sidebar-nav > ul > li > p { font-weight: 600; }
        .markdown-section code { border-radius: 4px; }

<body>
<div id="app">加载中...</div>
<script src="//cdn.jsdelivr.net/npm/docsify-edit-on-github/index.js"></script>
<script>

        name: 'NPS',
        nameLink: '#/README',
        repo: 'ZiDuNet/nps',

        coverpage: true,
        loadNavbar: true,
        subMaxLevel: 2,

            noData: '没有结果',
            paths: 'auto',
            placeholder: '搜索',
            hideOtherSidebarContent: true,
        },
        plugins: [
            EditOnGithubPlugin.create('https://github.com/ZiDuNet/nps/tree/master/docs/', '', '在 GitHub 上编辑'),
        ],
    }
</script>
<script src="//cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
<script src="//cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
