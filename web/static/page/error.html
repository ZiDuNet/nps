<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <meta name="description" content="NPS 404 页面">
    <title>NPS | 页面未找到</title>
    <style>
        :root {
            color-scheme: light;
            --canvas: #f4f8fc;
            --surface: #ffffff;
            --surface-subtle: #f7faff;
            --ink: #12233f;
            --muted: #536985;
            --faint: #617694;
            --line: #dce6f1;
            --line-strong: #c4d3e3;
            --accent: #2563eb;
            --accent-strong: #1d4ed8;
            --accent-soft: #e8f1ff;
            --warning: #b66a06;
            --warning-soft: #fff4dc;
            --shadow: 0 18px 45px rgba(34, 64, 101, .10);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                color-scheme: dark;
                --canvas: #0e1727;
                --surface: #152238;
                --surface-subtle: #1a2a43;
                --ink: #edf4ff;
                --muted: #b3c4dc;
                --faint: #8ea4c2;
                --line: #2a3e5a;
                --line-strong: #3b5577;
                --accent: #6ea0ff;
                --accent-strong: #91b7ff;
                --accent-soft: #203b6b;
                --warning: #f4c574;
                --warning-soft: #4d371e;
                --shadow: 0 18px 45px rgba(0, 0, 0, .28);
            }

            .action-primary,
            .action-primary:hover { color: #071326; }
        }

        * { box-sizing: border-box; }

        html, body { min-height: 100%; }

        body {
            display: grid;
            min-width: 320px;
            min-height: 100vh;
            margin: 0;
            padding: 24px;
            color: var(--ink);
            background: var(--canvas);
            font-family: "Fira Sans", "Noto Sans SC", "Microsoft YaHei", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            font-size: 16px;
            line-height: 1.55;
        }

        a { color: inherit; }

        a:focus-visible,
        button:focus-visible {
            outline: 3px solid var(--accent);
            outline-offset: 3px;
        }

        .error-shell {
            display: grid;
            grid-template-rows: auto 1fr auto;
            width: min(100%, 960px);
            min-height: min(680px, calc(100vh - 48px));
            margin: auto;
            overflow: hidden;
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 8px;
            box-shadow: var(--shadow);
        }

        .error-header,
        .error-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            padding: 22px 32px;
            border-color: var(--line);
        }

        .error-header { border-bottom: 1px solid var(--line); }

        .brand {
            display: inline-flex;
            align-items: center;
            min-width: 0;
            gap: 12px;
            text-decoration: none;
        }

        .brand-mark {
            display: inline-grid;
            width: 40px;
            height: 40px;
            flex: 0 0 40px;
            place-items: center;
            color: var(--accent);
            background: var(--accent-soft);
            border: 1px solid var(--line-strong);
            border-radius: 8px;
        }

        .brand-mark svg { width: 21px; height: 21px; }

        .brand-copy {
            display: grid;
            gap: 1px;
            min-width: 0;
        }

        .brand-copy strong {
            font-size: 18px;
            line-height: 1.2;
            letter-spacing: .02em;
        }

        .brand-copy span {
            overflow: hidden;
            color: var(--muted);
            font-size: 12px;
            line-height: 1.35;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .status-chip {
            display: inline-flex;
            align-items: center;
            flex: 0 0 auto;
            gap: 8px;
            padding: 7px 10px;
            color: var(--warning);
            background: var(--warning-soft);
            border: 1px solid var(--line-strong);
            border-radius: 6px;
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: .04em;
        }

        .status-chip::before {
            width: 7px;
            height: 7px;
            content: "";
            background: currentColor;
            border-radius: 50%;
        }

        .error-content {
            display: grid;
            grid-template-columns: minmax(0, 1.1fr) minmax(260px, .9fr);
            align-items: center;
            gap: clamp(32px, 7vw, 82px);
            padding: clamp(48px, 8vw, 88px) clamp(28px, 7vw, 76px);
        }

        .error-copy { min-width: 0; }

        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin: 0 0 18px;
            color: var(--accent-strong);
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: .08em;
            text-transform: uppercase;
        }

        .eyebrow::before {
            width: 24px;
            height: 2px;
            content: "";
            background: var(--accent);
        }

        .error-code {
            margin: 0;
            color: var(--ink);
            font-size: clamp(96px, 16vw, 164px);
            font-weight: 800;
            line-height: .82;
            letter-spacing: 0;
        }

        .error-code span { color: var(--accent); }

        .error-title {
            max-width: 18ch;
            margin: 30px 0 10px;
            font-size: clamp(28px, 4vw, 42px);
            font-weight: 750;
            line-height: 1.18;
            letter-spacing: 0;
        }

        .error-message {
            max-width: 46ch;
            margin: 0;
            color: var(--muted);
        }

        .error-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 30px;
        }

        .action {
            display: inline-flex;
            min-height: 44px;
            align-items: center;
            justify-content: center;
            padding: 10px 16px;
            border: 1px solid transparent;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 650;
            text-decoration: none;
            transition: background-color .15s ease, border-color .15s ease, color .15s ease, transform .15s ease;
        }

        .action:hover { transform: translateY(-1px); }

        .action-primary {
            color: #fff;
            background: var(--accent);
            border-color: var(--accent);
        }

        .action-primary:hover { color: #fff; background: var(--accent-strong); }

        .action-secondary {
            color: var(--accent-strong);
            background: transparent;
            border-color: var(--line-strong);
        }

        .action-secondary:hover { background: var(--accent-soft); }

        .route-card {
            position: relative;
            padding: 22px;
            background: var(--surface-subtle);
            border: 1px solid var(--line);
            border-radius: 8px;
        }

        .route-card::before,
        .route-card::after {
            position: absolute;
            width: 10px;
            height: 10px;
            content: "";
            border-color: var(--accent);
        }

        .route-card::before {
            top: -1px;
            left: -1px;
            border-top: 2px solid;
            border-left: 2px solid;
        }

        .route-card::after {
            right: -1px;
            bottom: -1px;
            border-right: 2px solid;
            border-bottom: 2px solid;
        }

        .route-card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--line);
            color: var(--muted);
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-size: 11px;
            letter-spacing: .06em;
            text-transform: uppercase;
        }

        .route-card-header strong { color: var(--accent-strong); font-weight: 700; }

        .route-map {
            display: grid;
            grid-template-columns: 1fr auto 1fr auto 1fr;
            align-items: center;
            gap: 8px;
            padding: 26px 0;
        }

        .route-node {
            display: grid;
            min-height: 66px;
            place-items: center;
            padding: 10px 6px;
            color: var(--ink);
            background: var(--surface);
            border: 1px solid var(--line-strong);
            border-radius: 6px;
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-size: 11px;
            font-weight: 700;
            text-align: center;
        }

        .route-node svg { width: 18px; height: 18px; margin-bottom: 5px; color: var(--accent); }

        .route-node-target { color: var(--muted); }

        .route-node-target svg { color: var(--faint); }

        .route-line {
            width: 100%;
            height: 1px;
            background: var(--line-strong);
        }

        .route-line-broken {
            height: 0;
            background: transparent;
            border-top: 1px dashed var(--accent);
        }

        .route-note {
            display: flex;
            align-items: flex-start;
            gap: 9px;
            margin: 0;
            padding-top: 15px;
            color: var(--muted);
            border-top: 1px solid var(--line);
            font-size: 13px;
        }

        .route-note svg { width: 17px; height: 17px; flex: 0 0 auto; color: var(--warning); }

        .error-footer {
            flex-wrap: wrap;
            border-top: 1px solid var(--line);
            color: var(--faint);
            font-size: 12px;
        }

        .error-footer p { margin: 0; }

        .error-footer a {
            color: var(--accent-strong);
            font-weight: 650;
            text-decoration: none;
        }

        .error-footer a:hover { text-decoration: underline; }

        .footer-meta {
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .footer-divider { color: var(--line-strong); }

        @media (max-width: 720px) {
            body { padding: 12px; }

            .error-shell { min-height: calc(100vh - 24px); }

            .error-header,
            .error-footer { padding: 18px 20px; }

            .error-content {
                grid-template-columns: 1fr;
                gap: 38px;
                padding: 44px 20px 52px;
            }

            .error-title { margin-top: 24px; }
        }

        @media (max-width: 460px) {
            .error-header { align-items: flex-start; flex-wrap: wrap; }

            .status-chip { padding: 6px 8px; font-size: 11px; }

            .brand-copy span { max-width: 145px; }

            .error-code { font-size: clamp(86px, 27vw, 124px); }

            .error-actions { display: grid; }

            .action { width: 100%; }

            .route-card { padding: 16px; }

            .route-map { gap: 5px; }

            .route-node { min-height: 60px; font-size: 10px; }

            .error-footer { align-items: flex-start; }

            .footer-meta { flex-wrap: wrap; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                scroll-behavior: auto !important;
                transition-duration: .01ms !important;
                animation-duration: .01ms !important;
                animation-iteration-count: 1 !important;
            }
        }
    </style>
</head>
<body>
    <main class="error-shell" aria-labelledby="error-title">
        <header class="error-header">
            <a class="brand" href="https://github.com/ZiDuNet/nps" rel="noopener noreferrer">
                <span class="brand-mark" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="3" width="6" height="6" rx="1"></rect>
                        <rect x="15" y="15" width="6" height="6" rx="1"></rect>
                        <path d="M6 9v3h12V9M6 12v3M18 12v3"></path>
                    </svg>
                </span>
                <span class="brand-copy">
                    <strong>NPS</strong>
                    <span>Network tunnel platform</span>
                </span>
            </a>
            <span class="status-chip" role="status">HTTP 404</span>
        </header>

        <section class="error-content">
            <div class="error-copy">
                <p class="eyebrow">Request not found</p>
                <p class="error-code" aria-hidden="true">4<span>0</span>4</p>
                <h1 id="error-title" class="error-title">这个页面还没有接入。</h1>
                <p class="error-message">请求的地址没有匹配到可用的代理规则，或者目标服务暂时不可达。请检查域名、路径和端口后重试。</p>
                <nav class="error-actions" aria-label="错误页操作">
                    <a class="action action-primary" href="/" onclick="if (history.length > 1) { history.back(); return false; }">返回上一页</a>
                    <a class="action action-secondary" href="https://github.com/ZiDuNet/nps" target="_blank" rel="noopener noreferrer">访问 GitHub</a>
                </nav>
            </div>

            <aside class="route-card" aria-label="请求路由状态">
                <div class="route-card-header">
                    <span>Route status</span>
                    <strong>unresolved</strong>
                </div>
                <div class="route-map" aria-hidden="true">
                    <div class="route-node">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="7" r="3"></circle><path d="M5 21v-2a4 4 0 0 1 4-4h6a4 4 0 0 1 4 4v2"></path></svg>
                        CLIENT
                    </div>
                    <span class="route-line"></span>
                    <div class="route-node">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2"></rect><path d="M8 8h8M8 12h8M8 16h5"></path></svg>
                        NPS
                    </div>
                    <span class="route-line route-line-broken"></span>
                    <div class="route-node route-node-target">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M7 9h.01M11 9h.01M15 9h.01M7 13h10"></path></svg>
                        TARGET
                    </div>
                </div>
                <p class="route-note">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v4M12 16h.01"></path></svg>
                    <span>没有找到对应的 Host 规则或可用后端。</span>
                </p>
            </aside>
        </section>

        <footer class="error-footer">
            <p>请求失败并不代表隧道服务已停止。</p>
            <p class="footer-meta">
                <span>By：<a href="https://github.com/ZiDuNet/nps" target="_blank" rel="noopener noreferrer">WuShuo</a></span>
                <span class="footer-divider" aria-hidden="true">/</span>
                <a href="https://github.com/ZiDuNet/nps" target="_blank" rel="noopener noreferrer">GitHub 项目</a>
            </p>
        </footer>
    </main>
</body>
</html>
