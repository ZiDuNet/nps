<link href="{{.web_base_url}}/static/css/nps-audit.css?v={{.version}}" rel="stylesheet">
<script src="{{.web_base_url}}/static/js/nps-audit.js?v={{.version}}"></script>
<section class="wrapper wrapper-content animated fadeInRight management-page management-page--audit audit-hub" aria-labelledby="audit-list-title">
    <header class="dashboard-page-header management-page-header">
        <div>
            <div class="dashboard-page-kicker" data-i18n-zh="安全与运维" data-i18n-en="Security and operations">安全与运维</div>
            <h1 id="audit-list-title" data-i18n-zh="审计与连接" data-i18n-en="Audit and connections">审计与连接</h1>
            <p data-i18n-zh="追踪登录与管理操作，排查客户端及代理连接。展开记录查看完整元数据；不记录密码、Token、验证码或业务正文。" data-i18n-en="Trace sign-ins, management actions and client or proxy connections. Expand an event for full metadata; passwords, tokens, verification codes and payloads are never recorded.">追踪登录与管理操作，排查客户端及代理连接。展开记录查看完整元数据；不记录密码、Token、验证码或业务正文。</p>
        </div>
    </header>
    <div class="audit-hub__top">
        <div class="audit-hub__tabs" role="tablist" aria-label="审计内容">
            <button type="button" class="audit-hub__tab is-active" id="audit-tab-operations" role="tab" aria-selected="true" aria-controls="audit-view-operations" data-audit-view="operations"><i class="fa fa-list-alt" aria-hidden="true"></i><span data-i18n-zh="管理操作与登录" data-i18n-en="Actions and sign-ins">管理操作与登录</span></button>
            <button type="button" class="audit-hub__tab" id="audit-tab-connections" role="tab" aria-selected="false" aria-controls="audit-view-connections" tabindex="-1" data-audit-view="connections"><i class="fa fa-plug" aria-hidden="true"></i><span data-i18n-zh="客户端与代理连接" data-i18n-en="Client and proxy connections">客户端与代理连接</span></button>
        </div>
        <p class="audit-hub__hint"><i class="fa fa-info-circle" aria-hidden="true"></i><span data-i18n-zh="展开查看原始事件 · 列菜单可显示更多字段" data-i18n-en="Expand for raw events · More fields in Columns">展开查看原始事件 · 列菜单可显示更多字段</span></p>
    </div>

    <div class="audit-hub__view is-active" id="audit-view-operations" role="tabpanel" aria-labelledby="audit-tab-operations">
        <section class="panel ibox float-e-margins management-table-card nps-panel">
            <div class="ibox-content management-table-content">
                <div class="audit-log-state" role="status" aria-live="polite" id="audit-log-state"><span class="audit-log-state__count">—</span><span class="audit-log-state__message" data-i18n-zh="正在读取操作审计…" data-i18n-en="Loading audit journal…">正在读取操作审计…</span></div>
                <div id="audit-toolbar" class="management-table-toolbar">
                    <label class="nps-table-filter" for="audit-action"><span class="nps-table-filter__label" data-i18n-zh="动作" data-i18n-en="Action">动作</span>
                        <select id="audit-action" name="action" class="form-control nps-table-filter__control" data-nps-table-filter="action" aria-label="动作">
                            <option value="" data-i18n-zh="全部动作" data-i18n-en="All actions">全部动作</option>
                            {{range .audit_action_groups}}<optgroup label="{{.Name}}" data-label-zh="{{.Name}}" data-label-en="{{.NameEN}}">{{range .Actions}}<option value="{{.Code}}" data-i18n-zh="{{.Name}}" data-i18n-en="{{.NameEN}}">{{.Name}}</option>{{end}}</optgroup>{{end}}
                        </select>
                    </label>
                    <label class="nps-table-filter" for="audit-resource"><span class="nps-table-filter__label" data-i18n-zh="资源" data-i18n-en="Resource">资源</span>
                        <select id="audit-resource" name="resource_type" class="form-control nps-table-filter__control" data-nps-table-filter="resource_type" aria-label="资源类型">
                            <option value="" data-i18n-zh="全部资源" data-i18n-en="All resources">全部资源</option>
                            <option value="session" data-i18n-zh="登录会话" data-i18n-en="Sign-in session">登录会话</option>
                            <option value="client" data-i18n-zh="客户端" data-i18n-en="Client">客户端</option><option value="tunnel" data-i18n-zh="隧道" data-i18n-en="Tunnel">隧道</option>
                            <option value="host" data-i18n-zh="域名反代" data-i18n-en="Host">域名反代</option><option value="user" data-i18n-zh="用户" data-i18n-en="User">用户</option>
                            <option value="global" data-i18n-zh="全局参数" data-i18n-en="Global settings">全局参数</option><option value="nps.conf" data-i18n-zh="服务配置" data-i18n-en="Server configuration">服务配置</option>
                            <option value="nps" data-i18n-zh="服务端" data-i18n-en="Server">服务端</option><option value="dashboard" data-i18n-zh="大屏密钥" data-i18n-en="Dashboard key">大屏密钥</option>
                            <option value="ip_registration" data-i18n-zh="IP 登记" data-i18n-en="IP registration">IP 登记</option><option value="login_ban" data-i18n-zh="登录封禁" data-i18n-en="Login ban">登录封禁</option>
                        </select>
                    </label>
                    <label class="nps-table-filter" for="audit-result"><span class="nps-table-filter__label" data-i18n-zh="结果" data-i18n-en="Result">结果</span>
                        <select id="audit-result" name="result" class="form-control nps-table-filter__control" data-nps-table-filter="result" aria-label="结果"><option value="" data-i18n-zh="全部结果" data-i18n-en="All results">全部结果</option><option value="success" data-i18n-zh="成功" data-i18n-en="Success">成功</option><option value="failure" data-i18n-zh="失败" data-i18n-en="Failure">失败</option></select>
                    </label>
                </div>
                <table id="audit-table"></table>
            </div>
        </section>
    </div>
    <div class="audit-hub__view" id="audit-view-connections" role="tabpanel" aria-labelledby="audit-tab-connections">
        <section class="panel ibox float-e-margins management-table-card nps-panel">
            <div class="ibox-content management-table-content">
                <div class="audit-log-state" role="status" aria-live="polite" id="connection-log-state"><span class="audit-log-state__count">—</span><span class="audit-log-state__message" data-i18n-zh="正在读取连接日志…" data-i18n-en="Loading connection journal…">正在读取连接日志…</span></div>
                <div id="connection-toolbar" class="management-table-toolbar">
                    <label class="nps-table-filter" for="connection-kind"><span class="nps-table-filter__label" data-i18n-zh="类型" data-i18n-en="Type">类型</span><select id="connection-kind" name="kind" class="form-control nps-table-filter__control" data-nps-table-filter="kind" aria-label="连接类型"><option value="" data-i18n-zh="全部类型" data-i18n-en="All types">全部类型</option><option value="bridge">Bridge</option><option value="tunnel" data-i18n-zh="隧道" data-i18n-en="Tunnel">隧道</option><option value="host" data-i18n-zh="域名反代" data-i18n-en="Host">域名反代</option></select></label>
                    <label class="nps-table-filter" for="connection-transport"><span class="nps-table-filter__label" data-i18n-zh="传输" data-i18n-en="Transport">传输</span><select id="connection-transport" name="bridge_transport" class="form-control nps-table-filter__control" data-nps-table-filter="bridge_transport" aria-label="传输协议"><option value="" data-i18n-zh="全部协议" data-i18n-en="All transports">全部协议</option><option value="tcp">TCP</option><option value="tls">TCP + TLS</option><option value="kcp">KCP</option><option value="ws">WS</option><option value="wss">WSS</option><option value="quic">QUIC</option><option value="http3">HTTP/3</option></select></label>
                    <label class="nps-table-filter" for="connection-result"><span class="nps-table-filter__label" data-i18n-zh="结果" data-i18n-en="Result">结果</span><select id="connection-result" name="result" class="form-control nps-table-filter__control" data-nps-table-filter="result" aria-label="连接结果"><option value="" data-i18n-zh="全部结果" data-i18n-en="All results">全部结果</option><option value="success" data-i18n-zh="成功" data-i18n-en="Success">成功</option><option value="failure" data-i18n-zh="失败" data-i18n-en="Failure">失败</option></select></label>
                    <label class="nps-table-filter" for="connection-action"><span class="nps-table-filter__label" data-i18n-zh="动作" data-i18n-en="Action">动作</span><select id="connection-action" name="action" class="form-control nps-table-filter__control" data-nps-table-filter="action" aria-label="连接动作"><option value="" data-i18n-zh="全部动作" data-i18n-en="All actions">全部动作</option>{{range .connection_action_groups}}{{range .Actions}}<option value="{{.Code}}" data-i18n-zh="{{.Name}}" data-i18n-en="{{.NameEN}}">{{.Name}}</option>{{end}}{{end}}</select></label>
                </div>
                <table id="connection-table"></table>
            </div>
        </section>
    </div>
</section>
<script>
$(function () {
    var english = typeof window.npsIsEnglish === 'function' && window.npsIsEnglish();
    var ui = window.NpsAudit;
    var local = function (zh, en) { return english ? en : zh; };
    var heading = function (zh, en) { return '<span data-i18n-zh="' + ui.escape(zh) + '" data-i18n-en="' + ui.escape(en) + '">' + local(zh, en) + '</span>'; };
    var column = function (field, zh, en, formatter, extra) { return $.extend({field: field, title: heading(zh, en), halign: 'center', formatter: formatter}, extra || {}); };
    var result = function (value) {
        var state = value === 'success' ? 'success' : (value === 'failure' ? 'failure' : 'unknown');
        var text = state === 'success' ? local('成功', 'Success') : (state === 'failure' ? local('失败', 'Failed') : value || '-');
        return '<span class="audit-result audit-result--' + state + '">' + ui.escape(text) + '</span>';
    };
    var action = function (value, row) { return '<span class="audit-action" title="' + ui.escape(row.Action) + '">' + ui.escape(ui.label(row, 'Action', english)) + '</span>'; };
    var time = function (value) { var parts = String(value || '').split(' '); return ui.pair(parts[1] || parts[0], parts[1] ? parts[0] : ''); };
    var resource = function (value, row) { return ui.pair(ui.label(row, 'Resource', english), ''); };
    var source = function (value, row) {
        var remote = row.RemoteAddr || '', sub = remote !== value ? remote : '';
        if (remote.indexOf(value + ':') === 0 || remote.indexOf('[' + value + ']:') === 0) sub = local('源端口 ', 'Source port ') + remote.slice(remote.lastIndexOf(':') + 1);
        return ui.pair(value, sub, true);
    };
    var request = function (value, row) { return ui.pair((row.Method || '') + ' ' + (row.Path || ''), row.RequestID, true); };
    function updateState(id, data, failed) {
        var state = $(id), message = state.find('.audit-log-state__message');
        state.find('.audit-log-state__count').text(failed ? '—' : local('共 ', '') + (data.total || 0) + local(' 条', ' events'));
        var disabled = data.log_enabled === false;
        var text = failed ? local('日志读取失败，请检查路径与读取权限后刷新。', 'Could not read journal. Check its path and permissions, then refresh.')
            : disabled ? local('未开启文件记录：请在全局参数配置对应日志路径。', 'File logging is disabled. Configure its journal path in Global settings.')
            : local('文件记录已开启', 'File logging enabled');
        if (!failed && data.log_path) text += ' · ' + data.log_path;
        if (!failed && data.dropped > 0) text += local(' · 队列满时累计丢弃 ', ' · Queue overflow dropped ') + data.dropped + local(' 条', ' events');
        message.removeAttr('data-i18n-zh data-i18n-en').text(text).toggleClass('is-warning', disabled || data.dropped > 0).toggleClass('is-error', !!failed);
    }
    function options(connections) {
        var key = connections ? 'audit.connections' : 'audit.operations';
        var status = connections ? '#connection-log-state' : '#audit-log-state';
        return {toolbar: connections ? '#connection-toolbar' : '#audit-toolbar', method: 'post',
            url: '{{.web_base_url}}/audit/' + (connections ? 'connections' : 'list'), contentType: 'application/x-www-form-urlencoded',
            uniqueId: 'ID', striped: true, search: true, showHeader: true, showColumns: true, showRefresh: true,
            pagination: true, sidePagination: 'server', pageNumber: 1, pageSize: 50, pageList: [20, 50, 100, 200],
            storageKey: key + '.v2', smartDisplay: true, detailView: true,
            formatLoadingMessage: function () { return npsTableState(key, true); }, formatNoMatches: function () { return npsTableState(key, false); },
            onPostBody: function () { $('body').setLang(connections ? '#connection-table' : '#audit-table'); npsApplyTableState(this, key); },
            onLoadSuccess: function (data) { updateState(status, data, data.status === 0); },
            onLoadError: function () { updateState(status, {}, true); },
            detailFormatter: function (index, row) { return ui.detail(row, connections, english); }};
    }
    function initOperations() {
        $('#audit-table').npsTable($.extend(options(false), {columns: [
            column('Time', '时间', 'Time', time, {class: 'audit-list__time', width: '128px'}),
            column('Action', '动作', 'Action', action, {class: 'audit-list__action', width: '138px'}),
            column('Actor', '操作者 / 账号', 'Actor / account', function (value, row) { return ui.pair(value || '-', ui.actor(row.ActorType, english) + (row.ActorID ? ' #' + row.ActorID : '')); }, {width: '150px'}),
            column('SourceIP', '来源地址', 'Source', source, {class: 'audit-list__source', width: '178px'}),
            column('Resource', '资源', 'Resource', resource, {width: '135px'}),
            column('Result', '结果', 'Result', result, {width: '76px'}),
            column('Error', '结果说明 / 变更摘要', 'Result / changes', function (value, row) { return ui.summary(row, english); }, {class: 'audit-list__error'}),
            column('Path', '请求 / 关联 ID', 'Request / ID', request, {visible: false}),
            column('UserAgent', '浏览器 / 设备', 'Browser / device', null, {visible: false}),
            column('AuthMethod', '认证方式', 'Authentication', function (value) { return ui.escape(ui.method(value, english)); }, {visible: false}),
            column('Stage', '校验阶段', 'Stage', function (value) { return ui.escape(ui.stage(value, english)); }, {visible: false}),
            column('ErrorCode', '错误代码', 'Error code', null, {visible: false}),
            column('RequestID', '请求 ID', 'Request ID', null, {visible: false}),
            column('IPSource', 'IP 识别来源', 'IP detection', null, {visible: false})
        ]}));
    }
    function initConnections() {
        $('#connection-table').npsTable($.extend(options(true), {columns: [
            column('Time', '时间', 'Time', time, {class: 'audit-list__time', width: '128px'}),
            column('Action', '连接事件', 'Connection event', function (value, row) { return ui.pair(ui.label(row, 'Action', english), row.Kind + (row.HandshakeStage ? ' · ' + ui.stage(row.HandshakeStage, english) : '')); }, {width: '150px'}),
            column('User', '用户 / 客户端', 'User / client', function (value, row) { return ui.pair(row.Client || local('未知客户端', 'Unknown client'), (value || local('未关联用户', 'No linked user')) + (row.UserID ? ' #' + row.UserID : '')); }, {width: '160px'}),
            column('Transport', '协议', 'Protocol', function (value, row) { return ui.pair((value || '-').toUpperCase(), row.BridgeChannel || ''); }, {width: '95px'}),
            column('SourceIP', '来源地址', 'Source', source, {class: 'audit-list__source', width: '168px'}),
            column('ClientLocalAddr', '客户端内网地址', 'Client LAN', function (value, row) { return ui.pair(value || local('未上报', 'Not reported'), row.ClientVer ? 'NPC ' + row.ClientVer : '', true); }, {width: '145px'}),
            column('Result', '结果', 'Result', result, {width: '76px'}),
            column('Error', '结果说明 / 资源', 'Result / resource', function (value, row) { return ui.pair(value || ui.label(row, 'Resource', english), row.Target || ''); }, {class: 'audit-list__error'}),
            column('Duration', '时长 / 流量', 'Duration / traffic', function (value, row) { return ui.pair(value, row.Traffic); }, {visible: false}),
            column('ServerAddr', '服务端入口', 'Server endpoint', null, {visible: false}),
            column('Resource', '关联资源', 'Resource', resource, {visible: false}),
            column('Target', '转发目标', 'Target', null, {visible: false}),
            column('ClientVer', 'NPC 版本', 'NPC version', null, {visible: false}),
            column('HandshakeStage', '连接阶段', 'Connection stage', null, {visible: false})
        ]}));
    }
    var initialized = {};
    function syncLanguage() {
        var next = typeof window.npsIsEnglish === 'function' && window.npsIsEnglish();
        $('.audit-hub optgroup[data-label-zh]').each(function () { $(this).attr('label', $(this).attr(next ? 'data-label-en' : 'data-label-zh')); });
        if (next === english) return;
        english = next;
        ['operations', 'connections'].forEach(function (view) {
            if (!initialized[view]) return;
            var table = $(view === 'connections' ? '#connection-table' : '#audit-table');
            var instance = table.data('nps.table');
            if (instance) instance.refreshFilterTitles();
            table.npsTable('refreshOptions', {locale: next ? 'en-US' : 'zh-CN'});
        });
    }
    function activate(view) {
        if (view !== 'connections') view = 'operations';
        $('.audit-hub__tab').removeClass('is-active').attr({'aria-selected': 'false', tabindex: '-1'});
        $('.audit-hub__tab[data-audit-view="' + view + '"]').addClass('is-active').attr({'aria-selected': 'true', tabindex: '0'});
        $('.audit-hub__view').removeClass('is-active'); $('#audit-view-' + view).addClass('is-active');
        if (!initialized[view]) { initialized[view] = true; if (view === 'connections') initConnections(); else initOperations(); }
        else $(view === 'connections' ? '#connection-table' : '#audit-table').npsTable('refresh');
    }
    $('.audit-hub__tab').on('click', function () { activate($(this).attr('data-audit-view')); }).on('keydown', function (event) {
        if (['ArrowLeft', 'ArrowRight', 'Home', 'End'].indexOf(event.key) < 0) return;
        event.preventDefault();
        var next = event.key === 'Home' ? 'operations' : event.key === 'End' ? 'connections' : ($(this).attr('data-audit-view') === 'operations' ? 'connections' : 'operations');
        activate(next); $('#audit-tab-' + next).trigger('focus');
    });
    $('.audit-hub').on('click', '[data-audit-copy]', function () {
        var content = $(this).closest('.audit-detail').find('pre').text();
        var fallback = function () {
            var area = document.createElement('textarea'); area.value = content; area.style.position = 'fixed'; area.style.opacity = '0'; document.body.appendChild(area);
            area.select(); var copied = document.execCommand('copy'); document.body.removeChild(area);
            if (!copied) throw new Error('copy unavailable');
        };
        var done = function () { npsNotify('success', local('完整事件已复制', 'Full event copied')); };
        Promise.resolve().then(function () { if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(content).catch(fallback); fallback(); }).then(done).catch(function () { npsNotify('warning', local('复制失败，请选中日志手动复制。', 'Copy failed. Select and copy the event manually.')); });
    });
    $(document).off('npsLanguageChanged.audit').on('npsLanguageChanged.audit', syncLanguage);
    activate('{{.audit_initial_tab}}' || 'operations');
    syncLanguage();
    $('body').setLang('.audit-hub');
});
</script>
