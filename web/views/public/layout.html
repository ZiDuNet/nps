<script>
    window.nps = { "web_base_url": {{.web_base_url}}, "version": "{{.version}}" }

    // Toggle switch: sync hidden input with checkbox state
    $(document).on('change', '.toggle-switch input[type="checkbox"]', function() {
        var field = $(this).closest('.toggle-field');
        var hidden = field.find('input[type="hidden"]');
        if (hidden.length) hidden.val(this.checked ? '1' : '0');
    });

    function toggleTheme() {
        var html = document.documentElement;
        var isDark = html.getAttribute('data-theme') === 'dark';
        var next = isDark ? 'light' : 'dark';
        html.setAttribute('data-theme', next);
        localStorage.setItem('nps-theme', next);
        updateThemeIcon(next);
        applyChartTheme(next);
    }

    function updateThemeIcon(theme) {
        var icon = document.getElementById('theme-icon');
        if (icon) {
            icon.className = theme === 'dark' ? 'fa fa-sun' : 'fa fa-moon';
        }
    }

    function applyChartTheme(theme) {
        if (typeof chartdatas === 'undefined' || typeof charts === 'undefined') return;
        var isDark = theme === 'dark';
        var axisStyle = {
            axisLine: { lineStyle: { color: isDark ? 'rgba(255,255,255,0.12)' : '#d1d9e6' } },
            axisTick: { lineStyle: { color: isDark ? 'rgba(255,255,255,0.12)' : '#d1d9e6' } },
            axisLabel: { color: isDark ? 'rgba(255,255,255,0.5)' : '#6b7a8d' },
            splitLine: { lineStyle: { color: isDark ? 'rgba(255,255,255,0.06)' : '#edf2f7' } }
        };
        var colors = isDark
            ? ['#5dadff', '#a78bfa', '#34d399', '#fbbf24', '#f87171', '#36d7b7', '#818cf8']
            : ['#3b82f6', '#8b5cf6', '#10b981', '#f59e0b', '#ef4444', '#06b6d4', '#6366f1'];
        for (var key in chartdatas) {
            if (typeof chartdatas[key] !== 'object') continue;
            if (chartdatas[key].xAxis) { try { $.extend(true, chartdatas[key].xAxis, axisStyle); } catch(e){} }
            if (chartdatas[key].yAxis) { try { $.extend(true, chartdatas[key].yAxis, axisStyle); } catch(e){} }
            if (chartdatas[key].legend) { chartdatas[key].legend.textStyle = { color: isDark ? 'rgba(255,255,255,0.5)' : '#6b7a8d' }; }
            if (chartdatas[key].series) {
                for (var i = 0; i < chartdatas[key].series.length; i++) {
                    chartdatas[key].series[i].itemStyle = chartdatas[key].series[i].itemStyle || {};
                    chartdatas[key].series[i].itemStyle.color = colors[i % colors.length];
                }
            }
            if (charts[key]) { charts[key].setOption(chartdatas[key], true); }
        }
    }

    (function() {
        var saved = localStorage.getItem('nps-theme');
        if (saved) {
            document.documentElement.setAttribute('data-theme', saved);
            updateThemeIcon(saved);
        }
    })();
</script>
