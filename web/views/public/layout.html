<!DOCTYPE html>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    <script>
        (function () {
            try {
                var savedTheme = localStorage.getItem('nps-theme');
                var systemTheme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
                document.documentElement.setAttribute('data-theme', savedTheme || systemTheme);
            } catch (error) {
                document.documentElement.setAttribute('data-theme', 'light');
            }
        })();
    </script>

<script>
    window.nps = { "web_base_url": "{{.web_base_url}}", "version": "{{.version}}" }

    function getThemePreference() {
        try {
            return window.localStorage.getItem('nps-theme');
        } catch (error) {
            return null;
        }
    }

    function saveThemePreference(theme) {
        try {
            window.localStorage.setItem('nps-theme', theme);
        } catch (error) {
            // The system preference remains active when storage is unavailable.
        }
    }

    // Toggle switch: sync hidden input with checkbox state
    $(document).on('change', '.toggle-switch input[type="checkbox"]', function() {
        var field = $(this).closest('.toggle-field');
        var hidden = field.find('input[type="hidden"]');
        if (hidden.length) hidden.val(this.checked ? '1' : '0');
    });

    // Secret fields stay masked until the operator explicitly asks to reveal one.
    $(document).on('click', '.credential-password-toggle', function() {
        var target = document.getElementById(this.getAttribute('data-password-target'));
        if (!target) return;
        var revealing = target.type === 'password';
        var english = typeof npsIsEnglish === 'function' && npsIsEnglish();
        var label = revealing
            ? (english ? 'Hide password' : '隐藏密码')
            : (english ? 'Show password' : '显示密码');
        target.type = revealing ? 'text' : 'password';
        $(this)
            .attr('aria-pressed', revealing ? 'true' : 'false')
            .attr('aria-label', label)
            .attr('title', label)
            .find('i').toggleClass('fa-eye fa-eye-slash');
    });

    function toggleTheme() {
        var html = document.documentElement;
        var isDark = html.getAttribute('data-theme') === 'dark';
        var next = isDark ? 'light' : 'dark';
        html.setAttribute('data-theme', next);
        saveThemePreference(next);
        updateThemeIcon(next);
        applyChartTheme(next);
    }

    function updateThemeIcon(theme) {
        var icon = document.getElementById('theme-icon');
        var toggle = document.getElementById('theme-toggle');
        if (icon) {
            icon.className = theme === 'dark' ? 'fa fa-sun' : 'fa fa-moon';
        }
        if (toggle) toggle.setAttribute('aria-pressed', theme === 'dark' ? 'true' : 'false');
    }

    function applyChartTheme(theme) {
        if (typeof chartdatas === 'undefined' || typeof charts === 'undefined') return;
        var isDark = theme === 'dark';
        var axisStyle = {
            axisLine: { lineStyle: { color: isDark ? 'rgba(255,255,255,0.12)' : '#d1d9e6' } },
            axisTick: { lineStyle: { color: isDark ? 'rgba(255,255,255,0.12)' : '#d1d9e6' } },
            axisLabel: { color: isDark ? 'rgba(255,255,255,0.5)' : '#6b7a8d' },
            splitLine: { lineStyle: { color: isDark ? 'rgba(255,255,255,0.06)' : '#edf2f7' } }
        };
        var colors = isDark
            ? ['#60d7bd', '#65adff', '#b193ff', '#e9b763', '#e87575', '#58c9dc', '#91c7a9']
            : ['#087c70', '#247ed3', '#8064d8', '#bf8421', '#c34848', '#158fa3', '#4c8b70'];
        for (var key in chartdatas) {
            if (typeof chartdatas[key] !== 'object') continue;
            if (chartdatas[key].xAxis) { try { $.extend(true, chartdatas[key].xAxis, axisStyle); } catch(e){} }
            if (chartdatas[key].yAxis) { try { $.extend(true, chartdatas[key].yAxis, axisStyle); } catch(e){} }
            if (chartdatas[key].legend) { chartdatas[key].legend.textStyle = { color: isDark ? 'rgba(255,255,255,0.5)' : '#6b7a8d' }; }
            if (chartdatas[key].series) {
                for (var i = 0; i < chartdatas[key].series.length; i++) {
                    if (chartdatas[key].series[i].type === 'pie') {
                        chartdatas[key].series[i].color = colors;
                    } else {
                        chartdatas[key].series[i].itemStyle = chartdatas[key].series[i].itemStyle || {};
                        chartdatas[key].series[i].itemStyle.color = colors[i % colors.length];
                    }
                }
            }
            if (charts[key]) { charts[key].setOption(chartdatas[key], true); }
        }
    }

    (function() {
        var saved = getThemePreference() || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        if (saved) {
            document.documentElement.setAttribute('data-theme', saved);
            updateThemeIcon(saved);
            applyChartTheme(saved);
        }
    })();

    // Keep the console shell mounted while menu navigation swaps only the page
    // content. The server still renders a complete document, so this remains
    // compatible with direct links, refreshes, and non-JavaScript clients.
    (function () {
        var content = document.getElementById('nps-content');
        var menu = document.getElementById('side-menu');
        if (!content || !menu || !window.fetch || !window.DOMParser) return;

        var navigationBusy = false;

        function normalizeURL(value) {
            try {
                var url = new URL(value, window.location.href);
                return url.origin + url.pathname + url.search;
            } catch (error) {
                return '';
            }
        }

        function normalizeMenuPath(value) {
            try {
                var url = new URL(value, window.location.href);
                var path = url.pathname.replace(/\/+$/, '');
                return path || '/';
            } catch (error) {
                return '';
            }
        }

        function sameOriginURL(value) {
            try {
                var url = new URL(value, window.location.href);
                return url.origin === window.location.origin && (url.protocol === 'http:' || url.protocol === 'https:') ? url : null;
            } catch (error) {
                return null;
            }
        }

        function setActiveMenu(href) {
            var target = normalizeMenuPath(href);
            var items = menu.getElementsByTagName('li');
            for (var i = 0; i < items.length; i++) {
                var link = items[i].querySelector('a[href]');
                if (!link) continue;
                var active = normalizeMenuPath(link.href) === target;
                items[i].classList.toggle('active', active);
                if (active) link.setAttribute('aria-current', 'page');
                else link.removeAttribute('aria-current');
            }
        }

        function setLoading(loading) {
            content.classList.toggle('is-loading', loading);
            content.setAttribute('aria-busy', loading ? 'true' : 'false');
        }

        function disposePageRuntime() {
            // Content-only navigation does not trigger the browser's native
            // pagehide event. Replay it through jQuery so page modules can
            // release timers and other transient resources before replacement.
            if (window.$) {
                try { $(window).triggerHandler('pagehide'); } catch (error) {}
                $(content).find('table').each(function () {
                    var table = $(this).data('nps.table');
                    if (!table || typeof table.destroy !== 'function') return;
                    // Ignore responses already in flight once the table is
                    // detached; this keeps a slow list request from touching
                    // a page that the operator has already left.
                    if (typeof table._requestSerial === 'number') table._requestSerial++;
                    try { table.destroy(); } catch (error) {}
                });
            }
            // ClipboardJS installs a document-level listener. Destroy the
            // previous page instance before its DOM is removed to avoid stacked
            // listeners after repeated menu navigation.
            if (window.clipboard && typeof window.clipboard.destroy === 'function') {
                try { window.clipboard.destroy(); } catch (error) {}
            }
            if (window.charts && typeof window.charts === 'object') {
                for (var key in window.charts) {
                    if (!Object.prototype.hasOwnProperty.call(window.charts, key)) continue;
                    var chart = window.charts[key];
                    if (chart && typeof chart.dispose === 'function') {
                        try { chart.dispose(); } catch (error) {}
                    }
                }
                window.charts = {};
            }
            if (typeof window.npsPageCleanup === 'function') {
                try { window.npsPageCleanup(); } catch (error) {}
                window.npsPageCleanup = null;
            }
        }

        function executeContentScripts(root) {
            var scripts = Array.prototype.slice.call(root.querySelectorAll('script'));
            scripts.forEach(function (oldScript) {
                var script = document.createElement('script');
                for (var i = 0; i < oldScript.attributes.length; i++) {
                    var attribute = oldScript.attributes[i];
                    script.setAttribute(attribute.name, attribute.value);
                }
                if (!oldScript.src) script.text = oldScript.textContent || '';
                oldScript.parentNode.replaceChild(script, oldScript);
            });
        }

        function focusNewPage() {
            window.scrollTo(0, 0);
            var heading = content.querySelector('h1, [data-page-title]');
            if (!heading) return;
            if (!heading.hasAttribute('tabindex')) heading.setAttribute('tabindex', '-1');
            try { heading.focus({ preventScroll: true }); } catch (error) { heading.focus(); }
        }

        function refreshLanguage() {
            if (window.$ && typeof $('body').setLang === 'function') {
                try { $('body').setLang('#nps-content'); } catch (error) {}
            }
        }

        function extractContent(html) {
            var parsed = new DOMParser().parseFromString(html, 'text/html');
            var next = parsed.querySelector('#nps-content');
            return { document: parsed, content: next };
        }

        function navigate(target, pushHistory) {
            if (navigationBusy) return;
            var url = sameOriginURL(target);
            if (!url) return;
            var current = normalizeURL(window.location.href);
            if (pushHistory && current === normalizeURL(url.href)) return;
            navigationBusy = true;
            setLoading(true);
            setActiveMenu(url.href);

            window.fetch(url.href, {
                method: 'GET',
                credentials: 'same-origin',
                headers: { 'X-Requested-With': 'XMLHttpRequest', 'Accept': 'text/html' }
            }).then(function (response) {
                if (!response.ok) throw new Error('navigation request failed');
                return response.text();
            }).then(function (html) {
                var extracted = extractContent(html);
                // An expired session normally returns the login document, which
                // has no console content container. Let the browser handle that
                // redirect so the authentication page gets its own assets.
                if (!extracted.content) {
                    window.location.assign(url.href);
                    return;
                }
                disposePageRuntime();
                content.innerHTML = extracted.content.innerHTML;
                executeContentScripts(content);
                var active = extracted.document.querySelector('#side-menu > li.active > a[href]');
                setActiveMenu(active ? active.href : url.href);
                if (pushHistory) history.pushState({ npsConsole: true }, '', url.href);
                refreshLanguage();
                focusNewPage();
            }).catch(function () {
                // Keep the current page usable when the asynchronous request
                // fails; a full navigation is the reliable fallback.
                if (!pushHistory) window.location.reload();
                else {
                    setActiveMenu(current);
                    if (typeof npsNotify === 'function') npsNotify('error', npsIsEnglish() ? 'Page load failed' : '页面加载失败');
                }
            }).finally(function () {
                navigationBusy = false;
                setLoading(false);
            });
        }

        menu.addEventListener('click', function (event) {
            if (event.defaultPrevented || event.button !== 0 || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;
            var anchor = event.target.closest ? event.target.closest('a[href]') : null;
            if (!anchor || !menu.contains(anchor) || anchor.target === '_blank' || anchor.hasAttribute('download')) return;
            var url = sameOriginURL(anchor.href);
            if (!url || (url.hash && normalizeURL(url.href) === normalizeURL(window.location.href))) return;
            event.preventDefault();
            navigate(url.href, true);
        });

        window.addEventListener('popstate', function () {
            navigate(window.location.href, false);
        });

        var initialState = history.state || {};
        if (!initialState.npsConsole) {
            initialState.npsConsole = true;
            history.replaceState(initialState, '', window.location.href);
        }
    })();
</script>

</body>
</html>
