<section class="form-page form-page-global" aria-labelledby="global-settings-title">
    <header class="dashboard-page-header form-page-header">
        <div class="form-page-heading">
            <div class="dashboard-page-kicker" data-i18n-zh="系统配置" data-i18n-en="System settings">系统配置</div>
            <h1 id="global-settings-title" langtag="word-globalparam"></h1>
            <p data-i18n-zh="管理全局访问限制和服务器对外地址。" data-i18n-en="Manage global access restrictions and the public server address.">管理全局访问限制和服务器对外地址。</p>
        </div>
    </header>

    <div class="row form-page-grid">
        <div class="col-lg-12">
            <article class="panel ibox float-e-margins form-workflow-card zui-panel">
                <div class="ibox-content form-workflow-content">
                    <form class="form form-horizontal form-workflow-form zui-form" data-form-workflow="global-settings">
                        <div class="form-section-title"><i class="fa fa-shield-alt" aria-hidden="true"></i><span data-i18n-zh="IP 黑名单" data-i18n-en="IP denylist">IP 黑名单</span></div>
                        <div class="form-group" id="black_ip_list">
                            <label class="col-sm-2 control-label font-bold" langtag="word-globalblackiplist"></label>
                            <div class="col-sm-10">
                                <textarea class="form-control" rows="10" type="text" name="globalBlackIpList" placeholder=""
                                          langtag="info-suchasblackiplist">{{.globalBlackIpList}}</textarea>
                                <span class="help-block m-b-none" langtag="info-descblackiplist"></span>
                            </div>
                        </div>

                        <div class="form-section-title"><i class="fa fa-server" aria-hidden="true"></i><span data-i18n-zh="服务配置" data-i18n-en="Server settings">服务配置</span></div>
                        <div class="form-group" id="server_url">
                            <label class="col-sm-2 control-label font-bold" langtag="word-serverurl"></label>
                            <div class="col-sm-10">
                                <input class="form-control" value="{{.serverUrl}}" type="text" name="serverUrl"
                                       placeholder="" langtag="info-servertips">
                            </div>
                        </div>

                        <div class="hr-line-dashed form-workflow-divider"></div>
                        <div class="form-group form-workflow-actions">
                            <div class="col-sm-4 col-sm-offset-2">
                                <button class="btn btn-success" type="button"
                                        onclick="submitform('global', '{{.web_base_url}}/global/save', $('form').serializeArray())">
                                    <i class="fa fa-fw fa-lg fa-check-circle"></i> <span langtag="word-save"></span>
                                </button>
                            </div>
                        </div>
                    </form>
                </div>
            </article>
        </div>
    </div>
</section>

<script>
    window.addEventListener('resize', () => {
        for (var key in charts) {
            charts[key].resize();
        }
    });
</script>
