<section class="form-page form-page-global" aria-labelledby="login-ban-title">
    <header class="dashboard-page-header form-page-header">
        <div class="form-page-heading">
            <div class="dashboard-page-kicker" data-i18n-zh="运行安全" data-i18n-en="Runtime security">运行安全</div>
            <h1 id="login-ban-title" data-i18n-zh="登录封禁" data-i18n-en="Login bans">登录封禁</h1>
            <p data-i18n-zh="查看并清理登录保护产生的临时 IP/账号记录。记录只保存在内存中，重启 NPS 后自动清空。"
               data-i18n-en="Review and clear temporary IP/account records created by login protection. Records are kept in memory and disappear when NPS restarts.">查看并清理登录保护产生的临时 IP/账号记录。记录只保存在内存中，重启 NPS 后自动清空。</p>
        </div>
        <div class="dashboard-page-actions form-page-actions">
            <button type="button" class="btn btn-outline btn-warning" onclick="cleanLoginBans()"><i class="fa fa-broom" aria-hidden="true"></i><span data-i18n-zh="清理过期" data-i18n-en="Clean expired">清理过期</span></button>
            <button type="button" class="btn btn-outline btn-danger" onclick="clearLoginBans()"><i class="fa fa-eraser" aria-hidden="true"></i><span data-i18n-zh="全部解封" data-i18n-en="Clear all">全部解封</span></button>
        </div>
    </header>
    <section class="panel ibox nps-panel"><div class="ibox-content">
        <div id="login-ban-toolbar" class="management-table-toolbar">
            <label class="nps-table-filter" for="login-ban-type-filter">
                <span class="nps-table-filter__label" data-i18n-zh="类型" data-i18n-en="Type">类型</span>
                <select id="login-ban-type-filter" class="form-control nps-table-filter__control" data-nps-table-filter="ban_type">
                    <option value="" data-i18n-zh="全部类型" data-i18n-en="All types">全部类型</option>
                    <option value="ip" data-i18n-zh="来源 IP" data-i18n-en="Source IP">来源 IP</option>
                    <option value="username" data-i18n-zh="账号" data-i18n-en="Account">账号</option>
                </select>
            </label>
            <label class="nps-table-filter" for="login-ban-status-filter">
                <span class="nps-table-filter__label" data-i18n-zh="状态" data-i18n-en="Status">状态</span>
                <select id="login-ban-status-filter" class="form-control nps-table-filter__control" data-nps-table-filter="status">
                    <option value="" data-i18n-zh="全部状态" data-i18n-en="All statuses">全部状态</option>
                    <option value="banned" data-i18n-zh="封禁中" data-i18n-en="Banned">封禁中</option>
                    <option value="expired" data-i18n-zh="已过期" data-i18n-en="Expired">已过期</option>
                </select>
            </label>
        </div>
        <table id="login-ban-table"></table>
    </div></section>
</section>
<script>
(function () {
    var endpoint = '{{.web_base_url}}/global/banlist';
    var text = function (value) {
        return typeof npsEscapeHtml === 'function'
            ? npsEscapeHtml(value == null ? '' : String(value))
            : $('<div>').text(value == null ? '' : String(value)).html();
    };
    var localText = function (zh, en) {
        return typeof npsIsEnglish === 'function' && npsIsEnglish() ? en : zh;
    };
    var typeText = function (value) {
        return value === 'ip' ? 'IP' : localText('账号哈希', 'Account hash');
    };
    var statusText = function (value) {
        return value
            ? '<span class="label label-danger">' + localText('封禁中', 'Banned') + '</span>'
            : '<span class="label label-success">' + localText('已过期', 'Expired') + '</span>';
    };
    var actionText = function (value, row) {
        return '<button type="button" class="btn btn-xs btn-outline btn-danger js-unban" data-key="' + text(row.key) + '">'
            + localText('解封', 'Unban') + '</button>';
    };
    var keyText = function (value) {
        return '<code>' + text(value) + '</code>';
    };
    var refresh = function () {
        $('#login-ban-table').npsTable('refresh');
    };
    var notifyFailure = function (message) {
        if (typeof npsNotify === 'function') npsNotify('error', message);
    };

    $('#login-ban-table').npsTable({
        toolbar: '#login-ban-toolbar',
        method: 'post',
        url: endpoint,
        contentType: 'application/x-www-form-urlencoded',
        search: true,
        showHeader: true,
        showColumns: true,
        showRefresh: true,
        pagination: true,
        sidePagination: 'server',
        pageNumber: 1,
        pageList: [10, 20, 50],
        storageKey: 'login-bans',
        smartDisplay: true,
        formatLoadingMessage: function () { return npsTableState('login-bans', true); },
        formatNoMatches: function () { return npsTableState('login-bans', false); },
        onPostBody: function () { $('body').setLang('#login-ban-table'); npsApplyTableState(this, 'login-bans'); },
        onLoadError: function () { notifyFailure(localText('读取封禁记录失败', 'Failed to load login bans')); },
        columns: [
            {field: 'key', title: '<span data-i18n-zh="键" data-i18n-en="Key">键</span>', halign: 'center', formatter: keyText},
            {field: 'ban_type', title: '<span data-i18n-zh="类型" data-i18n-en="Type">类型</span>', halign: 'center', formatter: typeText},
            {field: 'fail_times', title: '<span data-i18n-zh="失败次数" data-i18n-en="Failures">失败次数</span>', halign: 'center', escape: true},
            {field: 'is_banned', title: '<span data-i18n-zh="状态" data-i18n-en="Status">状态</span>', align: 'center', halign: 'center', formatter: statusText},
            {field: 'last_login_time', title: '<span data-i18n-zh="最后失败" data-i18n-en="Last failure">最后失败</span>', halign: 'center', escape: true},
            {field: 'key', stateKey: 'actions', title: '<span data-i18n-zh="操作" data-i18n-en="Actions">操作</span>', align: 'center', halign: 'center', formatter: actionText}
        ]
    });

    window.cleanLoginBans = function () {
        $.post('{{.web_base_url}}/global/banclean', {}, function () {
            if (typeof npsNotify === 'function') npsNotify('success', localText('已清理过期登录记录。', 'Expired login records cleaned.'));
            refresh();
        }).fail(function () { notifyFailure(localText('清理过期记录失败', 'Failed to clean expired records')); });
    };
    window.clearLoginBans = function () {
        npsConfirmDialog(localText('确认清空所有登录封禁记录？此操作不可撤销。', 'Clear all login-ban records? This cannot be undone.'), { danger: true, confirmLabel: localText('清空', 'Clear') })
            .then(function (confirmed) {
                if (!confirmed) return;
                $.post('{{.web_base_url}}/global/unbanall', {}, function () {
                    if (typeof npsNotify === 'function') npsNotify('success', localText('已清空登录封禁记录。', 'Login-ban records cleared.'));
                    refresh();
                }).fail(function () { notifyFailure(localText('清空登录封禁记录失败', 'Failed to clear login-ban records')); });
            });
    };
    $('#login-ban-table').on('click', '.js-unban', function () {
        var key = $(this).attr('data-key');
        $.post('{{.web_base_url}}/global/unban', {key: key}, function () {
            if (typeof npsNotify === 'function') npsNotify('success', localText('解封成功。', 'Record unbanned.'));
            refresh();
        }).fail(function () { notifyFailure(localText('解封失败', 'Failed to unban record')); });
    });
}());
</script>
