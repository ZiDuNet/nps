<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NPS 内网穿透 · 管理大屏</title>
<style>
:root{--bg:#f3f5f8;--card:#fff;--line:#e3e8ef;--line2:#eef1f6;--ink:#101828;--ink2:#475467;--ink3:#98a2b3;--accent:#2458e6;--accent-soft:#eaf0ff;--accent-ink:#1d4ed8;--online:#12b76a;--online-soft:#e7f8ef;--offline:#98a2b3;--stop:#f04438;--radius:8px;--shadow:0 1px 2px rgba(16,24,40,.05),0 8px 24px -12px rgba(16,24,40,.12);--mono:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace}
*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%}body{background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",Roboto,sans-serif;overflow:hidden;display:flex;flex-direction:column}.wrap{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;padding:12px 16px 14px}
.top{display:flex;align-items:center;gap:18px;flex:none;min-width:0}.brand{display:flex;align-items:center;gap:11px;flex:none;color:inherit;text-decoration:none}.logo{width:38px;height:38px;object-fit:contain;display:block;flex:none}.brand h1{font-size:18px;font-weight:700;letter-spacing:.2px;white-space:nowrap}.brand h1 em{font-style:normal;color:var(--accent)}.brand p{font-size:11px;color:var(--ink3);margin-top:1px;white-space:nowrap}.gstats{flex:1;display:flex;align-items:center;justify-content:center;gap:22px;min-width:0}.gs{display:flex;flex-direction:column;line-height:1.15;min-width:0}.gs em{font-style:normal;font-size:10px;color:var(--ink3);letter-spacing:.5px}.gs b{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}.gs i{font-style:normal;font-size:10px;color:var(--ink3);font-family:var(--mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:230px}.gs b.hl{color:var(--accent-ink)}.gstats .sep{width:1px;height:26px;background:var(--line);flex:none}.clock{text-align:right;flex:none}.clock b{display:block;font:600 19px/1.1 var(--mono);letter-spacing:1px}.clock span{color:var(--ink3);font-size:11px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}.map{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}.hd{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 14px 8px;border-bottom:1px solid var(--line2);flex:none}.hd h2{font-size:13px;font-weight:600}.hd .hint{font-size:11px;color:var(--ink3);font-weight:400;margin-left:8px}.hd .tools{display:flex;align-items:center;gap:8px}.search{position:relative;display:block}.search input{width:200px;height:30px;border:1px solid var(--line);border-radius:8px;padding:0 10px 0 30px;font-size:12px;outline:none;background:#fbfcfe;color:var(--ink)}.search input:focus{border-color:var(--accent);background:#fff}.search svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);width:14px;height:14px;color:var(--ink3);pointer-events:none}.chk{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--ink2);cursor:pointer;user-select:none;white-space:nowrap}.chk input{accent-color:var(--accent);width:14px;height:14px}.sel{height:30px;border:1px solid var(--line);border-radius:8px;padding:0 8px;font-size:12px;background:#fff;outline:none;color:var(--ink);max-width:170px}.sel:focus{border-color:var(--accent)}
.map-body{flex:1;min-height:0;overflow:auto;position:relative;padding:12px 14px 10px}.map-body::-webkit-scrollbar{width:9px;height:9px}.map-body::-webkit-scrollbar-thumb{background:#d5dae3;border-radius:5px}.map-body::-webkit-scrollbar-thumb:hover{background:#bcc4d0}.cols{position:relative;min-height:100%}.grid{position:relative;display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px 10px;padding:42px 8px 10px}.rowbrk{height:22px}.group-frame{position:absolute;border:2px solid;border-radius:14px;border-top-width:5px;background:rgba(36,88,230,.025);z-index:0;pointer-events:none}.group-frame .topbar{position:absolute;top:-11px;left:10px;right:10px;display:flex;flex-wrap:wrap;align-items:center;gap:5px}.group-frame .glabel{font-size:10.5px;font-weight:600;background:#fff;padding:1px 8px;border-radius:8px;white-space:nowrap}.group-frame .clabel{font-size:9.5px;font-weight:500;background:#fff;border:1px solid;padding:1px 7px;border-radius:8px;white-space:nowrap;display:inline-flex;align-items:center;gap:4px}.group-frame .clabel i{width:7px;height:7px;border-radius:2px;flex:none}.group-frame .clabel b{font-weight:600}.group-frame .clabel em{font-style:normal;opacity:.7;font-size:9px}.group-frame .clabel.offline{background:#f4f5f7}
.t-node{z-index:1;background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit;color:inherit;text-align:left;appearance:none;display:block;position:relative;line-height:1.35;touch-action:manipulation;cursor:pointer;transition:.15s;border-left:3px solid var(--line)}.t-node:focus-visible,.modal-close:focus-visible,.search input:focus-visible,.sel:focus-visible{outline:3px solid rgba(36,88,230,.28);outline-offset:2px}.t-node:hover{border-color:var(--accent);box-shadow:0 4px 14px -8px rgba(36,88,230,.3)}.t-node.stop{opacity:.62;border-style:dashed}.mode{display:inline-flex;align-items:center;font-size:9.5px;font-weight:700;border-radius:5px;padding:1px 5px;color:#fff;letter-spacing:.3px;flex:none}.m-tcp{background:#2458e6}.m-host{background:#0e9384}.m-http{background:#0b8fbf}.m-udp{background:#e8890c}.m-socks{background:#d4592a}.m-p2p{background:#c0268b}.m-secret{background:#64748b}.t-row1{display:flex;align-items:center;gap:6px}.t-name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0;display:block}.t-name .tid{color:var(--ink3);font-weight:400;font-family:var(--mono);font-size:9.5px;margin-left:3px}.t-route{color:var(--ink3);font-family:var(--mono);font-size:9.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;margin-top:3px;height:13px}.t-flow{flex:none;color:var(--accent-ink);font-size:9.5px;font-family:var(--mono);font-weight:600;min-width:52px;text-align:right}.t-live{display:flex;align-items:center;gap:5px;font-size:9px;color:var(--ink3);margin-top:3px;font-family:var(--mono);height:12px}.pulse{width:6px;height:6px;border-radius:50%;background:var(--online);box-shadow:0 0 0 2px var(--online-soft);animation:pl 1.8s ease-in-out infinite;flex:none}@keyframes pl{0%,100%{opacity:1}50%{opacity:.3}}.aff{display:flex;align-items:center;gap:5px;margin-top:5px;padding-top:5px;border-top:1px dashed var(--line2);font-size:9.5px;color:var(--ink3);white-space:nowrap;overflow:hidden;height:14px}.aff .udot,.aff .cdot{width:8px;height:8px;border-radius:3px;flex:none}.aff .un{font-weight:600;color:var(--ink2)}.aff .sep{color:#d0d5dd}.aff .cn{font-family:var(--mono);overflow:hidden;text-overflow:ellipsis}.t-st{position:absolute;top:50%;left:50%;width:54px;height:54px;border-radius:50%;border:2.5px solid rgba(240,68,56,.6);color:rgba(240,68,56,.65);font-size:18px;font-weight:700;display:flex;align-items:center;justify-content:center;letter-spacing:2px;background:rgba(255,255,255,.25);pointer-events:none;z-index:2;transform:translate(-50%,-50%) rotate(-12deg)}.empty-state{grid-column:1/-1;text-align:center;color:var(--ink3);padding:60px 0;font-size:13px}
.legend{display:flex;align-items:center;gap:14px;padding:7px 14px;border-top:1px solid var(--line2);font-size:11px;color:var(--ink2);flex:none;flex-wrap:wrap}.legend .lg{display:flex;align-items:center;gap:5px}.legend .sw{width:9px;height:9px;border-radius:3px}.legend .dot{width:9px;height:9px;border-radius:50%;display:inline-block}.legend .dot.on{background:var(--online);box-shadow:0 0 0 3px var(--online-soft)}.legend .dot.off{background:var(--offline)}.legend .sw.m-tcp{background:#2458e6}.legend .sw.m-host{background:#0e9384}.legend .sw.m-http{background:#0b8fbf}.legend .sw.m-udp{background:#e8890c}.legend .sw.m-socks{background:#d4592a}.legend .sw.m-p2p{background:#c0268b}.legend .sw.m-secret{background:#64748b}.legend .right{margin-left:auto;color:var(--ink3)}
.modal-mask{position:fixed;inset:0;background:rgba(16,24,40,.45);backdrop-filter:blur(2px);z-index:100;display:none;align-items:stretch;justify-content:flex-end}.modal-mask.open{display:flex}.modal{width:min(460px,100vw);background:#fff;height:100%;overflow-y:auto;box-shadow:-8px 0 30px rgba(16,24,40,.18);display:flex;flex-direction:column}.modal-head{padding:14px 18px;border-bottom:1px solid var(--line2);display:flex;align-items:center;gap:10px;position:sticky;top:0;background:#fff;z-index:1}.modal-head h3{font-size:16px;font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.modal-close{width:42px;height:42px;border-radius:8px;border:1px solid var(--line);background:#fff;font-size:20px;cursor:pointer;color:var(--ink2);flex:none}.modal-close:hover{border-color:var(--stop);color:var(--stop)}.modal-body{padding:16px 18px;display:flex;flex-direction:column;gap:12px}.detail-grid{display:grid;grid-template-columns:auto minmax(0,1fr);gap:9px 14px;font-size:12.5px}.detail-grid .k{color:var(--ink3)}.detail-grid .v{color:var(--ink);word-break:break-all}.detail-grid .v.mono{font-family:var(--mono);font-size:12px}.live-box{display:flex;gap:12px}.live-cell{flex:1;background:#f8fafc;border:1px solid var(--line2);border-radius:8px;padding:12px;text-align:center}.live-cell .lk{font-size:11px;color:var(--ink3)}.live-cell .lv{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px;color:var(--ink);word-break:break-all}.section-t{font-size:11px;color:var(--ink3);font-weight:600;letter-spacing:.6px;border-top:1px dashed var(--line2);padding-top:12px;margin-top:2px}.tagrow{display:flex;flex-wrap:wrap;gap:6px}.tag{font-size:11px;background:var(--accent-soft);color:var(--accent-ink);border-radius:6px;padding:2px 8px}
@media(max-width:1280px){.gstats .sep,.gs:nth-child(5),.gs:nth-child(6){display:none}}@media(max-width:900px){body{overflow:auto}.wrap{min-height:100%;padding:10px}.top{align-items:flex-start;flex-wrap:wrap}.gstats{order:3;flex-basis:100%;justify-content:flex-start;gap:14px}.hd{align-items:flex-start;flex-wrap:wrap}.hd .tools{width:100%;flex-wrap:wrap}.search{flex:1 1 200px}.search input{width:100%}.map{min-height:620px}.grid{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}.legend .right{width:100%;margin-left:0}}@media(max-width:560px){.brand p{display:none}.clock{margin-left:auto}.gstats .sep,.gstats .gs:nth-child(n+7){display:none}.sel{max-width:calc(50vw - 18px)}.map{min-height:680px}.modal{width:100vw}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body data-base-url="{{.web_base_url}}">
<div class="wrap">
  <header class="top">
    <a class="brand" href="{{.web_base_url}}/" aria-label="返回 NPS 控制台">
      <img class="logo" src="{{.web_base_url}}/static/img/nps-logo.png" width="38" height="38" alt="NPS">
      <span><h1>NPS 内网穿透 <em>管理大屏</em></h1><p>用户 → 客户端 → 隧道 · 全网关系总览</p></span>
    </a>
    <div class="gstats" id="gstats" aria-live="polite"></div>
    <div class="clock"><b id="clock">--:--:--</b><span id="dateStr"></span></div>
  </header>
  <section class="card map" aria-labelledby="mapTitle">
    <div class="hd">
      <h2 id="mapTitle">关系拓扑<span class="hint">用户 → 客户端 → 隧道 · 点击卡片查看实时详情</span></h2>
      <div class="tools">
        <label class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg><input id="q" placeholder="搜索 备注 / IP / 端口 / 域名…" aria-label="搜索资源" autocomplete="off"></label>
        <label class="chk"><input type="checkbox" id="onlyOnline"> 仅在线</label>
        <select id="fUser" class="sel" aria-label="筛选用户"><option value="">全部用户</option></select>
        <select id="fClient" class="sel" aria-label="筛选客户端"><option value="">全部客户端</option></select>
      </div>
    </div>
    <div class="map-body" id="mapBody"><div class="cols" id="cols"></div></div>
    <div class="legend" id="legend" aria-live="polite"></div>
  </section>
</div>
<div class="modal-mask" id="modalMask">
  <section class="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <div class="modal-head"><span class="mode" id="mMode">TCP</span><h3 id="mTitle">资源详情</h3><button class="modal-close" id="mClose" type="button" aria-label="关闭详情">×</button></div>
    <div class="modal-body" id="mBody"></div>
  </section>
</div>
<script src="{{.web_base_url}}/static/js/nps-overview-admin.js?v={{.version}}"></script>
</body>
</html>
