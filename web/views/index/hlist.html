<section class="wrapper wrapper-content animated fadeInRight management-page management-page--host" aria-labelledby="host-list-title">
    <header class="dashboard-page-header management-page-header">
        <div>
            <div class="dashboard-page-kicker" data-i18n-zh="域名代理" data-i18n-en="Domain proxy">域名代理</div>
            <h1 id="host-list-title" data-i18n-zh="域名反代" data-i18n-en="Domain reverse proxy">域名反代</h1>
            <p data-i18n-zh="集中查看访问入口、协议与内网目标；展开行可查看路由摘要。" data-i18n-en="Review public entry points, protocols, and internal targets. Expand a row for routing details.">集中查看访问入口、协议与内网目标；展开行可查看路由摘要。</p>
        </div>
        <div class="dashboard-page-actions">
            <a class="btn btn-outline btn-primary" href="{{.web_base_url}}/index/hostdiagnose"><i class="fa fa-stethoscope" aria-hidden="true"></i><span data-i18n-zh="规则诊断" data-i18n-en="Rule diagnosis">规则诊断</span></a>
        </div>
    </header>

    <div class="management-page-grid"><div class="management-page-column"><section class="panel ibox float-e-margins management-table-card nps-panel"><div class="ibox-content management-table-content">
        <div id="toolbar" class="management-table-toolbar">
            <a href="{{.web_base_url}}/index/addhost?client_id={{.client_id}}" class="btn btn-primary"><i class="fa fa-plus" aria-hidden="true"></i><span data-i18n-zh="新增规则" data-i18n-en="New rule">新增规则</span></a>
            <button type="button" onclick="batchDelete('{{.web_base_url}}/index/delhost');" class="btn btn-outline btn-danger"><i class="fa fa-trash" aria-hidden="true"></i><span data-i18n-zh="批量删除" data-i18n-en="Delete selected">批量删除</span></button>
            <button type="button" onclick="batchResourceAction('{{.web_base_url}}/index/hoststart', {}, '批量启用', 'Enable selected');" class="btn btn-outline btn-primary"><i class="fa fa-play" aria-hidden="true"></i><span data-i18n-zh="批量启用" data-i18n-en="Enable selected">批量启用</span></button>
            <button type="button" onclick="batchResourceAction('{{.web_base_url}}/index/hoststop', {}, '批量停用', 'Disable selected');" class="btn btn-outline btn-warning"><i class="fa fa-pause" aria-hidden="true"></i><span data-i18n-zh="批量停用" data-i18n-en="Disable selected">批量停用</span></button>
            {{if eq true .isAdmin}}
            <label class="nps-table-filter" for="host-owner-filter">
                <span class="nps-table-filter__label" data-i18n-zh="所属用户" data-i18n-en="Owner">所属用户</span>
                <select id="host-owner-filter" class="form-control nps-table-filter__control" data-nps-table-filter="user_id">
                    <option value="" data-i18n-zh="全部用户" data-i18n-en="All users">全部用户</option>
                    <option value="0" data-i18n-zh="未分配" data-i18n-en="Unassigned">未分配</option>
                    {{range .users}}
                    <option value="{{.Id}}">{{.Id}} · {{.UserName}}</option>
                    {{end}}
                </select>
            </label>
            {{end}}
            <label class="nps-table-filter" for="host-client-filter">
                <span class="nps-table-filter__label" data-i18n-zh="客户端" data-i18n-en="Client">客户端</span>
                <select id="host-client-filter" class="form-control nps-table-filter__control" data-nps-table-filter="filter_client_id" {{if .client_id}}disabled{{end}}>
                    <option value="0" data-i18n-zh="全部客户端" data-i18n-en="All clients">全部客户端</option>
                    {{range .clients}}
                    <option value="{{.Id}}">{{.Id}} · {{.Remark}}</option>
                    {{end}}
                </select>
            </label>
        </div>
        <table id="table"></table>
    </div></section></div></div>
</section>

<script>
var hostListClientId = Number('{{.client_id}}');
if (!isFinite(hostListClientId) || Math.floor(hostListClientId) !== hostListClientId || hostListClientId < 0) hostListClientId = 0;
var hostHttpPort = '{{.http_proxy_port}}';
var hostHttpsPort = '{{.https_proxy_port}}';

function hostSchemeLabel(scheme) {
    if (scheme === 'http') return 'HTTP';
    if (scheme === 'https') return 'HTTPS';
    return 'HTTP + HTTPS';
}

function hostPublicURL(host, port, scheme, location) {
    var safeHost = String(host || '').trim();
    if (!safeHost) return '';
    var safePath = String(location || '/');
    if (safePath.charAt(0) !== '/') safePath = '/' + safePath;
    return scheme + '://' + safeHost + String(port || '') + safePath;
}

function hostEndpointLink(label, url) {
    if (!url) return '';
    var safeURL = npsEscapeHtml(url);
    return '<a class="host-endpoint" href="' + safeURL + '" target="_blank" rel="noopener noreferrer"><span>' + label + '</span><i class="fa fa-external-link" aria-hidden="true"></i></a>';
}

$('#table').npsTable({
    // Content-only sidebar navigation executes this script before
    // history.pushState updates window.location. Keep the data request
    // anchored to the host-list endpoint so the first visit cannot post to
    // the page that was previously open.
    toolbar: '#toolbar', method: 'post', url: '{{.web_base_url}}/index/hostlist',
    queryParams: function (params) {
        var clientFilter = $('#host-client-filter').val();
        return {offset: params.offset, limit: params.limit, search: params.search, client_id: hostListClientId, filter_client_id: clientFilter};
    },
    search: true, contentType: 'application/x-www-form-urlencoded', striped: true, showHeader: true, showColumns: false, showRefresh: true,
    pagination: true, sidePagination: 'server', pageNumber: 1, pageList: [10, 20, 50], storageKey: 'host', detailView: true, smartDisplay: true,
    // A dense card record is clearer than a compressed multi-column grid on phones.
    cardView: window.matchMedia && window.matchMedia('(max-width: 768px)').matches,
    formatLoadingMessage: function () { return npsTableState('host', true); },
    formatNoMatches: function () { return npsTableState('host', false); },
    onExpandRow: function () { $('body').setLang('.detail-view'); },
    onPostBody: function () { $('body').setLang('#table'); npsApplyTableState(this, 'host'); },
    detailFormatter: function (index, row) {
        var english = npsIsEnglish();
        var text = function (value, fallback) {
            if (value == null || value === '') value = fallback == null ? '' : fallback;
            return npsEscapeHtml(value);
        };
        var label = function (zh, en) {
            return '<span data-i18n-zh="' + zh + '" data-i18n-en="' + en + '">' + (english ? en : zh) + '</span>';
        };
        var onOff = function (value) {
            return value ? (english ? 'Enabled' : '已开启') : (english ? 'Disabled' : '未开启');
        };
        var kv = function (labelText, value) {
            return '<div class="host-detail__item"><span class="host-detail__label">' + labelText + '</span><span class="host-detail__value">' + value + '</span></div>';
        };
        var codeValue = function (labelText, value) {
            return '<div class="host-detail__item host-detail__item--wide"><span class="host-detail__label">' + labelText + '</span><code class="host-detail__code">' + text(value || '-') + '</code></div>';
        };
        var chips = function (labelText, value) {
            var items = Array.isArray(value) ? value : [];
            var content = items.length
                ? items.map(function (item) { return '<span class="host-detail__chip">' + text(item) + '</span>'; }).join('')
                : '<span class="host-detail__chip host-detail__chip--empty">-</span>';
            return '<div class="host-detail__chips"><span class="host-detail__label">' + labelText + '</span><div class="host-detail__chip-list">' + content + '</div></div>';
        };
        var card = function (icon, title, content) {
            return '<section class="host-detail__card"><h6 class="host-detail__section-title"><i class="fa fa-' + icon + '" aria-hidden="true"></i>' + title + '</h6><div class="host-detail__grid">' + content + '</div></section>';
        };
        var section = function (icon, title, content) {
            return '<section class="host-detail__section"><h6 class="host-detail__section-title"><i class="fa fa-' + icon + '" aria-hidden="true"></i>' + title + '</h6><div class="host-detail__grid">' + content + '</div></section>';
        };
        var target = (row.Target || {}).TargetStr || '';
        var source = row.PlatformManaged ? label('平台域名 / 托管证书', 'Platform domain / managed certificate') : label('自定义域名 / 自管证书', 'Custom domain / self-managed certificate');
        var client = row.Client || {}, clientName = client.Id ? String(client.Id) + ' · ' + String(client.Remark || '-') : '-';
        var clientState = client.IsConnect ? (english ? 'Online' : '在线') : (english ? 'Offline' : '离线');
        var ruleState = row.IsClose ? (english ? 'Disabled' : '已停用') : (english ? 'Active' : '运行中');
        var clientBasicAuth = !!(row.Client && row.Client.BasicAuthSet);
        var basicAuthState = row.BasicAuthSet ? (english ? 'Rule configured' : '规则已配置') : (clientBasicAuth ? (english ? 'Client configured' : '客户端已配置') : (english ? 'Not configured' : '未配置'));
        var proxyProtocol = Number((row.Target || {}).ProxyProtocol || 0) === 1 ? 'PROXY v1' : (Number((row.Target || {}).ProxyProtocol || 0) === 2 ? 'PROXY v2' : (english ? 'Disabled' : '关闭'));
        var healthSummary = '';
        if (row.HealthCheckType || row.HealthCheckTarget) {
            healthSummary = (row.HealthCheckType === 'http' ? 'HTTP' : 'TCP')
                + (row.HealthCheckTarget ? ' · ' + String(row.HealthCheckTarget).replace(/\r?\n/g, ', ') : '')
                + (row.HealthCheckInterval ? ' · ' + row.HealthCheckInterval + (english ? 's' : ' 秒') : '');
        }
        var routeCard = card('route', label('路由与访问', 'Routing & access'),
            kv(label('域名来源', 'Domain source'), source)
            + kv(label('规则状态', 'Rule status'), text(ruleState))
            + kv(label('客户端', 'Client'), text(clientName + ' / ' + clientState))
            + kv(label('备注', 'Remark'), text(row.Remark || '-'))
            + kv(label('协议', 'Protocol'), text(hostSchemeLabel(row.Scheme)))
            + kv(label('路径规则', 'Path rule'), text(row.Location || '/'))
            + kv(label('HTTP 跳转 HTTPS', 'HTTP to HTTPS'), text(onOff(row.AutoHttps)))
            + kv(label('Basic 认证', 'Basic authentication'), text(basicAuthState)));
        var backendCard = card('exchange-alt', label('后端与 TLS', 'Backend & TLS'),
            kv(label('内网目标协议', 'Backend protocol'), text(row.TargetIsHTTPS ? 'HTTPS' : 'HTTP'))
            + kv(label('HTTPS 原样透传', 'HTTPS passthrough'), text(onOff(row.HTTPSJustProxy)))
            + kv(label('TLS 卸载后透传', 'TLS offload'), text(onOff(row.TLSOffload)))
            + kv(label('自动申请证书', 'Automatic certificate'), text(onOff(row.AutoSSL)))
            + kv(label('本地代理', 'Local proxy'), text(onOff((row.Target || {}).LocalProxy)))
            + kv(label('后端 PROXY Protocol', 'Backend PROXY protocol'), text(proxyProtocol))
            + kv(label('自动 CORS', 'Auto CORS'), text(onOff(row.AutoCORS)))
            + kv(label('兼容模式', 'Compatibility mode'), text(onOff(row.CompatMode))));
        var accessCard = card('shield-alt', label('访问与限速', 'Access & limits'),
            kv(label('仅允许已登记 IP', 'Registered IPs only'), text(onOff(row.RegisteredOnly)))
            + kv(label('名单冲突策略', 'List policy'), text(row.IpListPriority === 1 ? (english ? 'Allow first' : '白名单优先') : (english ? 'Deny first' : '黑名单优先')))
            + kv(label('上行限速 / 当前', 'Upload limit / current'), text(String(row.UploadLimit || 0) + ' KB/s / ' + changeunit(row.UploadRate || 0) + '/s'))
            + kv(label('下行限速 / 当前', 'Download limit / current'), text(String(row.DownloadLimit || 0) + ' KB/s / ' + changeunit(row.DownloadRate || 0) + '/s'))
            + (((row.BlackIpList || []).length || (row.WhiteIpList || []).length)
                ? chips(label('来源名单', 'Source lists'), (row.BlackIpList || []).concat(row.WhiteIpList || []))
                : ''));
        var advancedSection = section('code-branch', label('目标与高级路由', 'Target & advanced routing'),
            codeValue(label('内网目标', 'Internal target'), target)
            + (healthSummary ? kv(label('健康检查', 'Health check'), text(healthSummary)) : '')
            + (row.HeaderChange ? codeValue(label('附加请求头', 'Additional headers'), row.HeaderChange) : '')
            + (row.HostChange ? codeValue(label('上游 Host', 'Upstream Host'), row.HostChange) : '')
            + (row.PathRewrite ? codeValue(label('路径重写', 'Path rewrite'), row.PathRewrite) : '')
            + (row.ResponseHeaderChange ? codeValue(label('响应头修改', 'Response headers'), row.ResponseHeaderChange) : '')
            + (row.RedirectURL ? kv(label('重定向地址', 'Redirect URL'), text(row.RedirectURL)) : ''));
        return '<div class="host-detail">'
            + '<div class="host-detail__cards">' + routeCard + backendCard + accessCard + '</div>'
            + advancedSection
            + '</div>';
    },
    columns: [
        {checkbox: true, align: 'center', valign: 'middle'},
        {field: 'Id', title: '<span data-i18n-zh="ID" data-i18n-en="ID">ID</span>', align: 'center', class: 'host-list__id', width: '72px', sortable: true},
        {field: 'Host', title: '<span data-i18n-zh="访问入口" data-i18n-en="Public entry">访问入口</span>', class: 'host-list__entry', formatter: function (value, row) {
            var scheme = String(row.Scheme || 'all'); var links = '';
            if (scheme === 'all' || scheme === 'http') links += hostEndpointLink('HTTP', hostPublicURL(row.Host, row.HttpPort || hostHttpPort, 'http', row.Location));
            if (scheme === 'all' || scheme === 'https') links += hostEndpointLink('HTTPS', hostPublicURL(row.Host, row.HttpsPort || hostHttpsPort, 'https', row.Location));
            var managed = row.PlatformManaged ? '<span class="badge badge-primary host-platform-badge">' + (npsIsEnglish() ? 'Platform' : '平台') + '</span>' : '';
            var basicEnabled = row.BasicAuthSet || !!(row.Client && row.Client.BasicAuthSet);
            var lock = basicEnabled ? '<i class="fa fa-lock host-entry__lock" title="' + (npsIsEnglish() ? 'Basic authentication enabled' : '已启用 Basic 认证') + '" data-title-zh="已启用 Basic 认证" data-title-en="Basic authentication enabled" aria-hidden="true"></i>' : '';
            return '<div class="host-entry"><div class="host-entry__name">' + lock + npsEscapeHtml(row.Host || '-') + managed + '</div><div class="host-entry__links">' + links + '</div></div>';
        }},
        {field: 'Remark', title: '<span data-i18n-zh="备注" data-i18n-en="Remark">备注</span>', class: 'host-list__remark', formatter: function (value) { return npsEscapeHtml(value || '-'); }},
        {field: 'Client', title: '<span data-i18n-zh="客户端" data-i18n-en="Client">客户端</span>', class: 'host-list__client', formatter: function (value, row) {
            var client = row.Client || {}, name = client.Id ? String(client.Id) + ' · ' + String(client.Remark || '-') : '-';
            var state = client.IsConnect ? (npsIsEnglish() ? 'Online' : '在线') : (npsIsEnglish() ? 'Offline' : '离线');
            return '<div class="host-client"><span>' + npsEscapeHtml(name) + '</span><small class="' + (client.IsConnect ? 'is-online' : 'is-offline') + '">' + state + '</small></div>';
        }},
        {field: 'Target', title: '<span data-i18n-zh="内网目标" data-i18n-en="Internal target">内网目标</span>', class: 'host-list__target', formatter: function (value, row) { return '<code class="host-target-cell">' + npsEscapeHtml((row.Target || {}).TargetStr || '-') + '</code>'; }},
        {field: 'IsClose', title: '<span data-i18n-zh="状态" data-i18n-en="Status">状态</span>', align: 'center', class: 'host-list__status', formatter: function (value) { return value ? '<span class="badge badge-warning" data-i18n-zh="已停用" data-i18n-en="Disabled">已停用</span>' : '<span class="badge badge-success" data-i18n-zh="运行中" data-i18n-en="Active">运行中</span>'; }},
        {field: 'option', title: '<span data-i18n-zh="操作" data-i18n-en="Actions">操作</span>', align: 'center', class: 'host-list__actions', formatter: function (value, row) {
            var id = Number(row.Id); if (!isFinite(id) || Math.floor(id) !== id || id <= 0) return '';
            var button = '<div class="btn-group host-actions">';
            button += '<button type="button" onclick="npsOpenTrafficDebug(\'host\',' + id + ')" class="btn btn-outline btn-info" title="' + (npsIsEnglish() ? 'Live request inspector' : '实时请求调试') + '" aria-label="' + (npsIsEnglish() ? 'Live request inspector' : '实时请求调试') + '"><i class="fa fa-terminal" aria-hidden="true"></i></button>';
            if (row.IsClose) button += '<button type="button" onclick="submitform(\'start\', \'{{.web_base_url}}/index/hoststart\', {id:' + id + '})" class="btn btn-outline btn-primary" title="' + (npsIsEnglish() ? 'Enable rule' : '启用规则') + '" aria-label="' + (npsIsEnglish() ? 'Enable rule' : '启用规则') + '"><i class="fa fa-play" aria-hidden="true"></i></button>';
            else button += '<button type="button" onclick="submitform(\'stop\', \'{{.web_base_url}}/index/hoststop\', {id:' + id + '})" class="btn btn-outline btn-warning" title="' + (npsIsEnglish() ? 'Disable rule' : '停用规则') + '" aria-label="' + (npsIsEnglish() ? 'Disable rule' : '停用规则') + '"><i class="fa fa-pause" aria-hidden="true"></i></button>';
            button += '<a href="{{.web_base_url}}/index/edithost?id=' + id + '" class="btn btn-outline btn-success" title="' + (npsIsEnglish() ? 'Edit rule' : '编辑规则') + '" aria-label="' + (npsIsEnglish() ? 'Edit rule' : '编辑规则') + '"><i class="fa fa-edit" aria-hidden="true"></i></a>';
            button += '<button type="button" onclick="submitform(\'delete\', \'{{.web_base_url}}/index/delhost\', {id:' + id + '})" class="btn btn-outline btn-danger" title="' + (npsIsEnglish() ? 'Delete rule' : '删除规则') + '" aria-label="' + (npsIsEnglish() ? 'Delete rule' : '删除规则') + '"><i class="fa fa-trash" aria-hidden="true"></i></button></div>';
            return button;
        }}
    ]
});
</script>
