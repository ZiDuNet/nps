<section class="form-page form-page-host form-page-create" aria-labelledby="host-form-title">
    <header class="dashboard-page-header form-page-header">
        <div class="form-page-heading">
            <div class="dashboard-page-kicker" data-i18n-zh="虚拟主机" data-i18n-en="Virtual hosts">虚拟主机</div>
            <h1 id="host-form-title" langtag="page-hostadd"></h1>
            <p data-i18n-zh="配置域名、协议和后端目标，建立可路由的 HTTP 或 HTTPS 入口。" data-i18n-en="Configure a domain, protocol, and backend target to create a routable HTTP or HTTPS entry.">配置域名、协议和后端目标，建立可路由的 HTTP 或 HTTPS 入口。</p>
        </div>
        <div class="dashboard-page-actions form-page-actions">
            <a class="btn btn-outline btn-primary form-page-back" href="{{.web_base_url}}/index/hostlist">
                <i class="fa fa-arrow-left" aria-hidden="true"></i>
                <span data-i18n-zh="返回列表" data-i18n-en="Back to list">返回列表</span>
            </a>
        </div>
    </header>
    <div class="row form-page-grid">
    <div class="col-md-12 col-md-auto">
        <div class="ibox float-e-margins form-workflow-card">
            <div class="ibox-content form-workflow-content">
                <form class="form-horizontal form-workflow-form" data-form-workflow="host-create">
                    <div class="form-section-title"><i class="fa fa-link" aria-hidden="true"></i><span data-i18n-zh="基础配置" data-i18n-en="Connection">基础配置</span></div>
                    <div class="form-group">
                        <label class="col-sm-2 control-label font-bold" langtag="word-clientid"></label>
                        <div class="col-sm-10">
                            <select class="form-control" name="client_id" placeholder=""
                                    langtag="word-belongclient"></select>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="col-sm-2 control-label font-bold" langtag="word-remark"></label>
                        <div class="col-sm-10">
                            <input class="form-control" type="text" name="remark" placeholder="" langtag="word-remark" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="col-sm-2 control-label font-bold" langtag="word-host"></label>
                        <div class="col-sm-10">
                            <input class="form-control" type="text" name="host" placeholder=""
                                   langtag="info-suchashost">
                        </div>
                    </div>
                    <div class="form-group" id="scheme">
                        <label class="col-sm-2 control-label font-bold" langtag="word-scheme"></label>
                        <div class="col-sm-10">
                            <select id="scheme_select" class="form-control" name="scheme">
                                <option value="all" langtag="word-all"></option>
                                <option value="http" langtag="word-http"></option>
                                <option value="https" langtag="word-https"></option>
                            </select>
                        </div>
                    </div>

                    <div class="form-section-title"><i class="fa fa-certificate" aria-hidden="true"></i><span data-i18n-zh="SSL / HTTPS" data-i18n-en="SSL / HTTPS">SSL / HTTPS</span></div>
                    <div class="form-group" id="AutoHttps">
                        <label class="col-sm-2 control-label font-bold" data-i18n-zh="自动 HTTPS（301）" data-i18n-en="Automatic HTTPS (301)">自动 HTTPS（301）</label>
                        <div class="col-sm-10">
                            <div class="toggle-field">
                                <input type="hidden" name="AutoHttps" value="0">
                                <label class="toggle-switch"><input type="checkbox"><span class="toggle-slider"></span></label>
                                <span class="toggle-label" data-i18n-zh="否" data-i18n-en="No">否</span>
                            </div>
                        </div>
                    </div>
                    <div class="form-group" id="cert_file">
                        <label class="col-sm-2 control-label font-bold" langtag="word-httpscert"></label>
                        <div class="col-sm-10">
                            <textarea rows="6" class="form-control" type="text" name="cert_file_path" id="pemText"
                                      placeholder="请将证书文件拖拽或将内容复制粘贴到此处，证书文件格式为：xxxx_example.com.pem。
或者配置证书文件路径。"
                                      data-placeholder-zh="请将证书文件拖拽或将内容复制粘贴到此处，证书文件格式为：xxxx_example.com.pem。或者配置证书文件路径。"
                                      data-placeholder-en="Drop or paste the certificate content here, or enter the certificate file path."></textarea>
                        </div>
                    </div>
                    <div class="form-group" id="key_file">
                        <label class="col-sm-2 control-label font-bold" langtag="word-httpskey"></label>
                        <div class="col-sm-10">
                            <textarea rows="6" class="form-control" type="text" name="key_file_path" id="pemKey"
                                      placeholder="请将私钥文件拖拽或复制粘贴到此处，证书秘钥格式为：xxxx_example.com.key。或者配置秘钥文件路径。"
                                      data-placeholder-zh="请将私钥文件拖拽或复制粘贴到此处，证书秘钥格式为：xxxx_example.com.key。或者配置秘钥文件路径。"
                                      data-placeholder-en="Drop or paste the private key here, or enter the private key file path."></textarea>
                        </div>
                    </div>

                    <div class="form-section-title"><i class="fa fa-route" aria-hidden="true"></i><span data-i18n-zh="路由配置" data-i18n-en="Routing">路由配置</span></div>
                    <div class="form-group">
                        <label class="col-sm-2 control-label font-bold" langtag="word-urlroute"></label>
                        <div class="col-sm-10">
                            <input class="form-control" type="text" name="location" placeholder=""
                                   langtag="info-unrestricted">
                        </div>
                    </div>
                    {{if eq true .allow_local_proxy}}
                    <div class="form-group" id="local_proxy">
                        <label class="col-sm-2 control-label font-bold" langtag="word-proxytolocal"></label>
                        <div class="col-sm-10">
                            <div class="toggle-field">
                                <input type="hidden" name="local_proxy" value="0">
                                <label class="toggle-switch"><input type="checkbox"><span class="toggle-slider"></span></label>
                                <span class="toggle-label" data-i18n-zh="否" data-i18n-en="No">否</span>
                            </div>
                        </div>
                    </div>
                    {{end}}
                    <div class="form-group">
                        <label class="col-sm-2 control-label font-bold" langtag="word-target"></label>
                        <div class="col-sm-10">
                            <textarea class="form-control" rows="4" type="text" name="target" placeholder=""
                                      langtag="info-suchasiplist"></textarea>
                            <span class="help-block m-b-none" langtag="info-targethost"></span>
                        </div>
                    </div>

                    <div class="form-section-title"><i class="fa fa-exchange-alt" aria-hidden="true"></i><span data-i18n-zh="请求改写" data-i18n-en="Request rewriting">请求改写</span></div>
                    <div class="form-group" id="header">
                        <label class="col-sm-2 control-label font-bold" langtag="word-requestheader"></label>
                        <div class="col-sm-10">
                            <textarea class="form-control" rows="4" type="text" name="header"
                                      placeholder="Cache-Control: no-cache"></textarea>
                            <span class="help-block m-b-none" langtag="info-header"></span>
                        </div>
                    </div>
                    <div class="form-group" id="hostchange">
                        <label class="col-sm-2 control-label font-bold" langtag="word-requesthost"></label>
                        <div class="col-sm-10">
                            <input class="form-control" value="" type="text" name="hostchange" placeholder=""
                                   langtag="word-requesthost">
                        </div>
                    </div>

                    <div class="hr-line-dashed form-workflow-divider"></div>
                    <div class="form-group form-workflow-actions">
                        <div class="col-sm-4 col-sm-offset-2">
                            <button class="btn btn-success" type="button"
                                    onclick="submitform('add', '{{.web_base_url}}/index/addhost', $('form').serializeArray())">
                                <i class="fa fa-fw fa-lg fa-check-circle"></i> <span langtag="word-add"></span>
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
</section>
<script>
    $(function () {
        var pemText = document.getElementById("pemText");
        var pemKey = document.getElementById("pemKey");

        document.addEventListener("dragover", function (event) {
            event.preventDefault();
        });

        pemText.addEventListener("drop", function (event) {
            event.preventDefault();
            var file = event.dataTransfer.files[0];
            var reader = new FileReader();
            reader.onload = function (e) { pemText.value = e.target.result; }
            reader.readAsText(file);
        });

        pemKey.addEventListener("drop", function (event) {
            event.preventDefault();
            var file = event.dataTransfer.files[0];
            var reader = new FileReader();
            reader.onload = function (e) { pemKey.value = e.target.result; }
            reader.readAsText(file);
        });

        function updateSchemeUI() {
            var val = $("#scheme_select").val();
            if (val == "all" || val == "https") {
                $("#cert_file").show();
                $("#key_file").show();
                $("#AutoHttps").show();
            } else {
                $("#cert_file").hide();
                $("#key_file").hide();
                $("#AutoHttps").hide();
            }
        }
        $("#scheme_select").on("change", updateSchemeUI);

        // Toggle labels
        $('.toggle-switch input[type="checkbox"]').on('change', function() {
            npsSetToggleLabel($(this).closest('.toggle-field').find('.toggle-label'), this.checked);
        });

        getClientList();
    })

    function getClientList() {
        var select = document.querySelector("select[name='client_id']");
        if (!select) return;
        select.textContent = '';
        var selectedClientId = Number('{{.client_id}}');
        if (!isFinite(selectedClientId) || Math.floor(selectedClientId) !== selectedClientId || selectedClientId < 0) {
            selectedClientId = 0;
        }
        $.ajax({
            type: "POST",
            url: "{{.web_base_url}}/client/list",
            data: {order: "asc", offset: 0, limit: 999},
            dataType: "json",
            success: function (data) {
                if (data && Array.isArray(data.rows)) {
                    for (var i = 0; i < data.rows.length; i++) {
                        var clientId = Number(data.rows[i].Id);
                        if (!isFinite(clientId) || Math.floor(clientId) !== clientId || clientId <= 0) continue;
                        var option = document.createElement('option');
                        option.value = String(clientId);
                        option.textContent = clientId + '-' + (data.rows[i].Remark || '');
                        option.selected = clientId === selectedClientId;
                        select.appendChild(option);
                    }
                }
            }
        });
    }
</script>
