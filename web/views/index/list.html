<section class="wrapper wrapper-content animated fadeInRight management-page management-page--tunnel" aria-labelledby="tunnel-list-title">
    <header class="dashboard-page-header management-page-header">
        <div>
            <div class="dashboard-page-kicker" data-i18n-zh="隧道管理" data-i18n-en="Tunnel management">隧道管理</div>
            <h1 id="tunnel-list-title"><span id="langtag"></span><span id="list-title-name"></span></h1>
            <p data-i18n-zh="查看、筛选并维护当前客户端的转发规则。" data-i18n-en="Review, filter, and maintain forwarding rules for the selected client.">查看、筛选并维护当前客户端的转发规则。</p>
        </div>
    </header>
    <div class="management-page-grid">
        <div class="management-page-column">
            <section class="panel ibox float-e-margins management-table-card zui-panel">
                <div class="ibox-content management-table-content">
                    <div id="toolbar" class="management-table-toolbar">
                        <a href="{{.web_base_url}}/index/add?type={{.type}}&client_id={{.client_id}}" class="btn btn-primary dim">
                            <i class="fa fa-fw fa-lg fa-plus"></i> <span langtag="word-add"></span>
                        </a>
                        <a href="#" onclick="batchDelete('{{.web_base_url}}/index/del');return false;" class="btn btn-danger dim">
                            <i class="fa fa-fw fa-lg fa-trash"></i> <span langtag="word-batchdelete"></span>
                        </a>
                        {{if eq true .isAdmin}}
                        <label class="nps-table-filter" for="tunnel-owner-filter">
                            <span class="nps-table-filter__label" data-i18n-zh="所属用户" data-i18n-en="Owner">所属用户</span>
                            <select id="tunnel-owner-filter" class="form-control nps-table-filter__control" data-nps-table-filter="user_id">
                                <option value="" data-i18n-zh="全部用户" data-i18n-en="All users">全部用户</option>
                                <option value="0" data-i18n-zh="未分配" data-i18n-en="Unassigned">未分配</option>
                                {{range .users}}
                                <option value="{{.Id}}">{{.Id}} · {{.UserName}}</option>
                                {{end}}
                            </select>
                        </label>
                        {{end}}
                    </div>
                    <table id="table"></table>
                </div>
            </section>
        </div>
    </div>
</section>

<script>
    var tunnelListName = '{{.name}}:'.replace(/\s*/g, "");
    var tunnelListType = tunnelListName.split(":")[0];
    var tunnelListMode = '{{.type}}';
    var tunnelListClientId = Number('{{.client_id}}');
    // Keep the operational columns usable on narrow desktop/tablet widths;
    // the remaining fields stay available through the detail row and column menu.
    var tunnelListCompact = window.matchMedia && window.matchMedia('(min-width: 769px) and (max-width: 1599px)').matches;
    if (!isFinite(tunnelListClientId) || Math.floor(tunnelListClientId) !== tunnelListClientId || tunnelListClientId < 0) {
        tunnelListClientId = 0;
    }
    var tunnelListLanguageKey = tunnelListType === 'host' ? 'page-hostlist' : 'page-list' + tunnelListType;
    $('#langtag').attr('langtag', tunnelListLanguageKey);
    $('#list-title-name').text(tunnelListName.split(":")[1]);

    function tunnelText(value) {
        return npsEscapeHtml(value);
    }

    function tunnelBoolean(value) {
        return npsBooleanMarkup(!!value);
    }

    // Keep the table focused on fields that belong to the selected tunnel
    // mode.  The detail row remains the source for secondary values, so the
    // desktop table does not grow wider just because a mode has a different
    // connection model.
    var tunnelListModeColumns = {
        tcp:       {port: true,  address: true,  target: true,  password: false},
        udp:       {port: true,  address: true,  target: true,  password: false},
        httpProxy: {port: true,  address: true,  target: false, password: false},
        socks5:    {port: true,  address: true,  target: false, password: false},
        file:      {port: true,  address: true,  target: false, password: false},
        secret:    {port: false, address: false, target: true,  password: true},
        p2p:       {port: false, address: false, target: true,  password: true}
    };
    var tunnelListColumns = tunnelListModeColumns[tunnelListMode] || {
        port: true,
        address: true,
        target: true,
        password: true
    };
    function tunnelListColumnVisible(name, secondary) {
        if (tunnelListColumns[name] === false) return false;
        return !secondary || !tunnelListCompact;
    }

    /* ZUI-compatible remote table */
    $('#table').npsTable({
        toolbar: "#toolbar",
        method: 'post', // 服务器数据的请求方式 get or post
        url: "{{.web_base_url}}/index/gettunnel", // 服务器数据的加载地址
        queryParams: function (params) {
            return {
                "offset": params.offset,
                "limit": params.limit,
                "type": tunnelListMode,
                "client_id": tunnelListClientId,
                "search": params.search,
                "sort": params.sort,
                "order": params.order
            }
        },
        search: true,
        contentType: "application/x-www-form-urlencoded",
        striped: true, // 设置为true会有隔行变色效果
        showHeader: true,
        showColumns: true,
        showRefresh: true,
        pagination: true,//分页
        sidePagination: 'server',//服务器端分页
        pageNumber: 1,
        pageList: [5, 10, 20, 50],//分页步进值
        detailView: true,
        smartDisplay: true, // 智能显示 pagination 和 cardview 等
        formatLoadingMessage: function () { return npsTableState('tunnel', true); },
        formatNoMatches: function () { return npsTableState('tunnel', false); },
        onExpandRow: function () {
            $('body').setLang('.detail-view');
            npsDecorateDetailControls('#table');
        },
        onCollapseRow: function () { window.setTimeout(function () { npsDecorateDetailControls('#table'); }, 0); },
        onLoadSuccess:function (data) {$('body').setLang ('.detail-view');},
        onPostBody: function (data) {
            $('body').setLang('#table');
            npsApplyTableState(this, 'tunnel');
        },
        detailFormatter: function (index, row, element) {
            var flow = row.Flow || {};
            var client = row.Client || {};
            var config = client.Cnf || {};
            var target = row.Target || {};
            // The identification key is only part of secret/p2p tunnel
            // credentials. Keep it out of the expanded detail for modes that
            // never consume it (tcp, udp, http proxy, socks5, and file).
            var identificationMarkup = (row.Mode === 'secret' || row.Mode === 'p2p')
                    ? '<div><b langtag="word-identificationkey"></b><span>' + tunnelText(row.Password || '-') + '</span></div>'
                    : '';
            var tmp = '<div class="tunnel-detail-summary">'
                    + '<div><b langtag="word-remark"></b><span>' + tunnelText(row.Remark || '-') + '</span></div>'
                    + '<div><b langtag="word-verifykey"></b><span>' + tunnelText(client.VerifyKey || '-') + '</span></div>'
                    + identificationMarkup
                    + '<div><b langtag="word-exportflow"></b><span>' + tunnelText(changeunit(flow.ExportFlow)) + '</span></div>'
                    + '<div><b langtag="word-inletflow"></b><span>' + tunnelText(changeunit(flow.InletFlow)) + '</span></div>'
                    + '<div><b langtag="word-crypt"></b><span>' + tunnelBoolean(config.Crypt) + '</span></div>'
                    + '<div><b langtag="word-compress"></b><span>' + tunnelBoolean(config.Compress) + '</span></div>'
                    + '<div><b langtag="word-basicusername"></b><span>' + tunnelText(config.U || '-') + '</span></div>'
                    + '<div><b langtag="word-basicpassword"></b><span>' + tunnelText(config.P || '-') + '</span></div>'
                    + '<div><b langtag="word-protoversion"></b><span>' + tunnelText(row.ProtoVersion || '-') + '</span></div>'
                    + '<div><b langtag="word-runstatus"></b><span>' + tunnelBoolean(row.RunStatus) + '</span></div>'
                    + '<div><b langtag="word-clientstatus"></b><span>' + tunnelBoolean(client.IsConnect) + '</span></div>'
                    + '</div>';
            var copyBtn = '<button type="button" class="copy btn btn-info btn-xs" onclick="copyCommand(this)" data-clipboard-text="" data-title-zh="复制命令" data-title-en="Copy command" data-aria-label-zh="复制命令" data-aria-label-en="Copy command"><i class="fa fa-copy" aria-hidden="true"></i></button>'
            if (row.Mode == "p2p") {
                var p2pCmd = tmp + "<br/><br>"
                        + '<b langtag="word-commandaccessp2p"></b>: ' + "<code>{{.win}} -server={{.ip}}:{{.p}} -vkey=" + tunnelText(client.VerifyKey)
                        + " -type={{.bridgeType}} -password=" + tunnelText(row.Password) + " -target=" + tunnelText(target.TargetStr) + "</code>" + copyBtn + "<br/><br>"
                        + '<b langtag="word-commandaccessp2ps"></b>: ' + "<code>{{.win}} -server={{.ip}}:{{.p}} -vkey=" + tunnelText(client.VerifyKey)
                        + " -type={{.bridgeType}} -password=" + tunnelText(row.Password) + " -local_type=p2ps" + "</code>" + copyBtn + "<br/><br>"
                        + '<b langtag="word-commandaccessp2pt"></b>: ' + "<code>{{.win}} -server={{.ip}}:{{.p}} -vkey=" + tunnelText(client.VerifyKey)
                        + " -type={{.bridgeType}} -password=" + tunnelText(row.Password) + " -local_type=p2pt" + "</code>" + copyBtn
                {{if .tls_enable}}
                p2pCmd += "<br/><br>"
                        + '<b langtag="word-commandaccessp2p-tls"></b>: ' + "<code>{{.win}} -server={{.ip}}:{{.tls_p}} -vkey=" + tunnelText(client.VerifyKey)
                        + " -type={{.bridgeType}} -password=" + tunnelText(row.Password) + " -target=" + tunnelText(target.TargetStr) + " -tls_enable=true</code>" + copyBtn + "<br/><br>"
                        + '<b langtag="word-commandaccessp2ps-tls"></b>: ' + "<code>{{.win}} -server={{.ip}}:{{.tls_p}} -vkey=" + tunnelText(client.VerifyKey)
                        + " -type={{.bridgeType}} -password=" + tunnelText(row.Password) + " -local_type=p2ps -tls_enable=true</code>" + copyBtn + "<br/><br>"
                        + '<b langtag="word-commandaccessp2pt-tls"></b>: ' + "<code>{{.win}} -server={{.ip}}:{{.tls_p}} -vkey=" + tunnelText(client.VerifyKey)
                        + " -type={{.bridgeType}} -password=" + tunnelText(row.Password) + " -local_type=p2pt -tls_enable=true</code>" + copyBtn
                {{end}}
                return p2pCmd
            }
            if (row.Mode == "secret") {
                var secretCmd = tmp + "<br/><br>" + '<b langtag="word-commandaccess"></b>: ' + "<code>{{.win}} -server={{.ip}}:{{.p}} -vkey=" + tunnelText(client.VerifyKey)
                        + " -type={{.bridgeType}} -password=" + tunnelText(row.Password) + " -local_type=secret" + "</code>" + copyBtn
                {{if .tls_enable}}
                secretCmd += "<br/><br>" + '<b langtag="word-commandaccess-tls"></b>: ' + "<code>{{.win}} -server={{.ip}}:{{.tls_p}} -vkey=" + tunnelText(client.VerifyKey)
                        + " -type={{.bridgeType}} -password=" + tunnelText(row.Password) + " -local_type=secret -tls_enable=true</code>" + copyBtn
                {{end}}
                return secretCmd
            }
            return tmp
        },
        //表格的列
        columns: [
            {
                checkbox: true,
                align: 'center',
                valign: 'middle'
            },
            {
                field: 'Id',//域值
                title: '<span langtag="word-id"></span>',//标题
                halign: 'center',
                class: 'tunnel-list__id',
                width: '56px',
                visible: true,//false表示不显示
                sortable: true,//启用排序
            },
            {
                field: 'ClientId',//域值
                title: '<span langtag="word-clientid"></span>',//标题
                halign: 'center',
                visible: true,//false表示不显示
                sortable: true, //启用排序
                formatter: function (value, row, index) {
                    var client = row.Client || {};
                    return tunnelText((client.Id == null ? '' : client.Id) + '-' + (client.Remark || ''));
                }
            },
            {
                field: 'Remark',//域值
                title: '<span langtag="word-remark"></span>',//标题
                halign: 'center',
                sortable: true,
                visible: tunnelListColumnVisible('remark', true),//false表示不显示
                escape: true
            },
            {
                field: 'Client.VerifyKey',//域值
                title: '<span langtag="word-verifykey"></span>',//标题
                halign: 'center',
                sortable: true, //启用排序
                visible: tunnelListColumnVisible('verifykey', true),//false表示不显示
                escape: true
            },
            {
                field: 'Mode',//域值
                title: '<span langtag="word-scheme"></span>',//标题
                halign: 'center',
                sortable: true,
                visible: true,//false表示不显示
                formatter: function (value, row, index) {
                    var scheme = String(value || '').replace(/[^A-Za-z0-9_-]/g, '');
                    return '<span langtag="scheme-' + scheme + '"></span>'
                }
            },
            {
                field: 'Port',//域值
                title: '<span langtag="word-port"></span>',//标题
                halign: 'center',
                sortable: true, //启用排序
                visible: tunnelListColumnVisible('port')//false表示不显示
            },
            {
                field: 'address',//域值
                title: '<span langtag="word-accessaddress"></span>',//标题
                halign: 'center',
                sortable: false, //计算列，按 Port 排序即可
                visible: tunnelListColumnVisible('address'),//false表示不显示
                formatter: function (value, row, index) {
                    var address = "{{.ip}}" + ":" + Number(row.Port);
                    var safeAddress = tunnelText(address);
                    return "<a href='http://" + safeAddress + "' target='_blank' rel='noopener noreferrer'>" + safeAddress + "</a>"
                }
            },
            {
                field: 'Target',//域值
                title: '<span langtag="word-target"></span>',//标题
                halign: 'center',
                visible: tunnelListColumnVisible('target'),//false表示不显示
                sortable: true, //启用排序
                formatter: function (value, row, index) {
                    return tunnelText((row.Target || {}).TargetStr);
                }
            },
            {
                field: 'Password',//域值
                title: '<span langtag="word-identificationkey"></span>',//标题
                halign: 'center',
                sortable: true,
                visible: tunnelListColumnVisible('password', true),//false表示不显示
                escape: true
            },
            {
                field: 'Status',//域值
                title: '<span langtag="word-status"></span>',//内容
                align: 'center',
                halign: 'center',
                visible: true,//false表示不显示
                sortable: true,
                formatter: function (value, row, index) {
                    if (value) {
                        return '<span class="badge badge-primary" langtag="word-open"></span>'
                    } else {
                        return '<span class="badge badge-badge" langtag="word-close"></span>'
                    }
                }
            },
            {
                field: 'RunStatus',//域值
                title: '<span langtag="word-runstatus"></span>',//内容
                align: 'center',
                halign: 'center',
                visible: tunnelListColumnVisible('runstatus', true),//false表示不显示
                sortable: true,
                formatter: function (value, row, index) {
                    if (value) {
                        return '<span class="badge badge-primary" langtag="word-open"></span>'
                    } else {
                        return '<span class="badge badge-badge" langtag="word-close"></span>'
                    }
                }
            },
            {
                field: 'IsConnect',//域值
                title: '<span langtag="word-clientstatus"></span>',//内容
                align: 'center',
                halign: 'center',
                visible: tunnelListColumnVisible('clientstatus', true),//false表示不显示
                sortable: true,
                formatter: function (value, row, index) {
                    if (row.Client && row.Client.IsConnect) {
                        return '<span class="badge badge-primary" langtag="word-online"></span>'
                    } else {
                        return '<span class="badge badge-badge" langtag="word-offline"></span>'
                    }
                }
            },
            {
                field: 'option',//域值
                title: '<span langtag="word-option"></span>',//内容
                align: 'center',
                halign: 'center',
                class: 'tunnel-list__actions',
                width: '188px',
                visible: true,//false表示不显示
                formatter: function (value, row, index) {
                    var tunnelId = Number(row.Id);
                    if (!isFinite(tunnelId) || Math.floor(tunnelId) !== tunnelId || tunnelId <= 0) return '';
                    var btn_group = '<div class="btn-group tunnel-actions">'
                    if (row.Status) {
                        btn_group += "<button type=\"button\" onclick=\"submitform('stop', '{{.web_base_url}}/index/stop', {'id':" + tunnelId
                        btn_group += '})" class="btn btn-outline btn-warning" data-title-zh="停止隧道" data-title-en="Stop tunnel" data-aria-label-zh="停止隧道" data-aria-label-en="Stop tunnel"><i class="fa fa-pause" aria-hidden="true"></i></button>'
                    } else {
                        btn_group += "<button type=\"button\" onclick=\"submitform('start', '{{.web_base_url}}/index/start', {\'id\':" + tunnelId
                        btn_group += '})" class="btn btn-outline btn-primary" data-title-zh="启动隧道" data-title-en="Start tunnel" data-aria-label-zh="启动隧道" data-aria-label-en="Start tunnel"><i class="fa fa-play" aria-hidden="true"></i></button>'
                    }
                    btn_group += "<button type=\"button\" onclick=\"submitform('delete', '{{.web_base_url}}/index/del', {'id':" + tunnelId
                    btn_group += '})" class="btn btn-outline btn-danger" data-title-zh="删除隧道" data-title-en="Delete tunnel" data-aria-label-zh="删除隧道" data-aria-label-en="Delete tunnel"><i class="fa fa-trash" aria-hidden="true"></i></button>'

                    btn_group += '<a href="{{.web_base_url}}/index/edit?id=' + tunnelId
                    btn_group += '" class="btn btn-outline btn-success" data-title-zh="编辑隧道" data-title-en="Edit tunnel" data-aria-label-zh="编辑隧道" data-aria-label-en="Edit tunnel"><i class="fa fa-edit" aria-hidden="true"></i></a>'

                    btn_group += "<button type=\"button\" onclick=\"submitform('copy', '{{.web_base_url}}/index/copy', {'id':" + tunnelId
                    btn_group += '})" class="btn btn-outline btn-primary" data-title-zh="复制隧道" data-title-en="Copy tunnel" data-aria-label-zh="复制隧道" data-aria-label-en="Copy tunnel"><i class="fa fa-copy" aria-hidden="true"></i></button></div>'
                    return btn_group
                }
            }
        ]
    });

    function copyCommand(data) {
        data.setAttribute("data-clipboard-text", data.previousElementSibling ? data.previousElementSibling.textContent : '')
    }

    var clipboard = new ClipboardJS('.copy');
    clipboard.on('success', function (e) {
        npsNotify('success', npsIsEnglish() ? 'Copied' : '复制成功');
        e.clearSelection();
    });
    clipboard.on('error', function (e) {
        npsNotify('error', npsIsEnglish() ? 'Copy failed' : '复制失败');
    });
</script>
