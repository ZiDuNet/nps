<section class="wrapper wrapper-content animated fadeInRight management-page management-page--tunnel" aria-labelledby="tunnel-list-title">
    <header class="dashboard-page-header management-page-header">
        <div>
            <div class="dashboard-page-kicker" data-i18n-zh="隧道管理" data-i18n-en="Tunnel management">隧道管理</div>
            <h1 id="tunnel-list-title"><span id="langtag"></span><span id="list-title-name"></span></h1>
            <p data-i18n-zh="查看、筛选并维护当前客户端的转发规则。" data-i18n-en="Review, filter, and maintain forwarding rules for the selected client.">查看、筛选并维护当前客户端的转发规则。</p>
        </div>
    </header>
    <div class="management-page-grid">
        <div class="management-page-column">
            <section class="panel ibox float-e-margins management-table-card nps-panel">
                <div class="ibox-content management-table-content">
                    <div id="toolbar" class="management-table-toolbar">
                        <a href="{{.web_base_url}}/index/add?type={{.type}}&client_id={{.client_id}}" class="btn btn-primary dim">
                            <i class="fa fa-fw fa-lg fa-plus"></i> <span langtag="word-add"></span>
                        </a>
                        <a href="#" onclick="batchDelete('{{.web_base_url}}/index/del');return false;" class="btn btn-danger dim">
                            <i class="fa fa-fw fa-lg fa-trash"></i> <span langtag="word-batchdelete"></span>
                        </a>
                        <button type="button" onclick="batchResourceAction('{{.web_base_url}}/index/start', {}, '批量启用', 'Enable selected')" class="btn btn-outline btn-primary">
                            <i class="fa fa-play" aria-hidden="true"></i> <span data-i18n-zh="批量启用" data-i18n-en="Enable selected">批量启用</span>
                        </button>
                        <button type="button" onclick="batchResourceAction('{{.web_base_url}}/index/stop', {}, '批量停用', 'Disable selected')" class="btn btn-outline btn-warning">
                            <i class="fa fa-pause" aria-hidden="true"></i> <span data-i18n-zh="批量停用" data-i18n-en="Disable selected">批量停用</span>
                        </button>
                        {{if eq true .isAdmin}}
                        <label class="nps-table-filter nps-table-filter--identity" for="tunnel-owner-filter">
                            <span class="nps-table-filter__label" data-i18n-zh="所属用户" data-i18n-en="Owner">所属用户</span>
                            <select id="tunnel-owner-filter" class="form-control nps-table-filter__control" data-nps-table-filter="user_id">
                                <option value="" data-i18n-zh="全部用户" data-i18n-en="All users">全部用户</option>
                                <option value="0" data-i18n-zh="未分配" data-i18n-en="Unassigned">未分配</option>
                                {{range .users}}
                                <option value="{{.Id}}"
                                    data-i18n-zh="{{if and .Remark (ne .Remark .UserName)}}{{.Remark}}（{{.UserName}}）{{else}}{{.UserName}}{{end}}"
                                    data-i18n-en="{{if and .Remark (ne .Remark .UserName)}}{{.Remark}} ({{.UserName}}){{else}}{{.UserName}}{{end}}">{{if and .Remark (ne .Remark .UserName)}}{{.Remark}}（{{.UserName}}）{{else}}{{.UserName}}{{end}}</option>
                                {{end}}
                            </select>
                        </label>
                        {{end}}
                        <label class="nps-table-filter nps-table-filter--identity" for="tunnel-client-filter">
                            <span class="nps-table-filter__label" data-i18n-zh="客户端" data-i18n-en="Client">客户端</span>
                            <select id="tunnel-client-filter" class="form-control nps-table-filter__control" data-nps-table-filter="filter_client_id" {{if .client_id}}disabled{{end}}>
                                <option value="0" data-i18n-zh="全部客户端" data-i18n-en="All clients">全部客户端</option>
                                {{range .clients}}
                                <option value="{{.Id}}" data-filter-owner-id="{{.UserId}}"
                                    data-i18n-zh="{{if .Remark}}{{.Remark}}（ID {{.Id}}）{{else}}未命名客户端（ID {{.Id}}）{{end}}"
                                    data-i18n-en="{{if .Remark}}{{.Remark}} (ID {{.Id}}){{else}}Unnamed client (ID {{.Id}}){{end}}">{{if .Remark}}{{.Remark}}（ID {{.Id}}）{{else}}未命名客户端（ID {{.Id}}）{{end}}</option>
                                {{end}}
                            </select>
                        </label>
                    </div>
                    <table id="table"></table>
                </div>
            </section>
        </div>
    </div>
</section>

<script>
    var tunnelListName = '{{.name}}:'.replace(/\s*/g, "");
    var tunnelListType = tunnelListName.split(":")[0];
    var tunnelListMode = '{{.type}}';
    var tunnelListClientId = Number('{{.client_id}}');
    // Keep the operational columns usable on narrow desktop/tablet widths;
    // the remaining fields stay available through the detail row and column menu.
    var tunnelListCompact = window.matchMedia && window.matchMedia('(min-width: 769px) and (max-width: 1599px)').matches;
    if (!isFinite(tunnelListClientId) || Math.floor(tunnelListClientId) !== tunnelListClientId || tunnelListClientId < 0) {
        tunnelListClientId = 0;
    }
    // Preserve the client scope when this list was opened from a client row.
    // The filter uses a separate request key so its default "all" value can
    // never overwrite the scoped client_id query parameter.
    if (tunnelListClientId > 0) {
        $('#tunnel-client-filter').val(String(tunnelListClientId));
    }
    var tunnelListLanguageKey = tunnelListType === 'host' ? 'page-hostlist' : 'page-list' + tunnelListType;
    $('#langtag').attr('langtag', tunnelListLanguageKey);
    $('#list-title-name').text(tunnelListName.split(":")[1]);

    function tunnelText(value) {
        return npsEscapeHtml(value);
    }

    function tunnelBoolean(value) {
        return npsBooleanMarkup(!!value);
    }

    function tunnelTargetItems(value) {
        var raw = String(value == null ? '' : value).trim();
        if (!raw) return [];
        return raw.split(/\r?\n/).map(function (line) {
            return String(line || '').trim();
        }).filter(function (line) {
            return line !== '';
        }).map(function (line) {
            var candidate = line;
            var schemeEnd = candidate.indexOf('://');
            if (schemeEnd >= 0) candidate = candidate.slice(schemeEnd + 3);
            var pathStart = candidate.indexOf('/');
            if (pathStart >= 0) candidate = candidate.slice(0, pathStart);

            if (/^\d+$/.test(candidate)) {
                return {raw: line, host: '', port: candidate};
            }

            var host = '';
            var port = '';
            if (candidate.charAt(0) === '[') {
                var bracketEnd = candidate.indexOf(']');
                if (bracketEnd > 0) {
                    host = candidate.slice(0, bracketEnd + 1);
                    if (candidate.charAt(bracketEnd + 1) === ':') port = candidate.slice(bracketEnd + 2);
                }
            } else {
                var colon = candidate.lastIndexOf(':');
                if (colon > 0 && /^\d+$/.test(candidate.slice(colon + 1))) {
                    host = candidate.slice(0, colon);
                    port = candidate.slice(colon + 1);
                }
            }
            return {
                raw: line,
                host: host || (port ? '' : candidate),
                port: port
            };
        });
    }

    function tunnelTargetMarkup(value) {
        var items = tunnelTargetItems(value);
        if (!items.length) return '-';
        return '<div class="tunnel-target-list">' + items.map(function (item) {
            var lines = '';
            if (item.host) lines += '<span class="tunnel-target-host">' + tunnelText(item.host) + '</span>';
            if (item.port) lines += '<span class="tunnel-target-port">' + tunnelText(item.port) + '</span>';
            return '<span class="tunnel-target-entry" title="' + tunnelText(item.raw) + '">' + lines + '</span>';
        }).join('') + '</div>';
    }

    function tunnelAccessAddressMarkup(row) {
        var port = Number(row.Port);
        if (!isFinite(port) || Math.floor(port) !== port || port <= 0) return '-';
        var publicHost = String("{{.ip}}" || '').trim();
        if (publicHost.indexOf(':') >= 0 && publicHost.charAt(0) !== '[') publicHost = '[' + publicHost + ']';
        var address = publicHost + ':' + port;
        var safeAddress = tunnelText(address);
        var english = npsIsEnglish();
        var copyTitleZH = '复制访问地址';
        var copyTitleEN = 'Copy access address';
        var httpTitleZH = '尝试使用 HTTP 打开；浏览器可能因 HSTS 或 HTTPS 优先策略升级为 HTTPS';
        var httpTitleEN = 'Try opening over HTTP; the browser may upgrade to HTTPS because of HSTS or HTTPS-First';
        var actions = '<button type="button" class="copy tunnel-access-action tunnel-access-action--copy"'
            + ' data-clipboard-text="' + safeAddress + '"'
            + ' title="' + tunnelText(english ? copyTitleEN : copyTitleZH) + '"'
            + ' data-title-zh="' + tunnelText(copyTitleZH) + '" data-title-en="' + tunnelText(copyTitleEN) + '"'
            + ' aria-label="' + tunnelText(english ? copyTitleEN : copyTitleZH) + '"'
            + ' data-aria-label-zh="' + tunnelText(copyTitleZH) + '" data-aria-label-en="' + tunnelText(copyTitleEN) + '">'
            + '<i class="fa fa-copy" aria-hidden="true"></i><span data-i18n-zh="复制" data-i18n-en="Copy">' + (english ? 'Copy' : '复制') + '</span></button>';
        if (String(row.Mode || tunnelListMode) === 'tcp') {
            actions += '<a class="tunnel-access-action tunnel-access-action--http" href="http://' + safeAddress + '" target="_blank" rel="noopener noreferrer"'
                + ' title="' + tunnelText(english ? httpTitleEN : httpTitleZH) + '"'
                + ' data-title-zh="' + tunnelText(httpTitleZH) + '" data-title-en="' + tunnelText(httpTitleEN) + '"'
                + ' aria-label="' + tunnelText(english ? httpTitleEN : httpTitleZH) + '"'
                + ' data-aria-label-zh="' + tunnelText(httpTitleZH) + '" data-aria-label-en="' + tunnelText(httpTitleEN) + '">'
                + '<i class="fa fa-external-link-alt" aria-hidden="true"></i><span>HTTP</span></a>';
        }
        return '<div class="tunnel-access-cell"><code class="tunnel-access-address" title="' + safeAddress + '">' + safeAddress + '</code>'
            + '<div class="tunnel-access-actions">' + actions + '</div></div>';
    }

    // Keep the table focused on fields that belong to the selected tunnel
    // mode.  The detail row remains the source for secondary values, so the
    // desktop table does not grow wider just because a mode has a different
    // connection model.
    var tunnelListModeColumns = {
        tcp:       {port: true,  address: true,  target: true,  password: false, currentconnections: false},
        udp:       {port: true,  address: true,  target: true,  password: false, currentconnections: false},
        httpProxy: {port: true,  address: true,  target: false, password: false, currentconnections: false},
        socks5:    {port: true,  address: true,  target: false, password: false, currentconnections: false},
        mixProxy:  {port: true,  address: true,  target: false, password: false, currentconnections: false},
        file:      {port: true,  address: true,  target: false, password: false, currentconnections: false},
        secret:    {port: false, address: false, target: true,  password: true, currentconnections: false},
        p2p:       {port: false, address: false, target: true,  password: true, currentconnections: false}
    };
    var tunnelListColumns = tunnelListModeColumns[tunnelListMode] || {
        port: true,
        address: true,
        target: true,
        password: true
    };
    function tunnelListColumnVisible(name, secondary) {
        if (tunnelListColumns[name] === false) return false;
        return !secondary || !tunnelListCompact;
    }

    function tunnelStatusChip(labelZh, labelEn, active, valueZh, valueEn) {
        var english = npsIsEnglish();
        var value = english ? valueEn : valueZh;
        var title = (english ? labelEn + ': ' : labelZh + '：') + value;
        return '<span class="tunnel-status-chip ' + (active ? 'is-open' : 'is-closed') + '"'
            + ' title="' + npsEscapeHtml(title) + '"'
            + ' data-title-zh="' + labelZh + '：' + valueZh + '"'
            + ' data-title-en="' + labelEn + ': ' + valueEn + '">'
            + '<span class="tunnel-status-chip__value" data-i18n-zh="' + valueZh + '" data-i18n-en="' + valueEn + '">' + npsEscapeHtml(value) + '</span></span>';
    }

    function tunnelStatusSummary(row) {
        var clientOnline = !!(row && row.Client && row.Client.IsConnect);
        var configOpen = !!(row && row.Status);
        var listenOpen = !!(row && row.RunStatus);
        return '<div class="tunnel-status-summary" aria-label="配置、监听、客户端状态">'
            + tunnelStatusChip('配置状态', 'Config', configOpen, configOpen ? '开放' : '关闭', configOpen ? 'Open' : 'Closed')
            + tunnelStatusChip('监听状态', 'Listener', listenOpen, listenOpen ? '开放' : '关闭', listenOpen ? 'Open' : 'Closed')
            + tunnelStatusChip('客户端状态', 'Client', clientOnline, clientOnline ? '在线' : '离线', clientOnline ? 'Online' : 'Offline')
            + '</div>';
    }

    /* Remote table backed by server-side pagination and search. */
    $('#table').npsTable({
        toolbar: "#toolbar",
        method: 'post', // 服务器数据的请求方式 get or post
        url: "{{.web_base_url}}/index/gettunnel", // 服务器数据的加载地址
        queryParams: function (params) {
            return {
                "offset": params.offset,
                "limit": params.limit,
                "type": tunnelListMode,
                "client_id": tunnelListClientId,
                "search": params.search,
                "sort": params.sort,
                "order": params.order
            }
        },
        search: true,
        contentType: "application/x-www-form-urlencoded",
        striped: true, // 设置为true会有隔行变色效果
        showHeader: true,
        showColumns: true,
        showRefresh: true,
        pagination: true,//分页
        sidePagination: 'server',//服务器端分页
        pageNumber: 1,
        pageList: [5, 10, 20, 50],//分页步进值
        storageKey: 'tunnel-' + tunnelListMode + '-v2',
        detailView: true,
        smartDisplay: true, // 智能显示 pagination 和 cardview 等
        formatLoadingMessage: function () { return npsTableState('tunnel', true); },
        formatNoMatches: function () { return npsTableState('tunnel', false); },
        onExpandRow: function () {
            $('body').setLang('.detail-view');
            npsDecorateDetailControls('#table');
        },
        onCollapseRow: function () { window.setTimeout(function () { npsDecorateDetailControls('#table'); }, 0); },
        onLoadSuccess:function (data) {$('body').setLang ('.detail-view');},
        onPostBody: function (data) {
            $('body').setLang('#table');
            npsApplyTableState(this, 'tunnel');
        },
        detailFormatter: function (index, row, element) {
            var english = npsIsEnglish();
            var flow = row.Flow || {};
            var client = row.Client || {};
            var config = client.Cnf || {};
            var target = row.Target || {};
            var text = function (value, fallback) {
                if (value == null || value === '') value = fallback == null ? '' : fallback;
                return npsEscapeHtml(value);
            };
            var label = function (zh, en) {
                return '<span data-i18n-zh="' + zh + '" data-i18n-en="' + en + '">' + (english ? en : zh) + '</span>';
            };
            var kv = function (labelText, value) {
                return '<div class="tunnel-detail__item"><span class="tunnel-detail__label">' + labelText + '</span><span class="tunnel-detail__value">' + value + '</span></div>';
            };
            var codeValue = function (labelText, value) {
                return '<div class="tunnel-detail__item tunnel-detail__item--wide"><span class="tunnel-detail__label">' + labelText + '</span><code class="tunnel-detail__code">' + text(value || '-') + '</code></div>';
            };
            var chips = function (labelText, value) {
                var items = Array.isArray(value) ? value : [];
                var content = items.length
                    ? items.map(function (item) { return '<span class="tunnel-detail__chip">' + text(item) + '</span>'; }).join('')
                    : '<span class="tunnel-detail__chip tunnel-detail__chip--empty">-</span>';
                return '<div class="tunnel-detail__chips"><span class="tunnel-detail__label">' + labelText + '</span><div class="tunnel-detail__chip-list">' + content + '</div></div>';
            };
            var card = function (icon, title, content) {
                return '<section class="tunnel-detail__card"><h6 class="tunnel-detail__section-title"><i class="fa fa-' + icon + '" aria-hidden="true"></i>' + title + '</h6><div class="tunnel-detail__grid">' + content + '</div></section>';
            };
            var section = function (icon, title, content) {
                return '<section class="tunnel-detail__section"><h6 class="tunnel-detail__section-title"><i class="fa fa-' + icon + '" aria-hidden="true"></i>' + title + '</h6><div class="tunnel-detail__grid">' + content + '</div></section>';
            };
            var cmdRow = function (labelText, code) {
                return '<div class="tunnel-detail__command">'
                    + '<span class="tunnel-detail__command-label">' + labelText + '</span>'
                    + '<code>' + text(code) + '</code>'
                    + '<button type="button" class="copy btn btn-outline btn-primary btn-xs tunnel-detail__copy" onclick="copyCommand(this)" data-clipboard-text="" data-title-zh="复制命令" data-title-en="Copy command" data-aria-label-zh="复制命令" data-aria-label-en="Copy command"><i class="fa fa-copy" aria-hidden="true"></i></button></div>';
            };
            // The identification key is only part of secret/p2p tunnel
            // credentials. Keep it out of the expanded detail for modes that
            // never consume it (tcp, udp, http proxy, socks5, and file).
            var identificationMarkup = (row.Mode === 'secret' || row.Mode === 'p2p')
                ? kv(label('识别密钥', 'Identification key'), text(row.Password || '-'))
                : '';
            var isProxyMode = row.Mode === 'mixProxy' || row.Mode === 'httpProxy' || row.Mode === 'socks5';
            var destAclMode = row.DestAclMode === 1 ? (english ? 'Allowlist' : '白名单') : (row.DestAclMode === 2 ? (english ? 'Denylist' : '黑名单') : (english ? 'Disabled' : '关闭'));
            var healthSummary = '';
            if (row.Mode === 'tcp' && (row.HealthCheckType || row.HealthCheckTarget)) {
                healthSummary = (row.HealthCheckType === 'http' ? 'HTTP' : 'TCP')
                    + (row.HealthCheckTarget ? ' · ' + String(row.HealthCheckTarget).replace(/\r?\n/g, ', ') : '')
                    + (row.HealthCheckInterval ? ' · ' + row.HealthCheckInterval + (english ? 's' : ' 秒') : '');
            }
            var basicCard = card('info-circle', label('基本信息', 'Basic information'),
                kv(label('备注', 'Remark'), text(row.Remark || '-'))
                + kv(label('验证密钥', 'Verify key'), text(client.VerifyKey || '-'))
                + identificationMarkup
                + kv(label('协议版本', 'Protocol version'), text(row.ProtoVersion || '-'))
                + kv(label('运行状态', 'Run status'), npsBooleanMarkup(!!row.RunStatus))
                + kv(label('客户端状态', 'Client status'), text(client.IsConnect ? (english ? 'Online' : '在线') : (english ? 'Offline' : '离线'))));
            var trafficCard = card('tachometer-alt', label('连接与流量', 'Connections & traffic'),
                kv(label('出口流量', 'Export flow'), text(changeunit(flow.ExportFlow)))
                + kv(label('入口流量', 'Inlet flow'), text(changeunit(flow.InletFlow)))
                + kv(label('上行限速 / 当前', 'Upload limit / current'), text(String(row.UploadLimit || 0) + ' KB/s / ' + changeunit(row.UploadRate || 0) + '/s'))
                + kv(label('下行限速 / 当前', 'Download limit / current'), text(String(row.DownloadLimit || 0) + ' KB/s / ' + changeunit(row.DownloadRate || 0) + '/s'))
                + (row.Mode === 'tcp' ? kv(label('当前连接', 'Current connections'), text(row.CurrentConnections || 0)) : '')
                + kv(label('隧道最大连接', 'Tunnel max connections'), text((row.MaxConn || 0) > 0 ? row.MaxConn : (english ? 'Unlimited' : '不限')))
                + kv(label('客户端连接限额', 'Client connection limit'), text(client.MaxConn > 0 ? client.MaxConn : (english ? 'Unlimited' : '不限')))
                + kv(label('流量限额', 'Flow limit'), text((flow.FlowLimit || 0) > 0 ? changeunit(flow.FlowLimit) : (english ? 'Unlimited' : '不限'))));
            var authCard = card('shield-alt', label('认证与安全', 'Authentication & security'),
                kv(label('加密', 'Encryption'), npsBooleanMarkup(!!config.Crypt))
                + kv(label('压缩', 'Compression'), npsBooleanMarkup(!!config.Compress))
                + kv(label('Basic 认证用户名', 'Basic username'), text(config.U || '-'))
                + kv(label('Basic 认证密码', 'Basic password'), text(config.P ? (english ? 'Set' : '已设置') : (english ? 'Not set' : '未设置')))
                + kv(label('仅允许已登记 IP', 'Registered IPs only'), npsBooleanMarkup(!!row.RegisteredOnly))
                + kv(label('名单冲突策略', 'List policy'), text(row.IpListPriority === 1 ? (english ? 'Allow first' : '白名单优先') : (english ? 'Deny first' : '黑名单优先')))
                + (((row.BlackIpList || []).length || (row.WhiteIpList || []).length) ? chips(label('来源名单', 'Source lists'), (row.BlackIpList || []).concat(row.WhiteIpList || [])) : ''));
            var modeCard = card('sliders-h', label('模式与监听', 'Mode & listener'),
                kv(label('监听地址', 'Listen address'), text(row.ServerIp || '0.0.0.0'))
                + ((row.Mode === 'tcp' || row.Mode === 'udp') ? kv(label('本地代理', 'Local proxy'), npsBooleanMarkup(!!target.LocalProxy)) : '')
                + codeValue(label('内网目标', 'Internal target'), target.TargetStr || '-')
                + (isProxyMode ? kv(label('HTTP 代理', 'HTTP proxy'), npsBooleanMarkup(row.Mode === 'httpProxy' || !!row.HttpProxy)) : '')
                + (isProxyMode ? kv(label('SOCKS5 代理', 'SOCKS5 proxy'), npsBooleanMarkup(row.Mode === 'socks5' || !!row.Socks5Proxy)) : '')
                + (isProxyMode ? kv(label('目标访问控制', 'Destination ACL'), text(destAclMode)) : '')
                + (isProxyMode && row.DestAclRules ? codeValue(label('目标访问控制规则', 'Destination ACL rules'), row.DestAclRules) : '')
                + (healthSummary ? codeValue(label('健康检查', 'Health check'), healthSummary) : ''));
            var commands = '';
            if (row.Mode === 'p2p') {
                commands = section('terminal', label('访问命令', 'Access commands'),
                    cmdRow(label('P2P 目标访问', 'P2P target access'), '{{.win}} -server={{.ip}}:{{.p}} -vkey=' + (client.VerifyKey || '') + ' -type={{.bridgeType}} -password=' + (row.Password || '') + ' -target=' + (target.TargetStr || ''))
                    + cmdRow(label('P2P 服务端', 'P2P server'), '{{.win}} -server={{.ip}}:{{.p}} -vkey=' + (client.VerifyKey || '') + ' -type={{.bridgeType}} -password=' + (row.Password || '') + ' -local_type=p2ps')
                    + cmdRow(label('P2P 客户端', 'P2P client'), '{{.win}} -server={{.ip}}:{{.p}} -vkey=' + (client.VerifyKey || '') + ' -type={{.bridgeType}} -password=' + (row.Password || '') + ' -local_type=p2pt')
                    {{if .tls_enable}}
                    + cmdRow(label('P2P 目标访问 (TLS)', 'P2P target access (TLS)'), '{{.win}} -server={{.ip}}:{{.tls_p}} -vkey=' + (client.VerifyKey || '') + ' -type={{.bridgeType}} -password=' + (row.Password || '') + ' -target=' + (target.TargetStr || '') + ' -tls_enable=true')
                    + cmdRow(label('P2P 服务端 (TLS)', 'P2P server (TLS)'), '{{.win}} -server={{.ip}}:{{.tls_p}} -vkey=' + (client.VerifyKey || '') + ' -type={{.bridgeType}} -password=' + (row.Password || '') + ' -local_type=p2ps -tls_enable=true')
                    + cmdRow(label('P2P 客户端 (TLS)', 'P2P client (TLS)'), '{{.win}} -server={{.ip}}:{{.tls_p}} -vkey=' + (client.VerifyKey || '') + ' -type={{.bridgeType}} -password=' + (row.Password || '') + ' -local_type=p2pt -tls_enable=true')
                    {{end}}
                );
            } else if (row.Mode === 'secret') {
                commands = section('terminal', label('访问命令', 'Access commands'),
                    cmdRow(label('私密访问', 'Secret access'), '{{.win}} -server={{.ip}}:{{.p}} -vkey=' + (client.VerifyKey || '') + ' -type={{.bridgeType}} -password=' + (row.Password || '') + ' -local_type=secret')
                    {{if .tls_enable}}
                    + cmdRow(label('私密访问 (TLS)', 'Secret access (TLS)'), '{{.win}} -server={{.ip}}:{{.tls_p}} -vkey=' + (client.VerifyKey || '') + ' -type={{.bridgeType}} -password=' + (row.Password || '') + ' -local_type=secret -tls_enable=true')
                    {{end}}
                );
            }
            var errorSection = row.RunError ? section('exclamation-triangle', label('运行错误', 'Run error'), kv(label('错误信息', 'Error'), text(row.RunError))) : '';
            return commands
                + '<div class="tunnel-detail__cards">' + basicCard + trafficCard + authCard + modeCard + '</div>'
                + errorSection;
        },
        //表格的列
        columns: [
            {
                checkbox: true,
                align: 'center',
                valign: 'middle'
            },
            {
                field: 'Id',//域值
                title: '<span langtag="word-id"></span>',//标题
                halign: 'center',
                class: 'tunnel-list__id',
                width: '56px',
                visible: true,//false表示不显示
                sortable: true,//启用排序
            },
            {
                field: 'ClientId',//域值
                title: '<span langtag="word-clientid"></span>',//标题
                halign: 'center',
                visible: true,//false表示不显示
                sortable: true, //启用排序
                formatter: function (value, row, index) {
                    var client = row.Client || {};
                    return tunnelText((client.Id == null ? '' : client.Id) + '-' + (client.Remark || ''));
                }
            },
            {
                field: 'Remark',//域值
                title: '<span langtag="word-remark"></span>',//标题
                halign: 'center',
                sortable: true,
                visible: tunnelListColumnVisible('remark', true),//false表示不显示
                escape: true
            },
            {
                field: 'Client.VerifyKey',//域值
                title: '<span langtag="word-verifykey"></span>',//标题
                halign: 'center',
                sortable: true, //启用排序
                // The verify key remains available in the expanded detail and
                // column picker, but is hidden from the default dense view.
                visible: false,//false表示不显示
                escape: true
            },
            {
                field: 'Mode',//域值
                title: '<span langtag="word-scheme"></span>',//标题
                halign: 'center',
                sortable: true,
                visible: true,//false表示不显示
                formatter: function (value, row, index) {
                    var scheme = (value === 'httpProxy' || value === 'socks5') ? 'mixProxy' : String(value || '').replace(/[^A-Za-z0-9_-]/g, '');
                    return '<span langtag="scheme-' + scheme + '"></span>'
                }
            },
            {
                field: 'Port',//域值
                title: '<span langtag="word-port"></span>',//标题
                halign: 'center',
                sortable: true, //启用排序
                visible: tunnelListColumnVisible('port')//false表示不显示
            },
            {
                field: 'address',//域值
                title: '<span langtag="word-accessaddress"></span>',//标题
                halign: 'center',
                class: 'tunnel-list__address',
                sortable: false, //计算列，按 Port 排序即可
                visible: tunnelListColumnVisible('address'),//false表示不显示
                formatter: function (value, row) {
                    return tunnelAccessAddressMarkup(row);
                }
            },
            {
                field: 'Target',//域值
                title: '<span langtag="word-target"></span>',//标题
                halign: 'center',
                class: 'tunnel-list__target',
                visible: tunnelListColumnVisible('target'),//false表示不显示
                sortable: true, //启用排序
                formatter: function (value, row) {
                    return tunnelTargetMarkup((row.Target || {}).TargetStr);
                }
            },
            {
                field: 'Password',//域值
                title: '<span langtag="word-identificationkey"></span>',//标题
                halign: 'center',
                sortable: true,
                visible: tunnelListColumnVisible('password', true),//false表示不显示
                escape: true
            },
            {
                field: 'statusSummary',
                title: '<span data-i18n-zh="配置 | 监听 | 客户端" data-i18n-en="Config | Listener | Client">配置 | 监听 | 客户端</span>',
                align: 'center',
                halign: 'center',
                class: 'tunnel-list__status',
                visible: true,
                sortable: false,
                formatter: function (value, row) {
                    return tunnelStatusSummary(row);
                }
            },
            {
                field: 'CurrentConnections',
                title: '<span langtag="word-currentconnections"></span>',
                align: 'center',
                halign: 'center',
                visible: tunnelListColumnVisible('currentconnections', true),
                sortable: true,
                formatter: function (value) {
                    return tunnelText(value || 0);
                }
            },
            {
                field: 'option',//域值
                title: '<span langtag="word-option"></span>',//内容
                align: 'center',
                halign: 'center',
                class: 'tunnel-list__actions',
                width: '228px',
                visible: true,//false表示不显示
                formatter: function (value, row, index) {
                    var tunnelId = Number(row.Id);
                    if (!isFinite(tunnelId) || Math.floor(tunnelId) !== tunnelId || tunnelId <= 0) return '';
                    var btn_group = '<div class="btn-group tunnel-actions">'
                    btn_group += '<button type="button" onclick="npsOpenTrafficDebug(\'tunnel\',' + tunnelId + ')" class="btn btn-outline btn-info" data-title-zh="实时请求调试" data-title-en="Live request inspector" data-aria-label-zh="实时请求调试" data-aria-label-en="Live request inspector"><i class="fa fa-terminal" aria-hidden="true"></i></button>'
                    if (row.Status) {
                        btn_group += "<button type=\"button\" onclick=\"submitform('stop', '{{.web_base_url}}/index/stop', {'id':" + tunnelId
                        btn_group += '})" class="btn btn-outline btn-warning" data-title-zh="停止隧道" data-title-en="Stop tunnel" data-aria-label-zh="停止隧道" data-aria-label-en="Stop tunnel"><i class="fa fa-pause" aria-hidden="true"></i></button>'
                    } else {
                        btn_group += "<button type=\"button\" onclick=\"submitform('start', '{{.web_base_url}}/index/start', {\'id\':" + tunnelId
                        btn_group += '})" class="btn btn-outline btn-primary" data-title-zh="启动隧道" data-title-en="Start tunnel" data-aria-label-zh="启动隧道" data-aria-label-en="Start tunnel"><i class="fa fa-play" aria-hidden="true"></i></button>'
                    }
                    btn_group += "<button type=\"button\" onclick=\"submitform('delete', '{{.web_base_url}}/index/del', {'id':" + tunnelId
                    btn_group += '})" class="btn btn-outline btn-danger" data-title-zh="删除隧道" data-title-en="Delete tunnel" data-aria-label-zh="删除隧道" data-aria-label-en="Delete tunnel"><i class="fa fa-trash" aria-hidden="true"></i></button>'

                    btn_group += '<a href="{{.web_base_url}}/index/edit?id=' + tunnelId
                    btn_group += '" class="btn btn-outline btn-success" data-title-zh="编辑隧道" data-title-en="Edit tunnel" data-aria-label-zh="编辑隧道" data-aria-label-en="Edit tunnel"><i class="fa fa-edit" aria-hidden="true"></i></a>'

                    btn_group += "<button type=\"button\" onclick=\"submitform('copy', '{{.web_base_url}}/index/copy', {'id':" + tunnelId
                    btn_group += '})" class="btn btn-outline btn-primary" data-title-zh="复制隧道" data-title-en="Copy tunnel" data-aria-label-zh="复制隧道" data-aria-label-en="Copy tunnel"><i class="fa fa-copy" aria-hidden="true"></i></button></div>'
                    return btn_group
                }
            }
        ]
    });

    function copyCommand(data) {
        data.setAttribute("data-clipboard-text", data.previousElementSibling ? data.previousElementSibling.textContent : '')
    }

    var clipboard = new ClipboardJS('.copy');
    clipboard.on('success', function (e) {
        npsNotify('success', npsIsEnglish() ? 'Copied' : '复制成功');
        e.clearSelection();
    });
    clipboard.on('error', function (e) {
        npsNotify('error', npsIsEnglish() ? 'Copy failed' : '复制失败');
    });
</script>
