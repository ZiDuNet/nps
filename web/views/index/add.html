<div class="row tile">
    <div class="col-md-12 col-md-auto">
        <div class="ibox float-e-margins">
            <h3 class="ibox-title" langtag="page-add"></h3>
            <div class="ibox-content">
                <form class="form-horizontal">
                    <div class="form-section-title"><i class="fa fa-cog"></i> 隧道类型</div>
                    <div class="form-group">
                        <label class="col-sm-2 control-label font-bold" langtag="word-scheme"></label>
                        <div class="col-sm-10">
                            <span class="help-block m-b-none font-bold" langtag="word-usecase"></span>:
                            <span id="usecase">
                                <span id="casetcp" langtag="info-casetcp"></span>
                                <span id="caseudp" langtag="info-caseudp"></span>
                                <span id="casehttpProxy" langtag="info-casehttpproxy"></span>
                                <span id="casesocks5" langtag="info-casesocks5"></span>
                                <span id="casesecret" langtag="info-casesecret"></span>
                                <span id="casep2p" langtag="info-casep2p"></span>
                                <span id="casefile" langtag="info-casefile"></span>
                            </span>
                            <select class="form-control" name="type" id="type">
                                <option value="tcp" langtag="scheme-tcp"></option>
                                <option value="udp" langtag="scheme-udp"></option>
                                <option value="httpProxy" langtag="scheme-httpProxy"></option>
                                <option value="socks5" langtag="scheme-socks5"></option>
                                <option value="secret" langtag="scheme-secret"></option>
                                <option value="p2p" langtag="scheme-p2p"></option>
                            </select>
                        </div>
                    </div>

                    <div class="form-section-title"><i class="fa fa-link"></i> 基础配置</div>
                    <div class="form-group" id="client_id">
                        <label class="col-sm-2 control-label font-bold" langtag="word-clientid"></label>
                        <div class="col-sm-10">
                            <select class="form-control" name="client_id" placeholder="" id="nps_client_id"
                                    langtag="word-belongclient"></select>
                        </div>
                    </div>
                    <div class="form-group" id="remark_group">
                        <label class="col-sm-2 control-label font-bold" langtag="word-remark"></label>
                        <div class="col-sm-10">
                            <input class="form-control" type="text" name="remark" placeholder=""
                                   langtag="info-unrestricted" required>
                        </div>
                    </div>
                    {{if eq true .allow_multi_ip}}
                    <div class="form-group" id="server_ip">
                        <label class="col-sm-2 control-label font-bold" langtag="word-serverip"></label>
                        <div class="col-sm-10">
                            <input class="form-control" type="text" value="0.0.0.0" name="server_ip" placeholder=""
                                   langtag="info-suchasip">
                        </div>
                    </div>
                    {{end}}
                    <div class="form-group" id="port">
                        <label class="col-sm-2 control-label font-bold" langtag="word-serverport"></label>
                        <div class="col-sm-10">
                            <input class="form-control" type="text" name="port" placeholder=""
                                   langtag="info-suchasport">
                        </div>
                    </div>
                    {{if eq true .allow_local_proxy}}
                    <div class="form-group" id="local_proxy">
                        <label class="col-sm-2 control-label font-bold" langtag="word-proxytolocal"></label>
                        <div class="col-sm-10">
                            <div class="toggle-field">
                                <input type="hidden" name="local_proxy" value="0">
                                <label class="toggle-switch"><input type="checkbox"><span class="toggle-slider"></span></label>
                                <span class="toggle-label">否</span>
                            </div>
                        </div>
                    </div>
                    {{end}}

                    <div class="form-section-title"><i class="fa fa-bullseye"></i> 目标配置</div>
                    <div class="form-group" id="target">
                        <label class="col-sm-2 control-label font-bold" langtag="word-target"></label>
                        <div class="col-sm-10">
                            <textarea class="form-control" name="target" rows="4" placeholder=""
                                      langtag="info-suchasiplist"></textarea>
                            <span class="help-block m-b-none" langtag="info-targettunnel"></span>
                        </div>
                    </div>
                    <div class="form-group" id="local_path">
                        <label class="col-sm-2 control-label font-bold" langtag="word-localpath"></label>
                        <div class="col-sm-10">
                            <input class="form-control" type="text" name="local_path" placeholder=""
                                   langtag="info-suchaslocalpath">
                        </div>
                    </div>
                    <div class="form-group" id="strip_pre">
                        <label class="col-sm-2 control-label font-bold" langtag="word-stripprefix"></label>
                        <div class="col-sm-10">
                            <input class="form-control" type="text" name="strip_pre" placeholder=""
                                   langtag="info-suchasstripprefix">
                        </div>
                    </div>

                    <div class="form-section-title"><i class="fa fa-lock"></i> 安全配置</div>
                    <div class="form-group" id="password">
                        <label class="col-sm-2 control-label font-bold" langtag="word-identificationkey"></label>
                        <div class="col-sm-10">
                            <input class="form-control" type="text" name="password" placeholder=""
                                   langtag="word-identificationkey">
                            <span class="help-block m-b-none" langtag="info-identificationkey"></span>
                        </div>
                    </div>
                    <div class="form-group" id="proto_version">
                        <label class="col-sm-2 control-label font-bold">Proxy Protocol</label>
                        <div class="col-sm-10">
                            <select class="form-control" name="proto_version">
                                <option value="">关闭</option>
                                <option value="V1">V1</option>
                                <option value="V2">V2</option>
                            </select>
                            <span class="help-block m-b-none">开启此功能，请确保本地的服务能够支持 Proxy Protocol 协议。</span>
                        </div>
                    </div>

                    <div class="hr-line-dashed"></div>
                    <div class="form-group">
                        <div class="col-sm-4 col-sm-offset-2">
                            <button class="btn btn-success" type="button"
                                    onclick="submitform('add', '{{.web_base_url}}/index/add', $('form').serializeArray())">
                                <i class="fa fa-fw fa-lg fa-check-circle"></i> <span langtag="word-add"></span>
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
<script>
    var arr = []
    arr["all"] = ["port", "target", "password", "local_path", "strip_pre", "local_proxy", "client_id", "server_ip"]
    arr["tcp"] = ["port", "target", "local_proxy", "client_id", "server_ip", "proto_version"]
    arr["udp"] = ["port", "target", "local_proxy", "client_id", "server_ip"]
    arr["socks5"] = ["port", "client_id", "server_ip"]
    arr["httpProxy"] = ["port", "client_id", "server_ip"]
    arr["secret"] = ["target", "password", "client_id", "server_ip"]
    arr["p2p"] = ["target", "password", "client_id", "server_ip"]
    arr["file"] = ["port", "local_path", "strip_pre", "client_id", "server_ip"]

    function resetForm() {
        $(".form-group[id]").css("display", "none");
        $("#usecase span").css("display", "none");
        o = $("#type").val();
        $('#case' + o).css("display", "inline")
        for (var i = 0; i < arr[o].length; i++) {
            $("#" + arr[o][i]).css("display", "block")
        }
        // 始终显示备注
        $("#remark_group").css("display", "block");
    }

    $(function () {
        $("#type").val(('{{.type}}' == '') ? 'tcp' : '{{.type}}');
        resetForm()
        $("#type").on("change", function () {
            resetForm()
        })

        // Toggle labels
        $('.toggle-switch input[type="checkbox"]').on('change', function() {
            $(this).closest('.toggle-field').find('.toggle-label').text(this.checked ? '是' : '否');
        });

        getClientList()
    })

    function getClientList() {
        $("select[name='client_id']").empty();
        $.ajax({
            type: "POST",
            url: "{{.web_base_url}}/client/list",
            data: {order: "asc", offset: 0, limit: 999},
            dataType: "json",
            success: function (data) {
                if (data && data.rows.length > 0) {
                    for (var i = 0; i < data.rows.length; i++) {
                        var option = "<option value=\"" + data.rows[i].Id + "\"";
                        option += ">" + data.rows[i].Id + '-' + data.rows[i].Remark + "</option>";
                        $("select[name='client_id']").append(option);
                        $("select[name='client_id']").find("option[value='{{.client_id}}']").attr("selected", true);
                    }
                }
            }
        });
    }
</script>
