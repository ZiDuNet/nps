<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>NPS 内网穿透 · 用户大屏</title>
    <link rel="stylesheet" href="{{.web_base_url}}/static/css/nps-overview.css?v={{.version}}">
</head>
<body data-base-url="{{.web_base_url}}" data-account-name="{{.overview_account_name}}">
<div class="wrap">
    <header class="top">
        <a class="brand" href="{{.web_base_url}}/" aria-label="返回 NPS 控制台">
            <img class="logo" src="{{.web_base_url}}/static/img/nps-logo.png" width="38" height="38" alt="NPS">
            <span>
                <h1>NPS 内网穿透 <em>用户大屏</em></h1>
                <p>我的客户端 → 我的隧道 · 个人资源总览</p>
            </span>
        </a>
        <div class="top-status" id="topStatus" aria-live="polite">实时读取中</div>
        <div class="clock">
            <b id="clock">--:--:--</b>
            <span id="dateStr"></span>
        </div>
    </header>

    <section class="card map" aria-labelledby="mapTitle">
        <div class="acct" id="acct" aria-live="polite"></div>
        <div class="hd">
            <h2 id="mapTitle">我的资源拓扑<span class="hint" id="who"></span></h2>
            <div class="tools">
                <label class="search">
                    <span class="sr-only">搜索资源</span>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
                    <input id="q" placeholder="搜索 备注 / IP / 端口 / 域名…" autocomplete="off">
                </label>
                <label class="chk"><input type="checkbox" id="onlyOnline"> 仅显示在线</label>
                <label class="refresh-control" for="refreshSeconds"><span>刷新</span><input id="refreshSeconds" type="number" min="5" max="3600" step="1" inputmode="numeric" aria-label="刷新间隔（秒）"><span>秒</span></label>
                <div class="seg" id="segTunnels" aria-label="隧道展开控制">
                    <button data-mode="all" class="on" type="button">全部隧道</button>
                    <button data-mode="off" type="button">收起隧道</button>
                </div>
            </div>
        </div>
        <div class="map-body" id="mapBody">
            <div class="cols" id="cols"><svg class="links" id="links" aria-hidden="true"></svg></div>
        </div>
        <div class="legend" id="legend"></div>
    </section>
</div>

<div class="modal-mask" id="modalMask" hidden>
    <section class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle">
        <div class="modal-head">
            <span class="mode" id="mMode">TCP</span>
            <h3 id="mTitle">资源详情</h3>
            <button class="modal-close" id="mClose" type="button" aria-label="关闭详情">×</button>
        </div>
        <div class="modal-body" id="mBody"></div>
    </section>
</div>

<p id="liveStatus" class="sr-only" role="status" aria-live="polite"></p>
<script src="{{.web_base_url}}/static/js/nps-overview.js?v={{.version}}"></script>
</body>
</html>
