<style>
    .tunnel-form .form-group[id] {
        display: none !important;
    }

    .tunnel-form #remark_group,
    .tunnel-form.tunnel-type-tcp #port,
    .tunnel-form.tunnel-type-tcp #target,
    .tunnel-form.tunnel-type-tcp #local_proxy,
    .tunnel-form.tunnel-type-tcp #client_id,
    .tunnel-form.tunnel-type-tcp #proto_version,
    .tunnel-form.tunnel-type-udp #port,
    .tunnel-form.tunnel-type-udp #target,
    .tunnel-form.tunnel-type-udp #local_proxy,
    .tunnel-form.tunnel-type-udp #client_id,
    .tunnel-form.tunnel-type-httpProxy #port,
    .tunnel-form.tunnel-type-httpProxy #client_id,
    .tunnel-form.tunnel-type-socks5 #port,
    .tunnel-form.tunnel-type-socks5 #client_id,
    .tunnel-form.tunnel-type-secret #target,
    .tunnel-form.tunnel-type-secret #password,
    .tunnel-form.tunnel-type-secret #client_id,
    .tunnel-form.tunnel-type-p2p #target,
    .tunnel-form.tunnel-type-p2p #password,
    .tunnel-form.tunnel-type-p2p #client_id,
    .tunnel-form.tunnel-type-file #port,
    .tunnel-form.tunnel-type-file #local_path,
    .tunnel-form.tunnel-type-file #strip_pre,
    .tunnel-form.tunnel-type-file #client_id {
        display: var(--tunnel-field-display, flex) !important;
    }

    .tunnel-form #usecase span {
        display: none !important;
    }

    .tunnel-form.tunnel-type-tcp #casetcp,
    .tunnel-form.tunnel-type-udp #caseudp,
    .tunnel-form.tunnel-type-httpProxy #casehttpProxy,
    .tunnel-form.tunnel-type-socks5 #casesocks5,
    .tunnel-form.tunnel-type-secret #casesecret,
    .tunnel-form.tunnel-type-p2p #casep2p,
    .tunnel-form.tunnel-type-file #casefile {
        display: inline !important;
    }
</style>
<section class="form-page form-page-tunnel form-page-edit" aria-labelledby="tunnel-form-title">
    <header class="dashboard-page-header form-page-header">
        <div class="form-page-heading">
            <div class="dashboard-page-kicker" data-i18n-zh="隧道管理" data-i18n-en="Tunnel management">隧道管理</div>
            <h1 id="tunnel-form-title" langtag="page-edit"></h1>
            <p data-i18n-zh="更新隧道参数前，请确认监听端口和目标服务均可用。" data-i18n-en="Confirm that the listening port and target service are available before updating this tunnel.">更新隧道参数前，请确认监听端口和目标服务均可用。</p>
        </div>
        <div class="dashboard-page-actions form-page-actions">
            <a class="btn btn-outline btn-primary form-page-back" href="{{.web_base_url}}/index/{{if eq .t.Mode "httpProxy"}}http{{else}}{{.t.Mode}}{{end}}">
                <i class="fa fa-arrow-left" aria-hidden="true"></i>
                <span data-i18n-zh="返回列表" data-i18n-en="Back to list">返回列表</span>
            </a>
        </div>
    </header>
    <div class="row form-page-grid tunnel-form tunnel-type-{{.t.Mode}}">
    <div class="col-md-12 col-md-auto">
        <div class="ibox float-e-margins form-workflow-card">
            <div class="ibox-content form-workflow-content">
                <form class="form-horizontal form-workflow-form" data-form-workflow="tunnel-edit">
                    <input type="hidden" name="id" value="{{.t.Id}}">

                    <div class="form-section-title"><i class="fa fa-cog" aria-hidden="true"></i><span data-i18n-zh="隧道类型" data-i18n-en="Tunnel type">隧道类型</span></div>
                    <div class="form-group">
                        <label class="col-sm-2 control-label font-bold" langtag="word-scheme"></label>
                        <div class="col-sm-10">
                            <span class="help-block m-b-none font-bold" langtag="word-usecase"></span>:
                            <span id="usecase">
                                <span id="casetcp" langtag="info-casetcp"></span>
                                <span id="caseudp" langtag="info-caseudp"></span>
                                <span id="casehttpProxy" langtag="info-casehttpproxy"></span>
                                <span id="casesocks5" langtag="info-casesocks5"></span>
                                <span id="casesecret" langtag="info-casesecret"></span>
                                <span id="casep2p" langtag="info-casep2p"></span>
                                <span id="casefile" langtag="info-casefile"></span>
                            </span>
                            <select class="form-control" name="type" id="type">
                                <option value="tcp" langtag="scheme-tcp"></option>
                                <option value="udp" langtag="scheme-udp"></option>
                                <option value="httpProxy" langtag="scheme-httpProxy"></option>
                                <option value="socks5" langtag="scheme-socks5"></option>
                                <option value="secret" langtag="scheme-secret"></option>
                                <option value="p2p" langtag="scheme-p2p"></option>
                                <option value="file" langtag="scheme-file"></option>
                            </select>
                        </div>
                    </div>

                    <div class="form-section-title"><i class="fa fa-link" aria-hidden="true"></i><span data-i18n-zh="基础配置" data-i18n-en="Connection">基础配置</span></div>
                    <div class="form-group" id="client_id">
                        <label class="col-sm-2 control-label font-bold" langtag="word-clientid"></label>
                        <div class="col-sm-10">
                            <input value="{{.t.Client.Id}}" class="form-control" type="text"
                                   name="client_id" placeholder="" langtag="word-clientid">
                        </div>
                    </div>
                    <div class="form-group" id="remark_group">
                        <label class="col-sm-2 control-label font-bold" langtag="word-remark"></label>
                        <div class="col-sm-10">
                            <input value="{{.t.Remark}}" class="form-control" type="text" name="remark" placeholder=""
                                   langtag="info-unrestricted" required>
                        </div>
                    </div>
                    {{if eq true .allow_multi_ip}}
                    <div class="form-group" id="server_ip">
                        <label class="col-sm-2 control-label font-bold" langtag="word-serverip"></label>
                        <div class="col-sm-10">
                            <input class="form-control" type="text" value="{{.t.ServerIp}}" name="server_ip"
                                   placeholder="" langtag="info-suchasip">
                        </div>
                    </div>
                    {{end}}
                    <div class="form-group" id="port">
                        <label class="col-sm-2 control-label font-bold" langtag="word-serverport"></label>
                        <div class="col-sm-10">
                            <input value="{{.t.Port}}" class="form-control" type="text" name="port" placeholder=""
                                   langtag="info-suchasport">
                        </div>
                    </div>
                    {{if eq true .allow_local_proxy}}
                    <div class="form-group" id="local_proxy">
                        <label class="control-label col-sm-2 font-bold" langtag="word-proxytolocal"></label>
                        <div class="col-sm-10">
                            <div class="toggle-field">
                                <input type="hidden" name="local_proxy" value="{{if eq true .t.Target.LocalProxy}}1{{else}}0{{end}}">
                                <label class="toggle-switch"><input type="checkbox" {{if eq true .t.Target.LocalProxy}}checked{{end}}><span class="toggle-slider"></span></label>
                                <span class="toggle-label" data-toggle-state="{{if eq true .t.Target.LocalProxy}}yes{{else}}no{{end}}">{{if eq true .t.Target.LocalProxy}}是{{else}}否{{end}}</span>
                            </div>
                        </div>
                    </div>
                    {{end}}

                    <div class="form-section-title"><i class="fa fa-bullseye" aria-hidden="true"></i><span data-i18n-zh="目标配置" data-i18n-en="Target">目标配置</span></div>
                    <div class="form-group" id="target">
                        <label class="col-sm-2 control-label font-bold" langtag="word-target"></label>
                        <div class="col-sm-10">
                            <textarea class="form-control" name="target" rows="4" placeholder=""
                                      langtag="info-suchasiplist">{{.t.Target.TargetStr}}</textarea>
                            <span class="help-block m-b-none" langtag="info-targettunnel"></span>
                        </div>
                    </div>
                    <div class="form-group" id="local_path">
                        <label class="col-sm-2 control-label font-bold" langtag="word-localpath"></label>
                        <div class="col-sm-10">
                            <input value="{{.t.LocalPath}}" class="form-control" type="text" name="local_path"
                                   placeholder="" langtag="info-suchaslocalpath">
                        </div>
                    </div>
                    <div class="form-group" id="strip_pre">
                        <label class="col-sm-2 control-label font-bold" langtag="word-stripprefix"></label>
                        <div class="col-sm-10">
                            <input value="{{.t.StripPre}}" class="form-control" type="text" name="strip_pre"
                                   placeholder="" langtag="info-suchasstripprefix">
                        </div>
                    </div>

                    <div class="form-section-title"><i class="fa fa-lock" aria-hidden="true"></i><span data-i18n-zh="安全配置" data-i18n-en="Security">安全配置</span></div>
                    <div class="form-group" id="password">
                        <label class="col-sm-2 control-label font-bold" langtag="word-identificationkey"></label>
                        <div class="col-sm-10">
                            <input value="{{.t.Password}}" class="form-control" type="text" name="password"
                                   placeholder="" langtag="word-identificationkey">
                            <span class="help-block m-b-none" langtag="info-identificationkey"></span>
                        </div>
                    </div>
                    <div class="form-group" id="proto_version">
                        <label class="control-label col-sm-2 font-bold" data-i18n-zh="Proxy Protocol" data-i18n-en="Proxy Protocol">Proxy Protocol</label>
                        <div class="col-sm-10">
                            <select class="form-control" name="proto_version" id="ProtoVersion">
                                <option value="" data-i18n-zh="关闭" data-i18n-en="Disabled">关闭</option>
                                <option value="V1">V1</option>
                                <option value="V2">V2</option>
                            </select>
                            <span class="help-block m-b-none" data-i18n-zh="开启此功能，请确保本地的服务能够支持 Proxy Protocol 协议。" data-i18n-en="Enable this only when the local service supports Proxy Protocol.">开启此功能，请确保本地的服务能够支持 Proxy Protocol 协议。</span>
                        </div>
                    </div>

                    <div class="hr-line-dashed form-workflow-divider"></div>
                    <div class="form-group form-workflow-actions">
                        <div class="col-sm-4 col-sm-offset-2">
                            <button class="btn btn-success" type="button"
                                    onclick="submitform('edit', '{{.web_base_url}}/index/edit', $('form').serializeArray())">
                                <i class="fa fa-fw fa-lg fa-check-circle"></i> <span langtag="word-save"></span>
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
</section>
<script>
    var fieldMap = {
        tcp: ["client_id", "port", "target", "local_proxy", "proto_version"],
        udp: ["client_id", "port", "target", "local_proxy"],
        socks5: ["client_id", "port"],
        httpProxy: ["client_id", "port"],
        secret: ["client_id", "target", "password"],
        p2p: ["client_id", "target", "password"],
        file: ["client_id", "port", "local_path", "strip_pre"]
    };
    var tunnelTypeClasses = "tunnel-type-tcp tunnel-type-udp tunnel-type-httpProxy tunnel-type-socks5 tunnel-type-secret tunnel-type-p2p tunnel-type-file";

    function applyTypeClass(type) {
        $(".tunnel-form").removeClass(tunnelTypeClasses).addClass("tunnel-type-" + type);
    }

    function resetForm() {
        var type = $("#type").val() || "tcp";
        if (!fieldMap[type]) {
            type = "tcp";
        }
        applyTypeClass(type);
    }

    $(function () {
        $("#type").val('{{.t.Mode}}');
        $("#ProtoVersion").val('{{.t.ProtoVersion}}');
        resetForm()
        $("#type").on("change", function () {
            resetForm()
        })

        $('.toggle-switch input[type="checkbox"]').on('change', function() {
            npsSetToggleLabel($(this).closest('.toggle-field').find('.toggle-label'), this.checked);
        });
    })
</script>
