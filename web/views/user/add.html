<section class="form-page form-page-user form-page-create" aria-labelledby="user-form-title">
    <header class="dashboard-page-header form-page-header">
        <div class="form-page-heading">
            <div class="dashboard-page-kicker" data-i18n-zh="访问控制" data-i18n-en="Access control">访问控制</div>
            <h1 id="user-form-title" data-i18n-zh="新增用户" data-i18n-en="New user">新增用户</h1>
            <p data-i18n-zh="创建可分配资源配额的独立管理账号。" data-i18n-en="Create an independent dashboard account with resource limits.">创建可分配资源配额的独立管理账号。</p>
        </div>
        <div class="dashboard-page-actions form-page-actions">
            <a class="btn btn-outline btn-primary form-page-back" href="{{.web_base_url}}/user/list"><i class="fa fa-arrow-left"></i><span data-i18n-zh="返回列表" data-i18n-en="Back to list">返回列表</span></a>
        </div>
    </header>
    <div class="form-page-grid">
    <div class="form-page-column">
        <section class="panel ibox float-e-margins form-workflow-card zui-panel">
            <div class="ibox-content form-workflow-content">
                <form id="user-form" class="form form-horz form-workflow-form zui-form" data-form-workflow="user-create" autocomplete="off">
                    <div class="form-section-title"><i class="fa fa-user" aria-hidden="true"></i><span data-i18n-zh="基本信息" data-i18n-en="Basic information">基本信息</span></div>
                    <div class="form-group">
                        <label class="form-label font-bold" for="user-username" data-i18n-zh="用户名" data-i18n-en="Username">用户名</label>
                        <div class="form-group-wrapper">
                            <input id="user-username" class="form-control" type="text" name="username" autocomplete="off" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label font-bold" for="user-password" data-i18n-zh="密码" data-i18n-en="Password">密码</label>
                        <div class="form-group-wrapper">
                            <div class="input-group">
                                <input id="user-password" class="form-control" type="password" name="password" autocomplete="new-password" spellcheck="false" required aria-describedby="user-password-hint" data-placeholder-zh="请输入密码" data-placeholder-en="Enter a password" placeholder="请输入密码">
                                <span class="input-group-btn">
                                    <button class="btn btn-default user-password-toggle" type="button" data-password-target="user-password" aria-controls="user-password" aria-label="显示密码" data-aria-label-zh="显示密码" data-aria-label-en="Show password" aria-pressed="false" title="显示密码" data-title-zh="显示密码" data-title-en="Show password"><i class="fa fa-eye" aria-hidden="true"></i></button>
                                </span>
                            </div>
                            <span id="user-password-hint" class="help-block" data-i18n-zh="密码仅在提交时传送，不会在用户列表中显示。" data-i18n-en="The password is sent only when submitted and is never shown in the user list.">密码仅在提交时传送，不会在用户列表中显示。</span>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label font-bold" for="user-remark" data-i18n-zh="备注" data-i18n-en="Remark">备注</label>
                        <div class="form-group-wrapper">
                            <input id="user-remark" class="form-control" type="text" name="remark" autocomplete="off">
                        </div>
                    </div>

                    <div class="form-section-title"><i class="fa fa-sliders-h" aria-hidden="true"></i><span data-i18n-zh="资源限制" data-i18n-en="Resource limits">资源限制</span></div>
                    <div class="form-group">
                        <label class="form-label font-bold" for="user-max-client" data-i18n-zh="最大客户端数" data-i18n-en="Client limit">最大客户端数</label>
                        <div class="form-group-wrapper">
                            <input id="user-max-client" class="form-control" type="number" min="0" step="1" name="max_client" inputmode="numeric" data-placeholder-zh="不填或 0 表示不限" data-placeholder-en="Blank or 0 means unlimited" placeholder="不填或 0 表示不限" aria-describedby="user-max-client-hint">
                            <span id="user-max-client-hint" class="help-block" data-i18n-zh="限制该用户可拥有的客户端数量；管理员分配和用户自建都会占用此配额。" data-i18n-en="Limits the clients this user can own. Both admin assignments and self-created clients consume it.">限制该用户可拥有的客户端数量；管理员分配和用户自建都会占用此配额。</span>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label font-bold" for="user-max-tunnel" data-i18n-zh="总隧道上限" data-i18n-en="Tunnel limit">总隧道上限</label>
                        <div class="form-group-wrapper">
                            <input id="user-max-tunnel" class="form-control" type="number" min="0" step="1" name="max_tunnel" inputmode="numeric" data-placeholder-zh="不填或 0 表示不限" data-placeholder-en="Blank or 0 means unlimited" placeholder="不填或 0 表示不限" aria-describedby="user-max-tunnel-hint">
                            <span id="user-max-tunnel-hint" class="help-block" data-i18n-zh="所有名下客户端共享此上限，普通隧道和域名规则都会计入。" data-i18n-en="All owned clients share this limit. Both tunnels and host rules count toward it.">所有名下客户端共享此上限，普通隧道和域名规则都会计入。</span>
                        </div>
                    </div>

                    <div class="form-section-title"><i class="fa fa-clock" aria-hidden="true"></i><span data-i18n-zh="有效期" data-i18n-en="Expiration">有效期</span></div>
                    <div class="form-group">
                        <label class="form-label font-bold" for="date-picker-user-expire-picker" data-i18n-zh="有效期" data-i18n-en="Expiration">有效期</label>
                        <div class="form-group-wrapper">
                            <div id="user-expire-time-picker" class="nps-datetime-picker" aria-describedby="user-expire-time-hint"></div>
                            <span id="user-expire-time-hint" class="help-block" data-i18n-zh="留空表示长期有效。" data-i18n-en="Leave blank for no expiration.">留空表示长期有效。</span>
                        </div>
                    </div>

                    <div class="hr-line-dashed form-workflow-divider"></div>
                    <div class="form-group form-workflow-actions">
                        <div class="form-actions">
                            <button class="btn btn-success" type="submit"><i class="fa fa-fw fa-lg fa-check-circle" aria-hidden="true"></i> <span data-i18n-zh="新增用户" data-i18n-en="Create user">新增用户</span></button>
                            <a class="btn btn-default" href="{{.web_base_url}}/user/list" data-i18n-zh="取消" data-i18n-en="Cancel">取消</a>
                        </div>
                    </div>
                </form>
            </div>
        </section>
    </div>
</div>
</section>

<script>
$(document).ready(function() {
    bindUserPasswordToggle();

    $('#user-form').on('submit', function(event) {
        event.preventDefault();
        submitform('add', '{{.web_base_url}}/user/add', $(this).serializeArray());
    });

    initUserExpirePicker();

    function ensureUserExpireFallback(host, value) {
        if (!host || host.querySelector('input[name="expire_time"]')) return;
        var fallback = document.createElement('input');
        fallback.id = 'user-expire-picker-fallback';
        fallback.className = 'form-control';
        fallback.type = 'text';
        fallback.name = 'expire_time';
        fallback.value = value || '';
        fallback.autocomplete = 'off';
        fallback.placeholder = 'YYYY-MM-DD HH:MM';
        host.appendChild(fallback);
    }

    function initUserExpirePicker() {
        var host = document.getElementById('user-expire-time-picker');
        if (!host) return;
        if (!window.zui || !zui.DatetimePicker) {
            ensureUserExpireFallback(host, '');
            return;
        }
        if (typeof zui.DatetimePicker.get === 'function' && zui.DatetimePicker.get(host)) return;
        try {
            zui.DatetimePicker.ensure(host, {
                id: 'user-expire-picker',
                name: 'expire_time',
                defaultValue: '',
                format: 'yyyy-MM-dd hh:mm',
                minDate: 'today',
                minuteStep: 5,
                required: false,
                placeholder: npsIsEnglish() ? 'Select expiration date and time' : '请选择到期时间',
                icon: true
            });
            if (!host.querySelector('input[name="expire_time"]')) ensureUserExpireFallback(host, '');
        } catch (error) {
            ensureUserExpireFallback(host, '');
        }
    }

    function bindUserPasswordToggle() {
        $('.user-password-toggle').on('click', function() {
            var input = document.getElementById($(this).data('password-target'));
            if (!input) return;
            var visible = input.type === 'password';
            input.type = visible ? 'text' : 'password';
            var english = typeof npsIsEnglish === 'function' && npsIsEnglish();
            var label = visible ? (english ? 'Hide password' : '隐藏密码') : (english ? 'Show password' : '显示密码');
            $(this).attr('aria-pressed', visible ? 'true' : 'false')
                .attr('aria-label', label)
                .attr('title', label)
                .find('i').toggleClass('fa-eye fa-eye-slash');
        });
    }
});
</script>
