<section class="wrapper wrapper-content animated fadeInRight management-page management-page--user" aria-labelledby="user-list-title">
    <header class="dashboard-page-header management-page-header">
        <div>
            <div class="dashboard-page-kicker" data-i18n-zh="访问控制" data-i18n-en="Access control">访问控制</div>
            <h1 id="user-list-title" data-i18n-zh="用户管理" data-i18n-en="User management">用户管理</h1>
            <p data-i18n-zh="维护面板账号、资源配额和可用状态；资源统计与配额口径保持一致。" data-i18n-en="Maintain dashboard accounts, resource limits, and availability with quota-aligned resource counts.">维护面板账号、资源配额和可用状态；资源统计与配额口径保持一致。</p>
        </div>
    </header>
    <div class="management-page-grid">
        <div class="management-page-column">
            <section class="panel ibox float-e-margins management-table-card nps-panel">
                <div class="ibox-content management-table-content">
                    <div id="toolbar" class="management-table-toolbar">
                        <a href="{{.web_base_url}}/user/add" class="btn btn-primary dim">
                            <i class="fa fa-fw fa-lg fa-plus"></i> <span data-i18n-zh="新增用户" data-i18n-en="New user">新增用户</span>
                        </a>
                    </div>
                    <table id="table"></table>
                </div>
            </section>
        </div>
    </div>
</section>

<div id="user-api-token-modal" class="modal fade" tabindex="-1" role="dialog" aria-modal="true" aria-labelledby="user-api-token-title" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered" role="document">
        <div class="modal-content nps-password-modal">
            <div class="modal-header">
                <div>
                    <div class="nps-modal-kicker" data-i18n-zh="系统接入" data-i18n-en="System integration">系统接入</div>
                    <h2 id="user-api-token-title" class="modal-title" data-i18n-zh="用户 API Token" data-i18n-en="User API token">用户 API Token</h2>
                </div>
                <button type="button" class="nps-modal-close" data-bs-dismiss="modal" aria-label="关闭" data-aria-label-zh="关闭" data-aria-label-en="Close"><i class="fa fa-times" aria-hidden="true"></i><span class="sr-only" data-i18n-zh="关闭" data-i18n-en="Close">关闭</span></button>
            </div>
            <div class="modal-body">
                <p class="nps-password-modal__account"><span data-i18n-zh="用户" data-i18n-en="User">用户</span><strong id="user-api-token-account">-</strong></p>
                <p class="help-block" data-i18n-zh="Token 会加密保存在服务端，管理员可以随时再次查看。重新生成会使旧 Token 立即失效；撤销后调用方将无法通过该 Token 认证。" data-i18n-en="The token is encrypted at rest and administrators can view it again at any time. Rotating it invalidates the previous token immediately; revoking it stops API authentication with this token.">Token 会加密保存在服务端，管理员可以随时再次查看。重新生成会使旧 Token 立即失效；撤销后调用方将无法通过该 Token 认证。</p>
                <div class="form-group">
                    <label class="form-label" for="user-api-token-value" data-i18n-zh="Token" data-i18n-en="Token">Token</label>
                    <div class="input-group">
                        <input id="user-api-token-value" class="form-control" type="text" readonly autocomplete="off" spellcheck="false">
                        <button id="user-api-token-copy" type="button" class="btn btn-outline btn-primary" title="复制 Token" data-title-zh="复制 Token" data-title-en="Copy token" aria-label="复制 Token" data-aria-label-zh="复制 Token" data-aria-label-en="Copy token"><i class="fa fa-copy" aria-hidden="true"></i></button>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline" data-bs-dismiss="modal" data-i18n-zh="关闭" data-i18n-en="Close">关闭</button>
            </div>
        </div>
    </div>
</div>

<script>
    $('#table').npsTable({
        toolbar: "#toolbar",
        method: 'post',
        url: "{{.web_base_url}}/user/list",
        contentType: "application/x-www-form-urlencoded",
        striped: true,
        search: true,
        showHeader: true,
        showColumns: true,
        showRefresh: true,
        pagination: true,
        sidePagination: 'server',
        pageNumber: 1,
        pageList: [5, 10, 20, 50],
        storageKey: 'user',
        detailView: true,
        smartDisplay: true,
        formatLoadingMessage: function () { return npsTableState('user', true); },
        formatNoMatches: function () { return npsTableState('user', false); },
        onExpandRow: function () {
            $('body').setLang('.detail-view');
            npsDecorateDetailControls('#table');
        },
        onCollapseRow: function () { window.setTimeout(function () { npsDecorateDetailControls('#table'); }, 0); },
        onPostBody: function () {
            $('body').setLang('#table');
            npsApplyTableState(this, 'user');
        },
        detailFormatter: function (index, row) {
            var english = npsIsEnglish();
            var text = function (value, fallback) {
                if (value == null || value === '') value = fallback == null ? '' : fallback;
                return npsEscapeHtml(value);
            };
            var quota = function (used, limit) {
                var limited = Number(limit) > 0;
                return text(Number(used) || 0) + ' / ' + text(limited ? limit : (english ? 'Unlimited' : '不限'));
            };
            var rateLimit = function (value) {
                return Number(value) > 0 ? text(value + ' KB/s') : text(english ? 'Unlimited' : '不限');
            };
            var limitOnly = function (value) {
                return text(Number(value) > 0 ? value : (english ? 'Unlimited' : '不限'));
            };
            var statusBadge = row.Status
                ? '<span class="badge badge-primary">' + (english ? 'Active' : '启用') + '</span>'
                : '<span class="badge badge-danger">' + (english ? 'Disabled' : '停用') + '</span>';
            var tokenBadge = row.APIKeyEnabled
                ? '<span class="badge badge-primary">' + (english ? 'Enabled' : '已启用') + '</span>'
                : '<span class="badge badge-default">' + (english ? 'Not set' : '未配置') + '</span>';
            return '<div class="user-detail-summary">'
                + '<div><b data-i18n-zh="用户名" data-i18n-en="Username"></b><span>' + text(row.UserName, '-') + '</span></div>'
                + '<div><b data-i18n-zh="邮箱" data-i18n-en="Email"></b><span>' + text(row.Email, '-') + '</span></div>'
                + '<div><b data-i18n-zh="备注" data-i18n-en="Remark"></b><span>' + text(row.Remark, '-') + '</span></div>'
                + '<div><b data-i18n-zh="创建时间" data-i18n-en="Created"></b><span>' + text(row.CreateTime, '-') + '</span></div>'
                + '<div><b data-i18n-zh="有效期" data-i18n-en="Expiration"></b><span>' + text(row.ExpireTime, english ? 'Unlimited' : '永不过期') + '</span></div>'
                + '<div><b data-i18n-zh="客户端配额（已用 / 上限）" data-i18n-en="Clients (used / limit)"></b><span>' + quota(row.ClientCount, row.MaxClientNum) + '</span></div>'
                + '<div><b data-i18n-zh="隧道配额（已用 / 上限）" data-i18n-en="Tunnels (used / limit)"></b><span>' + quota(row.TunnelCount, row.MaxTunnelNum) + '</span></div>'
                + '<div><b data-i18n-zh="最大并发连接数" data-i18n-en="Maximum concurrent connections"></b><span>' + limitOnly(row.MaxConn) + '</span></div>'
                + '<div><b data-i18n-zh="上行带宽" data-i18n-en="Upload bandwidth"></b><span>' + rateLimit(row.UploadLimit) + '</span></div>'
                + '<div><b data-i18n-zh="下行带宽" data-i18n-en="Download bandwidth"></b><span>' + rateLimit(row.DownloadLimit) + '</span></div>'
                + '<div data-live-user-id="' + Number(row.Id) + '"><b data-i18n-zh="实时共享连接" data-i18n-en="Live shared connections"></b><span class="live-connections" data-live-user-connections>' + text(row.Connections, 0) + ' / ' + limitOnly(row.MaxConn) + '</span></div>'
                + '<div data-live-user-id="' + Number(row.Id) + '"><b data-i18n-zh="实时共享带宽" data-i18n-en="Live shared bandwidth"></b><span class="user-live-metrics"><span class="user-live-metrics__direction">↑</span><span class="user-live-metrics__value" data-live-user-up>' + changeunit(Number(row.UploadRate) || 0) + '/s</span><span class="user-live-metrics__direction">↓</span><span class="user-live-metrics__value" data-live-user-down>' + changeunit(Number(row.DownloadRate) || 0) + '/s</span></span></div>'
                + '<div><b data-i18n-zh="状态" data-i18n-en="Status"></b><span>' + statusBadge + '</span></div>'
                + '<div><b data-i18n-zh="API Token" data-i18n-en="API token"></b><span>' + tokenBadge + '</span></div>'
                + '</div>';
        },
        columns: [
            { field: 'Id', title: 'ID', halign: 'center', class: 'user-list__id', width: '56px' },
            {
                field: 'UserName',
                title: '<span title="用户名与账号状态" data-i18n-zh="用户" data-i18n-en="User">用户</span>',
                align: 'left',
                halign: 'left',
                class: 'user-list__identity',
                width: '168px',
                formatter: function(value, row) {
                    var statusText = row.Status
                        ? (npsIsEnglish() ? 'Active' : '启用')
                        : (npsIsEnglish() ? 'Disabled' : '停用');
                    var userName = value || '-';
                    var remark = String(row.Remark || '').trim();
                    var remarkLine = remark && remark !== String(userName)
                        ? '<span class="user-identity-remark" title="' + userTableText(remark) + '">' + userTableText(remark) + '</span>'
                        : '';
                    return '<span class="user-identity-cell"><span class="user-identity-copy"><span class="user-identity-name" title="' + userTableText(userName) + '">' + userTableText(userName) + '</span>' + remarkLine + '</span><span class="user-status-dot' + (row.Status ? ' is-active' : '') + '" title="' + statusText + '" aria-label="' + statusText + '"></span></span>';
                }
            },
            { field: 'Email', title: '<span title="邮箱" data-i18n-zh="邮箱" data-i18n-en="Email">邮箱</span>', halign: 'center', class: 'user-list__email', visible: false, escape: true, formatter: function(value) { return userTableText(value || '-'); } },
            {
                field: 'ClientCount',
                title: '<span title="客户端配额（已用 / 上限）" data-i18n-zh="客户端" data-i18n-en="Clients">客户端</span>',
                align: 'center',
                halign: 'center',
                class: 'user-list__quota',
                width: '96px',
                formatter: function(value, row) {
                    return userTableText((Number(value) || 0) + ' / ' + (Number(row.MaxClientNum) > 0 ? row.MaxClientNum : userUnlimitedQuotaText()));
                }
            },
            {
                field: 'TunnelCount',
                title: '<span title="总隧道配额（已用 / 上限）" data-i18n-zh="隧道" data-i18n-en="Tunnels">隧道</span>',
                align: 'center',
                halign: 'center',
                class: 'user-list__quota',
                width: '96px',
                formatter: function(value, row) {
                    return userTableText((Number(value) || 0) + ' / ' + (Number(row.MaxTunnelNum) > 0 ? row.MaxTunnelNum : userUnlimitedQuotaText()));
                }
            },
            {
                field: 'MaxConn',
                title: '<span title="实时共享连接、实时共享带宽及配置上限" data-i18n-zh="实时连接 / 带宽" data-i18n-en="Live connections / bandwidth">实时连接 / 带宽</span>',
                halign: 'center',
                align: 'center',
                class: 'user-list__limits',
                width: '164px',
                formatter: function(value, row) {
                    var userId = Number(row.Id);
                    var connectionLimit = Number(value) > 0 ? Number(value) : '∞';
                    var uploadLimit = Number(row.UploadLimit) > 0 ? row.UploadLimit + ' KB/s' : (npsIsEnglish() ? 'Unlimited' : '不限');
                    var downloadLimit = Number(row.DownloadLimit) > 0 ? row.DownloadLimit + ' KB/s' : (npsIsEnglish() ? 'Unlimited' : '不限');
                    return '<div class="user-live-metrics" data-live-user-id="' + userId + '">'
                        + '<span class="live-connections" title="' + userTableText((npsIsEnglish() ? 'Shared connections: used / limit; limit ' : '共享连接：已用 / 上限；上限 ') + connectionLimit) + '" data-live-user-connections>' + userTableText(Number(row.Connections) || 0) + ' / ' + userTableText(connectionLimit) + '</span>'
                        + '<span class="user-live-metrics__direction" title="' + userTableText((npsIsEnglish() ? 'Upload: ' : '上行：') + uploadLimit) + '">↑</span><span class="user-live-metrics__value" data-live-user-up>' + changeunit(Number(row.UploadRate) || 0) + '/s</span>'
                        + '<span class="user-live-metrics__direction" title="' + userTableText((npsIsEnglish() ? 'Download: ' : '下行：') + downloadLimit) + '">↓</span><span class="user-live-metrics__value" data-live-user-down>' + changeunit(Number(row.DownloadRate) || 0) + '/s</span>'
                        + '</div>';
                }
            },
            { field: 'ExpireTime', title: '<span title="账号有效期" data-i18n-zh="有效期" data-i18n-en="Expiration">有效期</span>', halign: 'center', class: 'user-list__expiry', width: '96px', formatter: function(value) { return userTableText(value || userUnlimitedText()); } },
            {
                field: 'Status',
                title: '<span title="账号状态" data-i18n-zh="状态" data-i18n-en="Status">状态</span>',
                align: 'center',
                halign: 'center',
                class: 'user-list__status',
                width: '82px',
                visible: false,
                formatter: function(value) {
                    return value
                        ? '<span class="badge badge-primary">' + (npsIsEnglish() ? 'Active' : '启用') + '</span>'
                        : '<span class="badge badge-danger">' + (npsIsEnglish() ? 'Disabled' : '停用') + '</span>';
                }
            },
            {
                field: 'APIKeyEnabled',
                title: '<span title="用户 API Token 状态与操作" data-i18n-zh="API Token" data-i18n-en="API token">API Token</span>',
                align: 'center',
                halign: 'center',
                class: 'user-list__api',
                width: '104px',
                formatter: function(value, row) {
                    var userId = Number(row && row.Id);
                    if (!isFinite(userId) || Math.floor(userId) !== userId || userId <= 0) return '';
                    var actions = '<span class="user-token-actions user-token-actions--compact" title="' + (value ? (npsIsEnglish() ? 'API token enabled' : 'API Token 已启用') : (npsIsEnglish() ? 'API token not configured' : 'API Token 未配置')) + '">';
                    if (value) actions += '<button type="button" onclick="showUserAPIToken(' + userId + ', ' + npsJsonAttr(row.UserName) + ')" class="btn btn-outline btn-primary btn-xs" title="' + (npsIsEnglish() ? 'View API token' : '查看 API Token') + '" aria-label="' + (npsIsEnglish() ? 'View API token' : '查看 API Token') + '"><i class="fa fa-eye" aria-hidden="true"></i></button>';
                    actions += '<button type="button" onclick="regenerateUserAPIKey(' + userId + ', ' + npsJsonAttr(row.UserName) + ')" class="btn btn-outline btn-info btn-xs" title="' + (npsIsEnglish() ? 'Rotate API token' : (value ? '重新生成 API Token' : '生成 API Token')) + '" aria-label="' + (npsIsEnglish() ? 'Rotate API token' : (value ? '重新生成 API Token' : '生成 API Token')) + '"><i class="fa fa-key" aria-hidden="true"></i></button>';
                    if (value) actions += '<button type="button" onclick="revokeUserAPIKey(' + userId + ')" class="btn btn-outline btn-warning btn-xs" title="' + (npsIsEnglish() ? 'Revoke API token' : '撤销 API Token') + '" aria-label="' + (npsIsEnglish() ? 'Revoke API token' : '撤销 API Token') + '"><i class="fa fa-unlink" aria-hidden="true"></i></button>';
                    actions += '</span>';
                    return '<div class="user-token-cell">' + actions + '</div>';
                }
            },
            {
                field: 'option',
                title: '<span data-i18n-zh="操作" data-i18n-en="Actions">操作</span>',
                align: 'center',
                halign: 'center',
                class: 'user-list__actions',
                width: '112px',
                formatter: function(value, row) {
                    var userId = Number(row.Id);
                    if (!isFinite(userId) || Math.floor(userId) !== userId || userId <= 0) return '';
                    var btn = '<div class="btn-group user-actions">';
                    if (row.Status) {
                        btn += '<button type="button" onclick="submitform(\'stop\', \'{{.web_base_url}}/user/changestatus\', {\'id\':' + userId + ', \'status\': 0})" class="btn btn-outline btn-warning" title="' + (npsIsEnglish() ? 'Disable user' : '停用用户') + '" aria-label="' + (npsIsEnglish() ? 'Disable user' : '停用用户') + '"><i class="fa fa-pause" aria-hidden="true"></i></button>';
                    } else {
                        btn += '<button type="button" onclick="submitform(\'start\', \'{{.web_base_url}}/user/changestatus\', {\'id\':' + userId + ', \'status\': 1})" class="btn btn-outline btn-primary" title="' + (npsIsEnglish() ? 'Enable user' : '启用用户') + '" aria-label="' + (npsIsEnglish() ? 'Enable user' : '启用用户') + '"><i class="fa fa-play" aria-hidden="true"></i></button>';
                    }
                    btn += '<a href="{{.web_base_url}}/user/edit?id=' + userId + '" class="btn btn-outline btn-success" title="' + (npsIsEnglish() ? 'Edit user' : '编辑用户') + '" aria-label="' + (npsIsEnglish() ? 'Edit user' : '编辑用户') + '"><i class="fa fa-edit" aria-hidden="true"></i></a>';
                    btn += '<button type="button" onclick="submitform(\'delete\', \'{{.web_base_url}}/user/del\', {\'id\':' + userId + '})" class="btn btn-outline btn-danger" title="' + (npsIsEnglish() ? 'Delete user' : '删除用户') + '" aria-label="' + (npsIsEnglish() ? 'Delete user' : '删除用户') + '"><i class="fa fa-trash" aria-hidden="true"></i></button>';
                    btn += '</div>';
                    return btn;
                }
            }
        ]
    });

    function userTableText(value) {
        return $('<div>').text(value == null ? '' : String(value)).html();
    }

    function userUnlimitedText() {
        return npsIsEnglish() ? 'Unlimited' : '永不过期';
    }

    function userUnlimitedQuotaText() {
        return npsIsEnglish() ? 'Unlimited' : '不限';
    }

    function npsJsonAttr(value) {
        var text = value == null || value === '' ? '-' : String(value);
        return "'" + text
            .replace(/\\/g, '\\\\')
            .replace(/'/g, "\\'")
            .replace(/\r/g, '\\r')
            .replace(/\n/g, '\\n')
            .replace(/</g, '\\u003C') + "'";
    }

    function userAPITokenModal() {
        return window.bootstrap && window.bootstrap.Modal
            ? new window.bootstrap.Modal(document.getElementById('user-api-token-modal'))
            : null;
    }

    function fillUserAPITokenModal(userName, token) {
        $('#user-api-token-account').text(userName == null || userName === '' ? '-' : userName);
        $('#user-api-token-value').val(token || '');
        var modal = userAPITokenModal();
        if (modal) modal.show();
    }

    function showUserAPIToken(userId, userName) {
        $.get('{{.web_base_url}}/user/apikeystatus', { id: userId }, function (response) {
            if (!response || Number(response.status) !== 1) {
                npsNotify('error', response && response.msg ? response.msg : (npsIsEnglish() ? 'Failed to read the API token' : '读取 API Token 失败'));
                return;
            }
            if (response.token) {
                fillUserAPITokenModal(userName, response.token);
            } else {
                npsNotify('warning', npsIsEnglish()
                    ? 'This token was created by an older version and cannot be viewed again. Rotate it to generate a new one.'
                    : '该 Token 由旧版本创建，无法再次查看；请重新生成后再查看。');
            }
        }, 'json').fail(function () { npsNotify('error', npsRequestErrorMessage()); });
    }

    function regenerateUserAPIKey(userId, userName) {
        $.post('{{.web_base_url}}/user/regenerateapikey', { id: userId }, function (response) {
            if (!response || Number(response.status) !== 1) {
                npsNotify('error', response && response.msg ? response.msg : (npsIsEnglish() ? 'Failed to generate API token' : '生成 API Token 失败'));
                return;
            }
            var token = response.token || '';
            fillUserAPITokenModal(userName, token);
            $('#table').npsTable('refresh');
        }, 'json').fail(function () { npsNotify('error', npsRequestErrorMessage()); });
    }

    function revokeUserAPIKey(userId) {
        var message = npsIsEnglish()
            ? 'Revoking immediately stops API authentication with this token. Continue?'
            : '撤销后，调用方将立即无法使用该 Token 认证。确定继续吗？';
        npsConfirmDialog(message, { danger: true, confirmLabel: npsIsEnglish() ? 'Revoke' : '撤销' }).then(function (confirmed) {
            if (!confirmed) return;
            $.post('{{.web_base_url}}/user/revokeapikey', { id: userId }, function (response) {
                if (!response || Number(response.status) !== 1) {
                    npsNotify('error', response && response.msg ? response.msg : (npsIsEnglish() ? 'Failed to revoke API token' : '撤销 API Token 失败'));
                    return;
                }
                npsNotify('success', response.msg || (npsIsEnglish() ? 'API token revoked' : 'API Token 已撤销'));
                $('#table').npsTable('refresh');
            }, 'json').fail(function () { npsNotify('error', npsRequestErrorMessage()); });
        });
    }

    $('#user-api-token-copy').on('click', function () {
        npsCopyText($('#user-api-token-value').val(), npsIsEnglish() ? 'Token copied' : 'Token 已复制');
    });
</script>
