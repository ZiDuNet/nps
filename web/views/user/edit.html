<section class="form-page form-page-user form-page-edit" aria-labelledby="user-form-title">
    <header class="dashboard-page-header form-page-header">
        <div class="form-page-heading">
            <div class="dashboard-page-kicker" data-i18n-zh="访问控制" data-i18n-en="Access control">访问控制</div>
            <h1 id="user-form-title" data-i18n-zh="编辑用户" data-i18n-en="Edit user">编辑用户</h1>
            <p data-i18n-zh="更新账号权限、资源配额与可用状态。" data-i18n-en="Update account access, resource limits, and availability.">更新账号权限、资源配额与可用状态。</p>
        </div>
        <div class="dashboard-page-actions form-page-actions">
            <a class="btn btn-outline btn-primary form-page-back" href="{{.web_base_url}}/user/list"><i class="fa fa-arrow-left"></i><span data-i18n-zh="返回列表" data-i18n-en="Back to list">返回列表</span></a>
        </div>
    </header>
    <div class="form-page-grid">
    <div class="form-page-column">
        <section class="panel ibox float-e-margins form-workflow-card nps-panel">
            <div class="ibox-content form-workflow-content">
                <form id="user-form" class="form form-horz form-workflow-form nps-form" data-form-workflow="user-edit" autocomplete="off">
                    <input type="hidden" name="id" value="{{.u.Id}}">
                    <div class="form-section-title" data-section-tier="primary"><i class="fa fa-user" aria-hidden="true"></i><span data-i18n-zh="基本信息" data-i18n-en="Basic information">基本信息</span></div>
                    <div class="form-group">
                        <label class="form-label font-bold" for="user-username" data-i18n-zh="用户名" data-i18n-en="Username">用户名</label>
                        <div class="form-group-wrapper">
                            <input id="user-username" class="form-control" value="{{.u.UserName}}" type="text" name="username" autocomplete="off" required>
                            <span class="help-block" data-i18n-zh="用于登录管理面板的唯一用户名；修改后需要使用新用户名登录。" data-i18n-en="The unique username used to sign in to the management panel; use the new name after changing it.">用于登录管理面板的唯一用户名；修改后需要使用新用户名登录。</span>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label font-bold" for="user-password" data-i18n-zh="新密码" data-i18n-en="New password">新密码</label>
                        <div class="form-group-wrapper">
                            <div class="input-group">
                                <input id="user-password" class="form-control" type="password" name="password" autocomplete="new-password" spellcheck="false" data-placeholder-zh="留空则保持原密码" data-placeholder-en="Leave blank to keep the current password" placeholder="留空则保持原密码" aria-describedby="user-password-hint">
                                <span class="input-group-btn">
                                    <button class="btn btn-default user-password-toggle" type="button" data-password-target="user-password" aria-controls="user-password" aria-label="显示密码" data-aria-label-zh="显示密码" data-aria-label-en="Show password" aria-pressed="false" title="显示密码" data-title-zh="显示密码" data-title-en="Show password"><i class="fa fa-eye" aria-hidden="true"></i></button>
                                </span>
                            </div>
                            <span id="user-password-hint" class="help-block" data-i18n-zh="现有密码不会显示在页面中。只有填写新密码时才会更新。" data-i18n-en="The current password is never shown. It changes only when you enter a new one.">现有密码不会显示在页面中。只有填写新密码时才会更新。</span>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label font-bold" for="user-remark" data-i18n-zh="备注" data-i18n-en="Remark">备注</label>
                        <div class="form-group-wrapper">
                            <input id="user-remark" class="form-control" value="{{.u.Remark}}" type="text" name="remark" autocomplete="off">
                            <span class="help-block" data-i18n-zh="用于管理员识别账号的备注，不影响登录或权限。" data-i18n-en="An administrator-facing note for identifying the account; it does not affect login or permissions.">用于管理员识别账号的备注，不影响登录或权限。</span>
                        </div>
                    </div>

                    <div class="form-section-title" data-section-tier="advanced" data-section-summary-zh="为该用户设置资源配额" data-section-summary-en="Set quotas for this user"><i class="fa fa-sliders-h" aria-hidden="true"></i><span data-i18n-zh="资源限制" data-i18n-en="Resource limits">资源限制</span></div>
                    <div class="form-group">
                        <label class="form-label font-bold" for="user-max-client" data-i18n-zh="最大客户端数" data-i18n-en="Client limit">最大客户端数</label>
                        <div class="form-group-wrapper">
                            <input id="user-max-client" class="form-control" value="{{.u.MaxClientNum}}" type="number" min="0" step="1" name="max_client" inputmode="numeric" data-placeholder-zh="不填或 0 表示不限" data-placeholder-en="Blank or 0 means unlimited" placeholder="不填或 0 表示不限" aria-describedby="user-max-client-hint">
                            <span id="user-max-client-hint" class="help-block" data-i18n-zh="限制该用户可拥有的客户端数量；管理员分配和用户自建都会占用此配额。" data-i18n-en="Limits the clients this user can own. Both admin assignments and self-created clients consume it.">限制该用户可拥有的客户端数量；管理员分配和用户自建都会占用此配额。</span>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label font-bold" for="user-max-tunnel" data-i18n-zh="总隧道上限" data-i18n-en="Tunnel limit">总隧道上限</label>
                        <div class="form-group-wrapper">
                            <input id="user-max-tunnel" class="form-control" value="{{.u.MaxTunnelNum}}" type="number" min="0" step="1" name="max_tunnel" inputmode="numeric" data-placeholder-zh="不填或 0 表示不限" data-placeholder-en="Blank or 0 means unlimited" placeholder="不填或 0 表示不限" aria-describedby="user-max-tunnel-hint">
                            <span id="user-max-tunnel-hint" class="help-block" data-i18n-zh="所有名下客户端共享此上限，普通隧道和域名规则都会计入。" data-i18n-en="All owned clients share this limit. Both tunnels and host rules count toward it.">所有名下客户端共享此上限，普通隧道和域名规则都会计入。</span>
                        </div>
                    </div>

                    <div class="form-section-title" data-section-tier="advanced" data-section-summary-zh="用户到期后停止访问资源" data-section-summary-en="Stop access after user expiry"><i class="fa fa-clock" aria-hidden="true"></i><span data-i18n-zh="有效期" data-i18n-en="Expiration">有效期</span></div>
                    <div class="form-group">
                        <label class="form-label font-bold" for="user-expire-picker" data-i18n-zh="有效期" data-i18n-en="Expiration">有效期</label>
                        <div class="form-group-wrapper">
                            <div id="user-expire-time-picker" class="nps-datetime-picker" data-default-value="{{.u.ExpireTime}}" aria-describedby="user-expire-time-hint"></div>
                            <span id="user-expire-time-hint" class="help-block" data-i18n-zh="留空表示长期有效。" data-i18n-en="Leave blank for no expiration.">留空表示长期有效。</span>
                        </div>
                    </div>

                    <div class="hr-line-dashed form-workflow-divider"></div>
                    <div class="form-group form-workflow-actions">
                        <div class="form-actions">
                            <button class="btn btn-success" type="submit"><i class="fa fa-fw fa-lg fa-save" aria-hidden="true"></i> <span data-i18n-zh="保存修改" data-i18n-en="Save changes">保存修改</span></button>
                            <a class="btn btn-default" href="{{.web_base_url}}/user/list" data-i18n-zh="取消" data-i18n-en="Cancel">取消</a>
                        </div>
                    </div>
                </form>
            </div>
        </section>
    </div>
</div>
</section>

<script>
$(document).ready(function() {
    bindUserPasswordToggle();

    $('#user-form').on('submit', function(event) {
        event.preventDefault();
        submitform('edit', '{{.web_base_url}}/user/edit', $(this).serializeArray());
    });

    initUserExpirePicker();

    function initUserExpirePicker() {
        var host = document.getElementById('user-expire-time-picker');
        if (!host) return;
        if (host.querySelector('.nps-datetime-picker__control')) return;
        var defaultValue = host.getAttribute('data-default-value') || '';
        var english = typeof npsIsEnglish === 'function' && npsIsEnglish();
        var control = document.createElement('div');
        control.className = 'nps-datetime-picker__control';
        var input = document.createElement('input');
        input.id = 'user-expire-picker';
        input.className = 'form-control';
        input.type = 'text';
        input.name = 'expire_time';
        input.value = defaultValue;
        input.autocomplete = 'off';
        input.placeholder = 'YYYY-MM-DD HH:MM';
        input.setAttribute('data-input', '');
        var toggle = document.createElement('button');
        toggle.type = 'button';
        toggle.className = 'btn btn-outline nps-datetime-picker__toggle';
        toggle.setAttribute('data-toggle', '');
        toggle.setAttribute('aria-label', english ? 'Pick a date' : '选择日期');
        toggle.setAttribute('title', english ? 'Pick a date' : '选择日期');
        toggle.innerHTML = '<i class="fa fa-calendar-alt" aria-hidden="true"></i>';
        var clear = document.createElement('button');
        clear.type = 'button';
        clear.className = 'btn btn-outline nps-datetime-picker__clear';
        clear.setAttribute('data-clear', '');
        clear.setAttribute('aria-label', english ? 'Clear date' : '清除日期');
        clear.setAttribute('title', english ? 'Clear date' : '清除日期');
        clear.innerHTML = '<i class="fa fa-times" aria-hidden="true"></i>';
        control.appendChild(input);
        control.appendChild(toggle);
        control.appendChild(clear);
        host.appendChild(control);
        if (window.flatpickr) {
            window.flatpickr(control, {
                wrap: true,
                enableTime: true,
                dateFormat: 'Y-m-d H:i',
                time_24hr: true,
                minuteIncrement: 5,
                allowInput: true,
                disableMobile: true,
                locale: 'zh'
            });
        }
    }

    function bindUserPasswordToggle() {
        $('.user-password-toggle').on('click', function() {
            var input = document.getElementById($(this).data('password-target'));
            if (!input) return;
            var visible = input.type === 'password';
            input.type = visible ? 'text' : 'password';
            var english = typeof npsIsEnglish === 'function' && npsIsEnglish();
            var label = visible ? (english ? 'Hide password' : '隐藏密码') : (english ? 'Show password' : '显示密码');
            $(this).attr('aria-pressed', visible ? 'true' : 'false')
                .attr('aria-label', label)
                .attr('title', label)
                .find('i').toggleClass('fa-eye fa-eye-slash');
        });
    }
});
</script>
