<!DOCTYPE html>
<html>

<head>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title langtag="title-login"></title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23087c70'/%3E%3Cpath d='M15 40V24l17 12 17-12v16' fill='none' stroke='white' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">

    <link href="{{.web_base_url}}/static/css/fontawesome.min.css?v={{.version}}" rel="stylesheet">
    <link href="{{.web_base_url}}/static/css/solid.min.css?v={{.version}}" rel="stylesheet">
    <link href="{{.web_base_url}}/static/css/bootstrap.min.css?v={{.version}}" rel="stylesheet">
    <link href="{{.web_base_url}}/static/css/toastr.min.css?v={{.version}}" rel="stylesheet">
    <link href="{{.web_base_url}}/static/css/style.css?v={{.version}}" rel="stylesheet">
    <link href="{{.web_base_url}}/static/css/modern.css?v={{.version}}" rel="stylesheet">

    <script src="{{.web_base_url}}/static/js/jquery-3.4.1.min.js?v={{.version}}"></script>
    <script src="{{.web_base_url}}/static/js/popper.min.js?v={{.version}}"></script>
    <script src="{{.web_base_url}}/static/js/bootstrap.min.js?v={{.version}}"></script>
    <script src="{{.web_base_url}}/static/js/toastr.min.js?v={{.version}}"></script>
    <script src="{{.web_base_url}}/static/js/language.js?v={{.version}}" type="text/javascript"></script>

</head>

<body class="gray-bg">
<div class="login-page-bg">
    <!-- Particle canvas -->
    <canvas id="particle-canvas"></canvas>

    <div class="login-nav">
        <div class="login-logo">
            <span class="logo-text" langtag="application"></span>
            <span class="pro-badge">PRO</span>
        </div>
        <div style="display:flex;align-items:center;gap:10px;">
            <a href="#" onclick="toggleLoginTheme()" class="theme-toggle" id="theme-toggle" title="Toggle theme">
                <i class="fa fa-moon" id="theme-icon"></i>
            </a>
            <span class="btn-group dropdown">
                <button id="languagemenu" class="btn btn-primary dropdown-toggle" type="button" data-toggle="dropdown"
                        aria-haspopup="true" aria-expanded="false"><i class="fa fa-globe-asia fa-lg"></i><span></span></button>
                <ul class="dropdown-menu">
                    <li lang="zh-CN"><a href="#" onclick="return switchLanguage('zh-CN')">简体中文</a></li>
                    <li lang="en-US"><a href="#" onclick="return switchLanguage('en-US')">English</a></li>
                </ul>
            </span>
        </div>
    </div>

    <div class="login-container">
        <div class="login-card">
            <div class="login-features">
                <h3 langtag="info-tagline"></h3>
                <div class="feature-grid">
                    <div class="feature-card">
                        <i class="fa fa-network-wired feature-icon"></i>
                        <div class="feature-text" data-i18n-zh="多协议支持" data-i18n-en="Multi-protocol">多协议支持</div>
                    </div>
                    <div class="feature-card">
                        <i class="fa fa-desktop feature-icon"></i>
                        <div class="feature-text" data-i18n-zh="全平台兼容" data-i18n-en="Cross-platform">全平台兼容</div>
                    </div>
                    <div class="feature-card">
                        <i class="fa fa-lock feature-icon"></i>
                        <div class="feature-text" data-i18n-zh="HTTPS 集成" data-i18n-en="HTTPS support">HTTPS 集成</div>
                    </div>
                    <div class="feature-card">
                        <i class="fa fa-tachometer-alt feature-icon"></i>
                        <div class="feature-text" data-i18n-zh="实时监控" data-i18n-en="Live monitoring">实时监控</div>
                    </div>
                    <div class="feature-card">
                        <i class="fa fa-compress feature-icon"></i>
                        <div class="feature-text" data-i18n-zh="压缩加密" data-i18n-en="Encrypt & compress">压缩加密</div>
                    </div>
                    <div class="feature-card">
                        <i class="fa fa-users feature-icon"></i>
                        <div class="feature-text" data-i18n-zh="多用户管理" data-i18n-en="Multi-user">多用户管理</div>
                    </div>
                    <div class="feature-card">
                        <i class="fa fa-globe feature-icon"></i>
                        <div class="feature-text" data-i18n-zh="域名解析" data-i18n-en="Domain routing">域名解析</div>
                    </div>
                    <div class="feature-card">
                        <i class="fa fa-sliders-h feature-icon"></i>
                        <div class="feature-text" data-i18n-zh="流量管控" data-i18n-en="Traffic controls">流量管控</div>
                    </div>
                    <div class="feature-card">
                        <i class="fa fa-cogs feature-icon"></i>
                        <div class="feature-text" data-i18n-zh="一键部署" data-i18n-en="Quick deployment">一键部署</div>
                    </div>
                </div>
            </div>
            <div class="login-form-wrap">
                <form onsubmit="return false">
                    <div class="form-group">
                        <div class="input-icon-wrap">
                            <i class="fa fa-user input-icon"></i>
                            <input name="username" class="form-control has-icon" placeholder="username" required="" autocomplete="username" langtag="word-username">
                        </div>
                    </div>
                    <div class="form-group">
                        <div class="input-icon-wrap">
                            <i class="fa fa-lock input-icon"></i>
                            <input name="password" type="password" class="form-control has-icon" placeholder="password" required="" autocomplete="current-password" langtag="word-password">
                        </div>
                    </div>
                    {{if eq true .captcha_open}}
                    <div class="form-group">
                        {{create_captcha}}
                        <div class="input-icon-wrap">
                            <i class="fa fa-shield-alt input-icon"></i>
                            <input name="captcha" class="form-control has-icon" placeholder="captcha" required="" langtag="word-captcha">
                        </div>
                    </div>
                    {{end}}
                    <button type="button" onclick="login()" class="login-btn" langtag="word-login"></button>
                </form>
                {{if eq true .register_allow}}
                <div class="register-link">
                    <small langtag="info-noaccount"></small>
                    <a href="{{.web_base_url}}/login/register" langtag="word-register"></a>
                </div>
                {{end}}
            </div>
        </div>
    </div>

    <div class="login-footer">
        <strong langtag="word-copyright"></strong> <span langtag="application"></span> &copy; 2018-2026
        &emsp; <span langtag="word-readmore"></span> <a href="https://github.com/ZiDuNet/nps" langtag="word-go"></a>
    </div>
</div>

</body>
</html>

<script type="text/javascript">
    window.nps = {"web_base_url": {{.web_base_url}}, "version": "{{.version}}" }

    function login() {
        if (!validateNpsForm(document.querySelector('.login-form-wrap form'), true)) return false;
        $.ajax({
            type: "POST",
            url: "{{.web_base_url}}/login/verify",
            data: $("form").serializeArray(),
            success: function (res) {
                if (res.status) {
                    window.location.href = "{{.web_base_url}}/index/index"
                } else {
                    if (typeof toastr !== 'undefined') {
                        toastr.error(res.msg, '', { positionClass: 'toast-top-center', timeOut: 3000 });
                    } else {
                        alert(res.msg);
                    }
                    // ALWAYS refresh the captcha on failure (whether wrong captcha
                    // or wrong password) so the same captcha cannot be reused to
                    // attempt different passwords. This prevents brute-force attacks
                    // by ensuring a fresh captcha is required on every attempt.
                    var captchaImg = document.querySelector('img.captcha-img');
                    if (captchaImg) {
                        var src = captchaImg.getAttribute('src').split('?')[0];
                        captchaImg.setAttribute('src', src + '?reload=' + Date.now());
                    }
                    var captchaInput = document.querySelector('input[name="captcha"]');
                    if (captchaInput) captchaInput.value = '';
                }
            }
        })
        return false
    }

    function toggleLoginTheme() {
        var html = document.documentElement;
        var isDark = html.getAttribute('data-theme') === 'dark';
        var next = isDark ? 'light' : 'dark';
        html.setAttribute('data-theme', next);
        localStorage.setItem('nps-theme', next);
        var icon = document.getElementById('theme-icon');
        if (icon) icon.className = next === 'dark' ? 'fa fa-sun' : 'fa fa-moon';
    }

    (function() {
        var saved = localStorage.getItem('nps-theme');
        if (saved) {
            document.documentElement.setAttribute('data-theme', saved);
            var icon = document.getElementById('theme-icon');
            if (icon) icon.className = saved === 'dark' ? 'fa fa-sun' : 'fa fa-moon';
        }
    })();

    // Particle animation
    (function() {
        var canvas = document.getElementById('particle-canvas');
        if (!canvas) return;
        var ctx = canvas.getContext('2d');
        var particles = [];
        var particleCount = 60;
        var maxDist = 120;

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resize();
        window.addEventListener('resize', resize);

        function Particle() {
            this.x = Math.random() * canvas.width;
            this.y = Math.random() * canvas.height;
            this.vx = (Math.random() - 0.5) * 0.6;
            this.vy = (Math.random() - 0.5) * 0.6;
            this.radius = Math.random() * 2 + 1;
        }

        for (var i = 0; i < particleCount; i++) {
            particles.push(new Particle());
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            var dotColor = isDark ? 'rgba(93,173,255,' : 'rgba(59,130,246,';
            var lineColor = isDark ? 'rgba(93,173,255,' : 'rgba(59,130,246,';

            for (var i = 0; i < particles.length; i++) {
                var p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
                if (p.y < 0 || p.y > canvas.height) p.vy *= -1;

                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fillStyle = dotColor + '0.4)';
                ctx.fill();

                for (var j = i + 1; j < particles.length; j++) {
                    var p2 = particles[j];
                    var dx = p.x - p2.x;
                    var dy = p.y - p2.y;
                    var dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < maxDist) {
                        ctx.beginPath();
                        ctx.moveTo(p.x, p.y);
                        ctx.lineTo(p2.x, p2.y);
                        ctx.strokeStyle = lineColor + (0.15 * (1 - dist / maxDist)) + ')';
                        ctx.lineWidth = 0.6;
                        ctx.stroke();
                    }
                }
            }
            requestAnimationFrame(animate);
        }
        animate();
    })();
</script>
