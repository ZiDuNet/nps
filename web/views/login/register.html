<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
        function readRegisterThemePreference() {
            try {
                return window.localStorage ? window.localStorage.getItem('nps-theme') : null;
            } catch (error) {
                return null;
            }
        }

        (function () {
            var savedTheme = readRegisterThemePreference();
            var theme = savedTheme || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', theme);
        }());
    </script>

    <title langtag="title-register"></title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23087c70'/%3E%3Cpath d='M15 40V24l17 12 17-12v16' fill='none' stroke='white' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">

    <link href="{{.web_base_url}}/static/css/fontawesome.min.css?v={{.version}}" rel="stylesheet">
    <link href="{{.web_base_url}}/static/css/solid.min.css?v={{.version}}" rel="stylesheet">
    <link href="{{.web_base_url}}/static/css/bootstrap.min.css?v={{.version}}" rel="stylesheet">
    <link href="{{.web_base_url}}/static/css/style.css?v={{.version}}" rel="stylesheet">
    <link href="{{.web_base_url}}/static/css/modern.css?v={{.version}}&ui=20260831-15" rel="stylesheet">

    <script src="{{.web_base_url}}/static/js/jquery-3.4.1.min.js?v={{.version}}"></script>
    <script src="{{.web_base_url}}/static/js/popper.min.js?v={{.version}}"></script>
    <script src="{{.web_base_url}}/static/js/bootstrap.min.js?v={{.version}}"></script>
    <script src="{{.web_base_url}}/static/js/language.js?v={{.version}}&ui=20260831-15" type="text/javascript"></script>
</head>

<body class="gray-bg auth-body">
<div class="auth-page">
    <header class="auth-page__header">
        <div class="auth-brand" aria-label="NPS">
            <span class="auth-brand__mark" aria-hidden="true"><i class="fa fa-network-wired"></i></span>
            <span class="auth-brand__name" langtag="application"></span>
        </div>

        <div class="auth-page__tools">
            <button type="button" onclick="toggleTheme()" class="auth-icon-button theme-toggle" id="theme-toggle" title="切换主题" data-title-zh="切换主题" data-title-en="Toggle theme" aria-label="切换主题" data-aria-label-zh="切换主题" data-aria-label-en="Toggle theme" aria-pressed="false">
                <i class="fa fa-moon" id="theme-icon" aria-hidden="true"></i>
            </button>
            <div class="auth-language btn-group dropdown">
                <button id="languagemenu" class="btn btn-default dropdown-toggle auth-language__toggle" type="button" data-toggle="dropdown"
                        aria-haspopup="true" aria-expanded="false" title="语言" data-title-zh="语言" data-title-en="Language" aria-label="语言" data-aria-label-zh="语言" data-aria-label-en="Language">
                    <i class="fa fa-globe-asia" aria-hidden="true"></i><span></span>
                </button>
                <ul class="dropdown-menu dropdown-menu-right">
                    <li lang="zh-CN"><a href="#" onclick="return switchLanguage('zh-CN')">简体中文</a></li>
                    <li lang="en-US"><a href="#" onclick="return switchLanguage('en-US')">English</a></li>
                </ul>
            </div>
        </div>
    </header>

    <main class="auth-page__main">
        <div class="auth-layout auth-layout--register">
            <aside class="auth-context" aria-labelledby="auth-context-title">
                <div class="auth-context__brand-mark" aria-hidden="true"><i class="fa fa-network-wired"></i></div>
                <h1 class="auth-context__title" id="auth-context-title" langtag="application"></h1>
                <p class="auth-context__description" langtag="info-tagline"></p>

                <ul class="auth-context__feature-list">
                    <li class="auth-feature">
                        <i class="fa fa-network-wired auth-feature__icon" aria-hidden="true"></i>
                        <span class="auth-feature__label" data-i18n-zh="多协议支持" data-i18n-en="Multi-protocol">多协议支持</span>
                    </li>
                    <li class="auth-feature">
                        <i class="fa fa-desktop auth-feature__icon" aria-hidden="true"></i>
                        <span class="auth-feature__label" data-i18n-zh="全平台兼容" data-i18n-en="Cross-platform">全平台兼容</span>
                    </li>
                    <li class="auth-feature">
                        <i class="fa fa-lock auth-feature__icon" aria-hidden="true"></i>
                        <span class="auth-feature__label" data-i18n-zh="HTTPS 集成" data-i18n-en="HTTPS support">HTTPS 集成</span>
                    </li>
                    <li class="auth-feature">
                        <i class="fa fa-tachometer-alt auth-feature__icon" aria-hidden="true"></i>
                        <span class="auth-feature__label" data-i18n-zh="实时监控" data-i18n-en="Live monitoring">实时监控</span>
                    </li>
                    <li class="auth-feature">
                        <i class="fa fa-compress auth-feature__icon" aria-hidden="true"></i>
                        <span class="auth-feature__label" data-i18n-zh="压缩加密" data-i18n-en="Encrypt &amp; compress">压缩加密</span>
                    </li>
                    <li class="auth-feature">
                        <i class="fa fa-users auth-feature__icon" aria-hidden="true"></i>
                        <span class="auth-feature__label" data-i18n-zh="多用户管理" data-i18n-en="Multi-user">多用户管理</span>
                    </li>
                    <li class="auth-feature">
                        <i class="fa fa-globe auth-feature__icon" aria-hidden="true"></i>
                        <span class="auth-feature__label" data-i18n-zh="域名解析" data-i18n-en="Domain routing">域名解析</span>
                    </li>
                    <li class="auth-feature">
                        <i class="fa fa-sliders-h auth-feature__icon" aria-hidden="true"></i>
                        <span class="auth-feature__label" data-i18n-zh="流量管控" data-i18n-en="Traffic controls">流量管控</span>
                    </li>
                    <li class="auth-feature">
                        <i class="fa fa-cogs auth-feature__icon" aria-hidden="true"></i>
                        <span class="auth-feature__label" data-i18n-zh="一键部署" data-i18n-en="Quick deployment">一键部署</span>
                    </li>
                </ul>
            </aside>

            <section class="auth-panel login-form-wrap" aria-labelledby="auth-register-title">
                <header class="auth-panel__header">
                    <h2 class="auth-panel__title" id="auth-register-title" langtag="info-register"></h2>
                    <p class="auth-panel__description" langtag="info-createaccount"></p>
                </header>

                <form class="auth-form" onsubmit="return register()">
                    <div class="form-group auth-field">
                        <label class="auth-field__label" for="auth-username" langtag="word-username"></label>
                        <div class="auth-control input-icon-wrap">
                            <i class="fa fa-user input-icon" aria-hidden="true"></i>
                            <input id="auth-username" name="username" class="form-control has-icon" placeholder="username" required="" autocomplete="username" langtag="word-username">
                        </div>
                    </div>
                    <div class="form-group auth-field">
                        <label class="auth-field__label" for="auth-password" langtag="word-password"></label>
                        <div class="auth-control input-icon-wrap">
                            <i class="fa fa-lock input-icon" aria-hidden="true"></i>
                            <input id="auth-password" name="password" type="password" class="form-control has-icon" placeholder="password" required="" autocomplete="new-password" langtag="word-password">
                        </div>
                    </div>
                    <button type="button" onclick="register()" class="auth-submit login-btn" langtag="word-register"></button>
                </form>

                <div class="auth-switch register-link">
                    <span class="auth-switch__copy" langtag="info-haveaccount"></span>
                    <a class="auth-switch__link" href="{{.web_base_url}}/login/index" langtag="word-login"></a>
                </div>
            </section>
        </div>
    </main>

    <footer class="auth-page__footer">
        <span><strong langtag="word-copyright"></strong> <span langtag="application"></span> &copy; 2018-2026</span>
    </footer>
</div>

<script type="text/javascript">
    window.nps = {"web_base_url": "{{.web_base_url}}", "version": "{{.version}}"}

    function register() {
        if (!validateNpsForm(document.querySelector('.login-form-wrap form'), true)) return false;
        $.ajax({
            type: "POST",
            url: "{{.web_base_url}}/login/register",
            data: $("form").serializeArray(),
            success: function (res) {
                npsNotify(res.status ? 'success' : 'error', res.msg)
                if (res.status) {
                    window.setTimeout(function () {
                        window.location.href = "{{.web_base_url}}/login/index";
                    }, 450);
                }
            },
            error: function () {
                npsNotify('error', npsRequestErrorMessage());
            }
        })
        return false
    }

    function toggleTheme() {
        var html = document.documentElement;
        var isDark = html.getAttribute('data-theme') === 'dark';
        var next = isDark ? 'light' : 'dark';
        html.setAttribute('data-theme', next);
        try {
            if (window.localStorage) window.localStorage.setItem('nps-theme', next);
        } catch (error) {
            // Keep the current theme for this page when storage is unavailable.
        }
        var icon = document.getElementById('theme-icon');
        var toggle = document.getElementById('theme-toggle');
        if (icon) icon.className = next === 'dark' ? 'fa fa-sun' : 'fa fa-moon';
        if (toggle) toggle.setAttribute('aria-pressed', next === 'dark' ? 'true' : 'false');
    }

    (function() {
        var saved = readRegisterThemePreference() || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', saved);
        var icon = document.getElementById('theme-icon');
        var toggle = document.getElementById('theme-toggle');
        if (icon) icon.className = saved === 'dark' ? 'fa fa-sun' : 'fa fa-moon';
        if (toggle) toggle.setAttribute('aria-pressed', saved === 'dark' ? 'true' : 'false');
    })();
</script>
</body>
</html>
