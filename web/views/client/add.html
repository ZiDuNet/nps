<section class="form-page form-page-client form-page-create" aria-labelledby="client-form-title">
    <header class="dashboard-page-header form-page-header">
        <div class="form-page-heading">
            <div class="dashboard-page-kicker" data-i18n-zh="客户端管理" data-i18n-en="Client management">客户端管理</div>
            <h1 id="client-form-title" langtag="page-clientadd"></h1>
            <p data-i18n-zh="创建客户端并设置访问凭证与资源限制。" data-i18n-en="Create a client and configure access credentials and resource limits.">创建客户端并设置访问凭证与资源限制。</p>
        </div>
        <div class="dashboard-page-actions form-page-actions">
            <a class="btn btn-outline btn-primary form-page-back" href="{{.web_base_url}}/client/list">
                <i class="fa fa-arrow-left" aria-hidden="true"></i>
                <span data-i18n-zh="返回列表" data-i18n-en="Back to list">返回列表</span>
            </a>
        </div>
    </header>
    <div class="row form-page-grid">
    <div class="col-md-12 col-md-auto">
        <section class="panel ibox float-e-margins form-workflow-card zui-panel">
            <div class="ibox-content form-workflow-content">
                <form class="form form-horizontal form-workflow-form zui-form" data-form-workflow="client-create">
                    <div class="form-section-title"><i class="fa fa-info-circle" aria-hidden="true"></i><span data-i18n-zh="基本信息" data-i18n-en="Basic information">基本信息</span></div>
                    <div class="form-group" id="remark">
                        <label class="col-sm-2 control-label font-bold" for="client-remark" langtag="word-remark"></label>
                        <div class="col-sm-10">
                            <input id="client-remark" class="form-control" type="text" name="remark" placeholder="" langtag="word-remark" required>
                        </div>
                    </div>
                    <div class="form-group" id="vkey">
                        <label class="col-sm-2 control-label font-bold" for="client-vkey" langtag="word-verifyKey"></label>
                        <div class="col-sm-10">
                            <input id="client-vkey" class="form-control" type="text" name="vkey" placeholder="" langtag="info-unrestricted">
                            <span class="help-block m-b-none" langtag="info-autogenerated"></span>
                        </div>
                    </div>
                    <div class="form-group" id="user_id">
                        <label class="col-sm-2 control-label font-bold" for="client-user-id" data-i18n-zh="所属用户" data-i18n-en="Assigned user">所属用户</label>
                        <div class="col-sm-10">
                            <select id="client-user-id" class="form-control" name="user_id">
                                <option value="0" data-i18n-zh="未分配" data-i18n-en="Unassigned">未分配</option>
                                {{range .users}}
                                <option value="{{.Id}}">{{.UserName}}</option>
                                {{end}}
                            </select>
                        </div>
                    </div>

                    <div class="form-section-title"><i class="fa fa-sliders-h" aria-hidden="true"></i><span data-i18n-zh="资源限制" data-i18n-en="Resource limits">资源限制</span></div>
                {{if eq true .allow_flow_limit}}
                    <div class="form-group" id="flow_limit">
                        <label class="col-sm-2 control-label font-bold" for="client-flow-limit" langtag="word-flowlimit"></label>
                        <div class="col-sm-10">
                            <input id="client-flow-limit" class="form-control" type="text" name="flow_limit" placeholder="" langtag="info-unrestricted">
                            <span class="help-block m-b-none" langtag="word-unit"></span>: M
                        </div>
                    </div>
                {{end}}
                {{if eq true .allow_rate_limit}}
                    <div class="form-group" id="rate_limit">
                        <label class="col-sm-2 control-label font-bold" for="client-rate-limit" langtag="word-ratelimit"></label>
                        <div class="col-sm-10">
                            <input id="client-rate-limit" class="form-control" type="text" name="rate_limit" placeholder="" langtag="info-unrestricted">
                            <span class="help-block m-b-none" langtag="word-unit"></span>: KB/S
                        </div>
                    </div>
                {{end}}
                {{if eq true .allow_connection_num_limit}}
                    <div class="form-group" id="max_conn">
                        <label class="col-sm-2 control-label font-bold" for="client-max-conn" langtag="word-maxconnections"></label>
                        <div class="col-sm-10">
                            <input id="client-max-conn" class="form-control" type="text" name="max_conn" placeholder="" langtag="info-unrestricted">
                        </div>
                    </div>
                {{end}}
                {{if eq true .allow_tunnel_num_limit}}
                    <div class="form-group" id="max_tunnel">
                        <label class="col-sm-2 control-label font-bold" for="client-max-tunnel" langtag="word-maxtunnels"></label>
                        <div class="col-sm-10">
                            <input id="client-max-tunnel" class="form-control" type="text" name="max_tunnel" placeholder="" langtag="info-unrestricted">
                        </div>
                    </div>
                {{end}}

                    <div class="form-section-title"><i class="fa fa-key" aria-hidden="true"></i><span data-i18n-zh="认证配置" data-i18n-en="Authentication">认证配置</span></div>
                    <div class="form-group" id="u">
                        <label class="col-sm-2 control-label font-bold" for="client-basic-username" langtag="word-basicusername"></label>
                        <div class="col-sm-10">
                            <input id="client-basic-username" class="form-control" type="text" name="u" placeholder="" langtag="info-unrestricted">
                            <span class="help-block m-b-none" langtag="info-onlyproxy"></span>
                        </div>
                    </div>
                    <div class="form-group" id="p">
                        <label class="col-sm-2 control-label font-bold" for="client-basic-password" langtag="word-basicpassword"></label>
                        <div class="col-sm-10">
                            <div class="input-group">
                                <input id="client-basic-password" class="form-control" type="password" name="p" autocomplete="new-password" spellcheck="false" placeholder="" langtag="info-unrestricted">
                                <span class="input-group-btn"><button class="btn btn-default credential-password-toggle" type="button" data-password-target="client-basic-password" aria-controls="client-basic-password" aria-label="显示密码" data-aria-label-zh="显示密码" data-aria-label-en="Show password" aria-pressed="false" title="显示密码" data-title-zh="显示密码" data-title-en="Show password"><i class="fa fa-eye" aria-hidden="true"></i></button></span>
                            </div>
                            <span class="help-block m-b-none" langtag="info-onlyproxy"></span>
                        </div>
                    </div>
                    <div class="form-group" id="compress">
                        <label class="col-sm-2 control-label font-bold" for="client-compress" langtag="word-compress"></label>
                        <div class="col-sm-10">
                            <select id="client-compress" class="form-control" name="compress">
                                <option value="0" langtag="word-no"></option>
                                <option value="1" langtag="word-yes"></option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group" id="crypt">
                        <label class="col-sm-2 control-label font-bold" for="client-crypt" langtag="word-crypt"></label>
                        <div class="col-sm-10">
                            <select id="client-crypt" class="form-control" name="crypt">
                                <option value="0" langtag="word-no"></option>
                                <option value="1" langtag="word-yes"></option>
                            </select>
                        </div>
                    </div>
                {{if eq true .allow_user_login}}
                    <div class="form-group" id="web_username">
                        <label class="col-sm-2 control-label font-bold" for="client-web-username" langtag="word-webusername"></label>
                        <div class="col-sm-10">
                            <input id="client-web-username" class="form-control" type="text" name="web_username" placeholder="" langtag="info-unrestricted">
                        </div>
                    </div>
                    <div class="form-group" id="web_password">
                        <label class="col-sm-2 control-label font-bold" for="client-web-password" langtag="word-webpassword"></label>
                        <div class="col-sm-10">
                            <div class="input-group">
                                <input id="client-web-password" class="form-control" type="password" name="web_password" autocomplete="new-password" spellcheck="false" placeholder="" langtag="info-unrestricted">
                                <span class="input-group-btn"><button class="btn btn-default credential-password-toggle" type="button" data-password-target="client-web-password" aria-controls="client-web-password" aria-label="显示密码" data-aria-label-zh="显示密码" data-aria-label-en="Show password" aria-pressed="false" title="显示密码" data-title-zh="显示密码" data-title-en="Show password"><i class="fa fa-eye" aria-hidden="true"></i></button></span>
                            </div>
                        </div>
                    </div>
                {{end}}

                    <div class="form-section-title"><i class="fa fa-shield-alt" aria-hidden="true"></i><span data-i18n-zh="访问控制" data-i18n-en="Access control">访问控制</span></div>
                    <div class="form-group" id="config_conn_allow">
                        <label class="col-sm-2 control-label font-bold" for="client-config-conn-allow" langtag="word-connectbyconfig"></label>
                        <div class="col-sm-10">
                            <div class="toggle-field">
                                <input type="hidden" name="config_conn_allow" value="1">
                                <label class="toggle-switch"><input id="client-config-conn-allow" type="checkbox" checked><span class="toggle-slider"></span></label>
                                <span class="toggle-label" data-i18n-zh="是" data-i18n-en="Yes">是</span>
                            </div>
                        </div>
                    </div>
                    <div class="form-group" id="ip_white">
                        <label class="col-sm-2 control-label font-bold" for="client-ip-white" langtag="word-ipwhite"></label>
                        <div class="col-sm-10">
                            <div class="toggle-field">
                                <input type="hidden" name="ipwhite" value="0">
                                <label class="toggle-switch"><input id="client-ip-white" type="checkbox"><span class="toggle-slider"></span></label>
                                <span class="toggle-label" data-i18n-zh="否" data-i18n-en="No">否</span>
                            </div>
                        </div>
                    </div>
                    <div class="form-group is-hidden" id="Ip_white_pass">
                        <label class="col-sm-2 control-label font-bold" for="client-ip-white-pass" langtag="word-ipwhitepass"></label>
                        <div class="col-sm-10">
                            <input id="client-ip-white-pass" class="form-control" type="text" name="ipwhitepass" placeholder="" langtag="info-input-whitepass">
                            <span class="help-block m-b-none" langtag="info-ipwhitepass"></span>
                        </div>
                    </div>
                    <div class="form-group form-group--wide is-hidden" id="ip_white_list">
                        <label class="col-sm-2 control-label font-bold" for="client-ip-white-list" langtag="word-ipwhitelist"></label>
                        <div class="col-sm-10">
                            <textarea id="client-ip-white-list" class="form-control" rows="4" type="text" name="ipwhitelist" placeholder="" langtag="info-suchasblackiplist">{{.BlackIpList}}</textarea>
                            <span class="help-block m-b-none" langtag="info-descblackiplist"></span>
                        </div>
                    </div>
                    <div class="form-group form-group--wide" id="black_ip_list">
                        <label class="col-sm-2 control-label font-bold" for="client-black-ip-list" langtag="word-blackiplist"></label>
                        <div class="col-sm-10">
                            <textarea id="client-black-ip-list" class="form-control" rows="4" type="text" name="blackiplist" placeholder="" langtag="info-suchasblackiplist">{{.BlackIpList}}</textarea>
                            <span class="help-block m-b-none" langtag="info-descblackiplist"></span>
                        </div>
                    </div>

                    <div class="form-section-title"><i class="fa fa-clock" aria-hidden="true"></i><span data-i18n-zh="有效期" data-i18n-en="Expiration">有效期</span></div>
                    <div class="form-group" id="expire_time">
                        <label class="col-sm-2 control-label font-bold" for="client-expire-time" langtag="word-expiretime"></label>
                        <div class="col-sm-10">
                            <input id="client-expire-time" class="form-control flatpickr-expire" type="text" name="expire_time" placeholder="2026-12-31 23:59:59" autocomplete="off">
                            <span class="help-block m-b-none" langtag="info-expiretime"></span>
                        </div>
                    </div>

                    <div class="hr-line-dashed"></div>
                    <div class="form-group form-workflow-actions">
                        <div class="col-sm-4 col-sm-offset-2">
                            <button class="btn btn-success" type="button" onclick="submitform('add', '{{.web_base_url}}/client/add', $('form').serializeArray())">
                                <i class="fa fa-fw fa-lg fa-check-circle"></i> <span langtag="word-add"></span>
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </section>
    </div>
</div>
</section>

<script>
$(document).ready(function() {
    // IP白名单开关
    var $ipToggle = $('#ip_white .toggle-switch input[type="checkbox"]');
    function updateIpWhiteUI() {
        var checked = $ipToggle.is(':checked');
        npsSetToggleLabel($ipToggle.closest('.toggle-field').find('.toggle-label'), checked);
        $('#Ip_white_pass, #ip_white_list').toggleClass('is-hidden', !checked);
        $('#black_ip_list').toggleClass('is-hidden', checked);
    }
    $ipToggle.on('change', updateIpWhiteUI);

    // config_conn_allow 标签
    var $connToggle = $('#config_conn_allow .toggle-switch input[type="checkbox"]');
    $connToggle.on('change', function() {
        npsSetToggleLabel($(this).closest('.toggle-field').find('.toggle-label'), this.checked);
    });

    if (typeof flatpickr !== 'undefined') {
        flatpickr('.flatpickr-expire', {
            enableTime: true,
            enableSeconds: true,
            time_24hr: true,
            dateFormat: 'Y-m-d H:i:S',
            minDate: 'today',
            allowInput: true,
            locale: (flatpickr.l10ns && flatpickr.l10ns.zh) ? 'zh' : 'default'
        });
    }
});
</script>
