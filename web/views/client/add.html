<div class="row">
    <div class="col-md-12 col-md-auto">
        <div class="ibox float-e-margins">
            <h3 class="ibox-title" langtag="page-clientadd"></h3>
            <div class="ibox-content">
                <form class="form-horizontal">
                    <div class="form-section-title"><i class="fa fa-info-circle"></i> 基本信息</div>
                    <div class="form-group" id="remark">
                        <label class="col-sm-2 control-label font-bold" langtag="word-remark"></label>
                        <div class="col-sm-10">
                            <input class="form-control" type="text" name="remark" placeholder="" langtag="word-remark" required>
                        </div>
                    </div>
                    <div class="form-group" id="vkey">
                        <label class="col-sm-2 control-label font-bold" langtag="word-verifyKey"></label>
                        <div class="col-sm-10">
                            <input class="form-control" type="text" name="vkey" placeholder="" langtag="info-unrestricted">
                            <span class="help-block m-b-none" langtag="info-autogenerated"></span>
                        </div>
                    </div>
                    <div class="form-group" id="user_id">
                        <label class="col-sm-2 control-label font-bold">所属用户</label>
                        <div class="col-sm-10">
                            <select class="form-control" name="user_id">
                                <option value="0">未分配</option>
                                {{range .users}}
                                <option value="{{.Id}}">{{.UserName}}</option>
                                {{end}}
                            </select>
                        </div>
                    </div>

                    <div class="form-section-title"><i class="fa fa-sliders-h"></i> 资源限制</div>
                {{if eq true .allow_flow_limit}}
                    <div class="form-group" id="flow_limit">
                        <label class="col-sm-2 control-label font-bold" langtag="word-flowlimit"></label>
                        <div class="col-sm-10">
                            <input class="form-control" type="text" name="flow_limit" placeholder="" langtag="info-unrestricted">
                            <span class="help-block m-b-none" langtag="word-unit"></span>: M
                        </div>
                    </div>
                {{end}}
                {{if eq true .allow_rate_limit}}
                    <div class="form-group" id="rate_limit">
                        <label class="col-sm-2 control-label font-bold" langtag="word-ratelimit"></label>
                        <div class="col-sm-10">
                            <input class="form-control" type="text" name="rate_limit" placeholder="" langtag="info-unrestricted">
                            <span class="help-block m-b-none" langtag="word-unit"></span>: KB/S
                        </div>
                    </div>
                {{end}}
                {{if eq true .allow_connection_num_limit}}
                    <div class="form-group" id="max_conn">
                        <label class="col-sm-2 control-label font-bold" langtag="word-maxconnections"></label>
                        <div class="col-sm-10">
                            <input class="form-control" type="text" name="max_conn" placeholder="" langtag="info-unrestricted">
                        </div>
                    </div>
                {{end}}
                {{if eq true .allow_tunnel_num_limit}}
                    <div class="form-group" id="max_tunnel">
                        <label class="col-sm-2 control-label font-bold" langtag="word-maxtunnels"></label>
                        <div class="col-sm-10">
                            <input class="form-control" type="text" name="max_tunnel" placeholder="" langtag="info-unrestricted">
                        </div>
                    </div>
                {{end}}

                    <div class="form-section-title"><i class="fa fa-key"></i> 认证配置</div>
                    <div class="form-group" id="u">
                        <label class="col-sm-2 control-label font-bold" langtag="word-basicusername"></label>
                        <div class="col-sm-10">
                            <input class="form-control" type="text" name="u" placeholder="" langtag="info-unrestricted">
                            <span class="help-block m-b-none" langtag="info-onlyproxy"></span>
                        </div>
                    </div>
                    <div class="form-group" id="p">
                        <label class="col-sm-2 control-label font-bold" langtag="word-basicpassword"></label>
                        <div class="col-sm-10">
                            <input class="form-control" type="text" name="p" placeholder="" langtag="info-unrestricted">
                            <span class="help-block m-b-none" langtag="info-onlyproxy"></span>
                        </div>
                    </div>
                    <div class="form-group" id="compress">
                        <label class="col-sm-2 control-label font-bold" langtag="word-compress"></label>
                        <div class="col-sm-10">
                            <select class="form-control" name="compress">
                                <option value="0" langtag="word-no"></option>
                                <option value="1" langtag="word-yes"></option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group" id="crypt">
                        <label class="col-sm-2 control-label font-bold" langtag="word-crypt"></label>
                        <div class="col-sm-10">
                            <select class="form-control" name="crypt">
                                <option value="0" langtag="word-no"></option>
                                <option value="1" langtag="word-yes"></option>
                            </select>
                        </div>
                    </div>
                {{if eq true .allow_user_login}}
                    <div class="form-group" id="web_username">
                        <label class="col-sm-2 control-label font-bold" langtag="word-webusername"></label>
                        <div class="col-sm-10">
                            <input class="form-control" type="text" name="web_username" placeholder="" langtag="info-unrestricted">
                        </div>
                    </div>
                    <div class="form-group" id="web_password">
                        <label class="col-sm-2 control-label font-bold" langtag="word-webpassword"></label>
                        <div class="col-sm-10">
                            <input class="form-control" type="text" name="web_password" placeholder="" langtag="info-unrestricted">
                        </div>
                    </div>
                {{end}}

                    <div class="form-section-title"><i class="fa fa-shield-alt"></i> 访问控制</div>
                    <div class="form-group" id="config_conn_allow">
                        <label class="col-sm-2 control-label font-bold" langtag="word-connectbyconfig"></label>
                        <div class="col-sm-10">
                            <div class="toggle-field">
                                <input type="hidden" name="config_conn_allow" value="1">
                                <label class="toggle-switch"><input type="checkbox" checked><span class="toggle-slider"></span></label>
                                <span class="toggle-label">是</span>
                            </div>
                        </div>
                    </div>
                    <div class="form-group" id="ip_white">
                        <label class="col-sm-2 control-label font-bold" langtag="word-ipwhite"></label>
                        <div class="col-sm-10">
                            <div class="toggle-field">
                                <input type="hidden" name="ipwhite" value="0">
                                <label class="toggle-switch"><input type="checkbox"><span class="toggle-slider"></span></label>
                                <span class="toggle-label">否</span>
                            </div>
                        </div>
                    </div>
                    <div class="form-group" id="Ip_white_pass" style="display: none;">
                        <label class="col-sm-2 control-label font-bold" langtag="word-ipwhitepass"></label>
                        <div class="col-sm-10">
                            <input class="form-control" type="text" name="ipwhitepass" placeholder="" langtag="info-input-whitepass">
                            <span class="help-block m-b-none" langtag="info-ipwhitepass"></span>
                        </div>
                    </div>
                    <div class="form-group" id="ip_white_list" style="display: none;">
                        <label class="col-sm-2 control-label font-bold" langtag="word-ipwhitelist"></label>
                        <div class="col-sm-10">
                            <textarea class="form-control" rows="4" type="text" name="ipwhitelist" placeholder="" langtag="info-suchasblackiplist">{{.BlackIpList}}</textarea>
                            <span class="help-block m-b-none" langtag="info-descblackiplist"></span>
                        </div>
                    </div>
                    <div class="form-group" id="black_ip_list">
                        <label class="col-sm-2 control-label font-bold" langtag="word-blackiplist"></label>
                        <div class="col-sm-10">
                            <textarea class="form-control" rows="4" type="text" name="blackiplist" placeholder="" langtag="info-suchasblackiplist">{{.BlackIpList}}</textarea>
                            <span class="help-block m-b-none" langtag="info-descblackiplist"></span>
                        </div>
                    </div>

                    <div class="form-section-title"><i class="fa fa-clock"></i> 有效期</div>
                    <div class="form-group" id="expire_time">
                        <label class="col-sm-2 control-label font-bold" langtag="word-expiretime"></label>
                        <div class="col-sm-10">
                            <input class="form-control flatpickr-expire" type="text" name="expire_time" placeholder="2026-12-31 23:59:59" autocomplete="off">
                            <span class="help-block m-b-none" langtag="info-expiretime"></span>
                        </div>
                    </div>

                    <div class="hr-line-dashed"></div>
                    <div class="form-group">
                        <div class="col-sm-4 col-sm-offset-2">
                            <button class="btn btn-success" type="button" onclick="submitform('add', '{{.web_base_url}}/client/add', $('form').serializeArray())">
                                <i class="fa fa-fw fa-lg fa-check-circle"></i> <span langtag="word-add"></span>
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
$(document).ready(function() {
    // IP白名单开关
    var $ipToggle = $('#ip_white .toggle-switch input[type="checkbox"]');
    function updateIpWhiteUI() {
        var checked = $ipToggle.is(':checked');
        $ipToggle.closest('.toggle-field').find('.toggle-label').text(checked ? '是' : '否');
        if (checked) {
            $('#Ip_white_pass').show();
            $('#ip_white_list').show();
            $('#black_ip_list').hide();
        } else {
            $('#Ip_white_pass').hide();
            $('#ip_white_list').hide();
            $('#black_ip_list').show();
        }
    }
    $ipToggle.on('change', updateIpWhiteUI);

    // config_conn_allow 标签
    var $connToggle = $('#config_conn_allow .toggle-switch input[type="checkbox"]');
    $connToggle.on('change', function() {
        $(this).closest('.toggle-field').find('.toggle-label').text(this.checked ? '是' : '否');
    });

    if (typeof flatpickr !== 'undefined') {
        flatpickr('.flatpickr-expire', {
            enableTime: true,
            enableSeconds: true,
            time_24hr: true,
            dateFormat: 'Y-m-d H:i:S',
            minDate: 'today',
            allowInput: true,
            locale: (flatpickr.l10ns && flatpickr.l10ns.zh) ? 'zh' : 'default'
        });
    }
});
</script>
