<section class="wrapper wrapper-content animated fadeInRight management-page management-page--client" aria-labelledby="client-list-title">
    <header class="dashboard-page-header management-page-header">
        <div>
            <div class="dashboard-page-kicker" data-i18n-zh="客户端管理" data-i18n-en="Client management">客户端管理</div>
            <h1 id="client-list-title" langtag="page-clientlist"></h1>
            <p data-i18n-zh="管理客户端、访问凭证与连接状态。" data-i18n-en="Manage clients, access credentials, and connection status.">管理客户端、访问凭证与连接状态。</p>
        </div>
    </header>
    <div class="management-page-grid">
        <div class="management-page-column">
            <section class="panel ibox float-e-margins management-table-card nps-panel">
                <div class="ibox-content management-table-content">
                    <div id="toolbar" class="management-table-toolbar">
                        <a href="{{.web_base_url}}/client/add" class="btn btn-primary dim">
                            <i class="fa fa-fw fa-lg fa-plus"></i> <span langtag="word-add"></span>
                        </a>
                        {{if .accountQuota.Visible}}
                        <span class="client-list-quota" role="status">
                            <i class="fa fa-desktop" aria-hidden="true"></i>
                            <span data-i18n-zh="客户端" data-i18n-en="Clients">客户端</span>
                            <strong>{{.accountQuota.ClientUsed}} / {{if .accountQuota.ClientLimit}}{{.accountQuota.ClientLimit}}{{else}}<span data-i18n-zh="不限" data-i18n-en="Unlimited">不限</span>{{end}}</strong>
                        </span>
                        {{end}}
                        {{if eq true .isAdmin}}
                        <button type="button" onclick="batchResourceAction('{{.web_base_url}}/client/changestatus', {status: 1}, '批量启用', 'Enable selected')" class="btn btn-outline btn-primary">
                            <i class="fa fa-play" aria-hidden="true"></i> <span data-i18n-zh="批量启用" data-i18n-en="Enable selected">批量启用</span>
                        </button>
                        <button type="button" onclick="batchResourceAction('{{.web_base_url}}/client/changestatus', {status: 0}, '批量停用', 'Disable selected')" class="btn btn-outline btn-warning">
                            <i class="fa fa-pause" aria-hidden="true"></i> <span data-i18n-zh="批量停用" data-i18n-en="Disable selected">批量停用</span>
                        </button>
                        <label class="nps-table-filter nps-table-filter--identity" for="client-owner-filter">
                            <span class="nps-table-filter__label" data-i18n-zh="所属用户" data-i18n-en="Owner">所属用户</span>
                            <select id="client-owner-filter" class="form-control nps-table-filter__control" data-nps-table-filter="user_id">
                                <option value="" data-i18n-zh="全部用户" data-i18n-en="All users">全部用户</option>
                                <option value="0" data-i18n-zh="未分配" data-i18n-en="Unassigned">未分配</option>
                                {{range .users}}
                                <option value="{{.Id}}"
                                    data-i18n-zh="{{if and .Remark (ne .Remark .UserName)}}{{.Remark}}（{{.UserName}}）{{else}}{{.UserName}}{{end}}"
                                    data-i18n-en="{{if and .Remark (ne .Remark .UserName)}}{{.Remark}} ({{.UserName}}){{else}}{{.UserName}}{{end}}">{{if and .Remark (ne .Remark .UserName)}}{{.Remark}}（{{.UserName}}）{{else}}{{.UserName}}{{end}}</option>
                                {{end}}
                            </select>
                        </label>
                        {{end}}
                    </div>
                    <table id="table"></table>
                </div>
            </section>
        </div>
    </div>

    <div id="client-update-modal" class="modal fade" tabindex="-1" role="dialog" aria-modal="true" aria-labelledby="client-update-title" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered" role="document">
            <div class="modal-content nps-password-modal">
                <div class="modal-header">
                    <div><div class="nps-modal-kicker" data-i18n-zh="客户端维护" data-i18n-en="Client maintenance">客户端维护</div><h2 id="client-update-title" class="modal-title" data-i18n-zh="检查客户端更新" data-i18n-en="Check client update">检查客户端更新</h2></div>
                    <button type="button" class="nps-modal-close" data-bs-dismiss="modal" aria-label="关闭"><i class="fa fa-times" aria-hidden="true"></i></button>
                </div>
                <div class="modal-body">
                    <div class="client-update-fields">
                        <div class="client-update-field">
                            <span class="client-update-field__label" data-i18n-zh="当前版本" data-i18n-en="Current version">当前版本</span>
                            <strong id="client-update-current">-</strong>
                        </div>
                        <div class="client-update-field">
                            <span class="client-update-field__label" data-i18n-zh="最新版本" data-i18n-en="Latest version">最新版本</span>
                            <strong id="client-update-latest"><span class="client-update-loading"><i class="fa fa-spinner fa-spin" aria-hidden="true"></i><span data-i18n-zh="检测中…" data-i18n-en="Checking…">检测中…</span></span></strong>
                        </div>
                    </div>
                    <p id="client-update-summary" class="client-update-summary" hidden></p>
                    <p id="client-update-hint" class="help-block client-update-hint" data-i18n-zh="远程升级依赖 GitHub Release；客户端会下载、校验并自动重启，隧道可能短暂中断。" data-i18n-en="Remote update uses the GitHub Release; the client downloads, verifies, and restarts itself, so tunnels may briefly disconnect.">远程升级依赖 GitHub Release；客户端会下载、校验并自动重启，隧道可能短暂中断。</p>
                    <p id="client-update-error" class="client-update-error" hidden></p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline btn-secondary" data-bs-dismiss="modal" data-i18n-zh="关闭" data-i18n-en="Close">关闭</button>
                    <button type="button" class="btn btn-primary" id="client-update-send" hidden data-i18n-zh="下发升级" data-i18n-en="Send update">下发升级</button>
                </div>
            </div>
        </div>
    </div>
</section>

<script>
    /* Remote table backed by server-side pagination and search. */
    var clientListCompact = window.matchMedia && window.matchMedia('(min-width: 992px) and (max-width: 1599px)').matches;

    function clientUnlimitedText() {
        return npsIsEnglish() ? 'Unlimited' : '永不过期';
    }

    $('#table').npsTable({
        toolbar: "#toolbar",
        method: 'post', // 服务器数据的请求方式 get or post
        url: "{{.web_base_url}}/client/list", // 服务器数据的加载地址
        contentType: "application/x-www-form-urlencoded",
        striped: true, // 设置为true会有隔行变色效果
        search: true,
        showHeader: true,
        showColumns: true,
        showRefresh: true,
        pagination: true,//分页
        sidePagination: 'server',//服务器端分页
        pageNumber: 1,
        pageList: [5, 10, 20, 50],//分页步进值
        // v3 keeps the action column visible even when an older browser
        // preference hid the version column (where the update action used to
        // live).  Existing preferences are intentionally not reused so the
        // remote-update action cannot disappear after an upgrade.
        // Reset the compact-column preference once so deployments that saved
        // the previous hidden-flow defaults now receive the new visible flow
        // columns. Administrators can still hide them from the column menu.
        storageKey: 'client-v4',
        detailView: true,
        smartDisplay: true, // 智能显示 pagination 和 cardview 等
        formatLoadingMessage: function () { return npsTableState('client', true); },
        formatNoMatches: function () { return npsTableState('client', false); },
        onExpandRow: function () {
            $('body').setLang('.detail-view');
            npsDecorateDetailControls('#table');
        },
        onCollapseRow: function () { window.setTimeout(function () { npsDecorateDetailControls('#table'); }, 0); },
        onPostBody: function (data) {
            $('body').setLang('#table');
            npsApplyTableState(this, 'client');
        },
        detailFormatter: function (index, row, element) {
            var english = npsIsEnglish();
            var flow = row.Flow || {};
            var text = function (value, fallback) {
                if (value == null || value === '') value = fallback == null ? '' : fallback;
                return npsEscapeHtml(value);
            };
            var listText = function (value) {
                if (!value || !value.length) return '-';
                return text(Array.isArray(value) ? value.join(', ') : value);
            };
            var credentialStatus = function (configured) {
                return configured ? (english ? 'Configured' : '已设置') : (english ? 'Not set' : '未设置');
            };
            var configuredExpiry = row.ExpireTime
                ? text(row.ExpireTime)
                : (Number(row.UserId) > 0 ? (english ? 'Follow user' : '跟随所属用户') : text(clientUnlimitedText()));
            var effectiveExpiry = row.EffectiveExpireTime
                ? text(row.EffectiveExpireTime)
                : text(clientUnlimitedText());
            var inletFlow = changeunit(flow.InletFlow || 0);
            var exportFlow = changeunit(flow.ExportFlow || 0);
            var kv = function(label, value) {
                return '<div class="client-detail__item">'
                    + '<span class="client-detail__label">' + label + '</span>'
                    + '<span class="client-detail__value">' + value + '</span></div>';
            };
            var chips = function(label, value) {
                var items = Array.isArray(value) ? value : [];
                var content = items.length
                    ? items.map(function (item) { return '<span class="client-detail__chip">' + text(item) + '</span>'; }).join('')
                    : '<span class="client-detail__chip client-detail__chip--empty">-</span>';
                return '<div class="client-detail__chips"><span class="client-detail__label">' + label + '</span><div class="client-detail__chip-list">' + content + '</div></div>';
            };
            var section = function(icon, title, content) {
                return '<section class="client-detail__section">'
                    + '<h6 class="client-detail__section-title"><i class="fa fa-' + icon + '" aria-hidden="true"></i>' + title + '</h6>'
                    + '<div class="client-detail__grid">' + content + '</div></section>';
            };
            var cmdRow = function(label, code) {
                return '<div class="client-detail__command">'
                    + '<span class="client-detail__command-label">' + label + '</span>'
                    + '<code>' + text(code) + '</code>'
                    + '<button type="button" class="copy btn btn-outline btn-primary btn-xs client-detail__copy" onclick="copyCommand(this)" data-clipboard-text="" data-title-zh="复制命令" data-title-en="Copy command" data-aria-label-zh="复制命令" data-aria-label-en="Copy command"><i class="fa fa-copy" aria-hidden="true"></i></button></div>';
            };
            var connectionCommands = Array.isArray(row.ConnectionCommands) ? row.ConnectionCommands : [];
            var commandSection = '<section class="client-detail__section client-detail__connection-section">'
                + '<h6 class="client-detail__section-title"><i class="fa fa-terminal" aria-hidden="true"></i>' + (english ? 'Connection commands' : '连接命令') + '</h6>';
            if (connectionCommands.length) {
                commandSection += '<div class="client-detail__protocol-tabs" role="tablist">'
                    + connectionCommands.map(function(command, commandIndex) {
                        var flags = [];
                        if (command.Main) flags.push(english ? 'Main' : '主入口');
                        if (command.QuickFormat) flags.push(String(command.QuickFormat).toUpperCase());
                        return '<button type="button" role="tab" class="client-detail__protocol-tab' + (commandIndex === 0 ? ' active' : '') + '"'
                            + ' data-client-protocol-tab="' + index + '-' + commandIndex + '"'
                            + ' aria-selected="' + (commandIndex === 0 ? 'true' : 'false') + '">'
                            + '<strong>' + text(command.Label || command.Protocol || '') + '</strong>'
                            + (flags.length ? '<small>' + text(flags.join(' · ')) + '</small>' : '')
                            + '</button>';
                    }).join('')
                    + '</div><div class="client-detail__protocol-panels">'
                    + connectionCommands.map(function(command, commandIndex) {
                        var chips = [];
                        if (command.RequiresUDP) chips.push('<span class="client-detail__protocol-chip client-detail__protocol-chip--udp">UDP</span>');
                        if (command.ViaHTTP3) chips.push('<span class="client-detail__protocol-chip">HTTP/3</span>');
                        if (command.Path) chips.push('<span class="client-detail__protocol-chip">Path ' + text(command.Path) + '</span>');
                        if (command.ALPN) chips.push('<span class="client-detail__protocol-chip">ALPN ' + text(command.ALPN) + '</span>');
                        return '<div class="client-detail__protocol-panel' + (commandIndex === 0 ? ' active' : '') + '"'
                            + ' data-client-protocol-panel="' + index + '-' + commandIndex + '" role="tabpanel">'
                            + '<div class="client-detail__protocol-summary"><div><strong>' + text(command.Label || command.Protocol || '') + '</strong>'
                            + '<code>' + text(command.Address || '-') + '</code></div><div class="client-detail__protocol-chips">' + chips.join('') + '</div></div>'
                            + cmdRow((english ? 'Quick command' : '快捷命令') + ' <span class="client-detail__command-version">' + text((command.QuickFormat || '').toUpperCase()) + '</span>', command.QuickCommand || '')
                            + cmdRow((english ? 'NPC command' : '普通命令'), command.NormalCommand || '')
                            + '</div>';
                    }).join('')
                    + '</div>';
            } else {
                commandSection += '<div class="client-detail__history-empty">' + (english ? 'No Bridge endpoint is available for commands. Check bridge_*_show settings.' : '当前没有可用于生成命令的 Bridge 入口，请检查 bridge_*_show 展示设置。') + '</div>';
            }
            commandSection += '</section>';
            return '<div class="client-detail">'
                + commandSection
                + '<div class="client-detail__cards">'
                + '<section class="client-detail__card">'
                + '<h6 class="client-detail__section-title"><i class="fa fa-sliders-h" aria-hidden="true"></i>' + (english ? 'Connection' : '基础配置') + '</h6>'
                + '<div class="client-detail__grid">'
                + kv('<span langtag="word-maxconnections"></span>', text(row.MaxConn))
                + kv('<span langtag="word-curconnections"></span>', '<span class="live-connections" data-live-client-id="' + Number(row.Id) + '"><span data-live-client-connections>' + text(row.NowConn, 0) + ' / ' + text(Number(row.MaxConn) > 0 ? row.MaxConn : '∞') + '</span></span>')
                + kv(english ? 'Live bandwidth' : '实时带宽', '<span class="client-live-rate" data-live-client-id="' + Number(row.Id) + '"><span class="client-live-rate__direction">↑</span><span class="client-live-rate__value" data-live-client-up>' + changeunit(Number((row.Rate || {}).UploadRate) || 0) + '/s</span><span class="client-live-rate__direction">↓</span><span class="client-live-rate__value" data-live-client-down>' + changeunit(Number((row.Rate || {}).DownloadRate) || 0) + '/s</span></span>')
                + kv('<span langtag="word-flowlimit"></span>', text(flow.FlowLimit, 0) + ' M')
                + kv('<span langtag="word-ratelimit"></span>', text(row.RateLimit, 0) + ' KB/s')
                + kv('<span langtag="word-maxtunnels"></span>', text(row.MaxTunnelNum, 0))
                + kv('<span langtag="word-connectbyconfig"></span>', npsBooleanMarkup(!!row.ConfigConnAllow))
                + '</div></section>'
                + '<section class="client-detail__card">'
                + '<h6 class="client-detail__section-title"><i class="fa fa-info-circle" aria-hidden="true"></i>' + (english ? 'Client details' : '客户端信息') + '</h6>'
                + '<div class="client-detail__grid">'
                + kv(english ? 'Owner' : '所属用户', row.UserId > 0
                    ? (text(row.UserName, '-') + (row.UserRemark ? ' · ' + text(row.UserRemark) : '') + '（ID ' + text(row.UserId) + '）')
                    : (english ? 'Unassigned' : '未分配'))
                + kv(english ? 'Status' : '运行状态', row.Status === true ? (english ? 'Enabled' : '已启用') : (english ? 'Disabled' : '已停用'))
                + kv(english ? 'Online' : '在线状态', row.IsConnect === true
                    ? (english ? 'Online' : '在线') + (row.ConnectionProtocol ? ' · ' + text(row.ConnectionProtocol) : '')
                    : (english ? 'Offline' : '离线'))
                + kv('<span langtag="word-version"></span>', text(row.Version, '-'))
                + kv('<span langtag="word-verifykey"></span>', text(row.VerifyKey, '-'))
                + kv('<span langtag="word-address"></span>', text(row.Addr, '-'))
                + kv('<span langtag="word-localaddr"></span>', text(row.LocalAddr, '-'))
                + kv(english ? 'Public verify key' : '公开验证密钥模式', npsBooleanMarkup(!!row.NoStore))
                + kv('<span langtag="word-inletflow"></span>', text(inletFlow))
                + kv('<span langtag="word-exportflow"></span>', text(exportFlow))
                + '</div></section>'
                + '<section class="client-detail__card">'
                + '<h6 class="client-detail__section-title"><i class="fa fa-shield-alt" aria-hidden="true"></i>' + (english ? 'Authentication & access' : '认证与访问') + '</h6>'
                + '<div class="client-detail__grid">'
                + kv(english ? 'List policy' : '名单冲突策略', text(row.IpListPriority === 1 ? (english ? 'Allow first' : '白名单优先') : (english ? 'Deny first' : '黑名单优先'), '-'))
                + kv(english ? 'Registered IPs only' : '仅允许已登记 IP', npsBooleanMarkup(!!row.RegisteredOnly))
                + kv(english ? 'Registration key' : 'IP 登记密钥', credentialStatus(!!row.RegisterKeySet))
                + kv(english ? 'Registration hours' : '登记有效时长', text(row.RegisterMaxHours, 0) + (english ? ' h' : ' 小时'))
                + kv(english ? 'Legacy Web login' : '旧版 Web 登录', text(row.WebUserName, '-') + ' / ' + credentialStatus(!!row.WebPasswordSet))
                + kv(english ? 'Basic auth' : 'Basic 认证', text(row.BasicUserName, '-') + ' / ' + credentialStatus(!!row.BasicPasswordSet))
                + '</div>'
                + chips('<span langtag="word-blackip"></span>', row.BlackIpList)
                + chips('<span langtag="word-whiteip"></span>', row.WhiteIpList)
                + '</section>'
                + '<section class="client-detail__card">'
                + '<h6 class="client-detail__section-title"><i class="fa fa-clock" aria-hidden="true"></i>' + (english ? 'Timestamps' : '时间信息') + '</h6>'
                + '<div class="client-detail__grid">'
                + kv('<span langtag="word-createtime"></span>', text(row.CreateTime, '-'))
                + kv('<span langtag="word-lastonlinetime"></span>', text(row.LastOnlineTime, '-'))
                + kv(english ? 'Client expiry' : '客户端有效期', configuredExpiry)
                + kv(english ? 'Effective expiry' : '实际有效期', effectiveExpiry)
                + '</div></section>'
                + '</div>'
                + section('history', english ? 'Recent connections' : '最近连接记录', (row.ConnectionHistory || []).length
                    ? row.ConnectionHistory.slice().reverse().slice(0, 3).map(function (event) {
                        var state = event.OfflineTime
                            ? '<span class="client-detail__history-state">' + (english ? 'Offline' : '已断开') + '</span>'
                            : '<span class="client-detail__history-state client-detail__history-state--online">' + (english ? 'Online' : '当前在线') + '</span>';
                        return '<div class="client-detail__history-row">'
                            + '<span>' + (english ? 'Connected' : '上线') + '：' + text(event.OnlineTime, '-') + '</span>'
                            + '<span>' + (english ? 'Disconnected' : '断开') + '：' + text(event.OfflineTime, english ? '—' : '尚未记录') + '</span>'
                            + state + '</div>';
                    }).join('')
                    : '<div class="client-detail__history-empty">' + (english ? 'No connection history yet.' : '暂无连接记录。') + '</div>')
                + '</div>';
        },
        //表格的列
        columns: [
            {
                field: 'Id',//域值
                title: '<span langtag="word-id"></span>',//标题
                halign: 'center',
                class: 'client-list__id',
                width: '56px',
                visible: true//false表示不显示
            },
            {
                field: 'Remark',//域值
                title: '<span langtag="word-remark"></span>',//标题
                halign: 'center',
                align: 'center',
                class: 'client-list__remark',
                visible: true,//false表示不显示
                formatter: function(value) {
                    var remark = value || '-';
                    return '<span class="client-remark-cell" title="' + npsEscapeHtml(remark) + '">' + npsEscapeHtml(remark) + '</span>';
                }
            },
            {
                field: 'UserName',
                title: '<span data-i18n-zh="所属用户" data-i18n-en="Assigned user">所属用户</span>',
                halign: 'center',
                align: 'center',
                class: 'client-list__owner',
                width: '156px',
                visible: true,
                formatter: function(value, row) {
                    if (!(Number(row.UserId) > 0)) {
                        return '<span class="client-owner-cell client-owner-cell--empty">' + (npsIsEnglish() ? 'Unassigned' : '未分配') + '</span>';
                    }
                    var userName = value || '-';
                    var remark = String(row.UserRemark || '').trim();
                    var title = userName + (remark && remark !== userName ? ' · ' + remark : '');
                    var remarkLine = remark && remark !== userName
                        ? '<span class="client-owner-cell__remark" title="' + npsEscapeHtml(remark) + '">' + npsEscapeHtml(remark) + '</span>'
                        : '';
                    return '<span class="client-owner-cell" title="' + npsEscapeHtml(title) + '"><span class="client-owner-cell__name">' + npsEscapeHtml(userName) + '</span>' + remarkLine + '</span>';
                }
            },
            {
                field: 'Version',//域值
                title: '<span langtag="word-version"></span>',//标题
                halign: 'center',
                class: 'client-list__version',
                visible: true,
                formatter: function (value, row) {
                    var display = npsEscapeHtml(value || '-');
                    {{if eq true .isAdmin}}
                    return '<button type="button" class="client-version-pill" data-client-id="' + Number(row.Id)
                        + '" data-client-version="' + npsEscapeHtml(value || '') + '"'
                        + ' title="' + (npsIsEnglish() ? 'Check for updates' : '检查更新') + '"'
                        + ' data-title-zh="检查更新" data-title-en="Check for updates"'
                        + ' aria-label="' + (npsIsEnglish() ? 'Check for updates' : '检查更新') + '"'
                        + ' data-aria-label-zh="检查更新" data-aria-label-en="Check for updates">'
                        + display + '<i class="fa fa-chevron-down" aria-hidden="true"></i></button>';
                    {{end}}
                    return display;
                }
            },
            {
                field: 'VerifyKey',//域值
                title: '<span langtag="word-verifykey"></span>',//标题
                halign: 'center',
                class: 'client-list__verify-key',
                // Keep credentials out of the default grid. They remain
                // available in the expanded detail and column picker.
                visible: false,
                formatter: function (value, row, index) {
                    if (!row.NoStore) {
                        return npsEscapeHtml(value)
                    } else {
                        return '<span langtag="word-publicvkey"></span>'
                    }
                }
            },
            {
                field: 'Addr',//域值
                title: '<span langtag="word-address"></span>',//标题
                halign: 'center',
                class: 'client-list__address',
                // Compact desktop keeps both flow columns visible; the
                // address remains available in the column picker and detail.
                visible: !clientListCompact,
                formatter: function(value) {
                    var address = value || '-';
                    return '<span class="client-address-cell" title="' + npsEscapeHtml(address) + '">' + npsEscapeHtml(address) + '</span>';
                }
            },
            {
                field: 'InletFlow',//域值
                title: '<span class="client-flow-heading"><span langtag="word-inletflow-short"></span><small langtag="word-inletflow-direction"></small></span>',//标题
                halign: 'center',
                class: 'client-list__inlet-flow',
                visible: true,
                sortable: true,//启用排序
                formatter: function (value, row, index) {
                    return changeunit((row.Flow || {}).InletFlow)
                }
            },
            {
                field: 'ExportFlow',//域值
                title: '<span class="client-flow-heading"><span langtag="word-exportflow-short"></span><small langtag="word-exportflow-direction"></small></span>',//标题
                halign: 'center',
                class: 'client-list__export-flow',
                visible: true,
                sortable: true,//启用排序
                formatter: function (value, row, index) {
                    return changeunit((row.Flow || {}).ExportFlow)
                }
            },
            {
                field: 'IsConnect',//域值
                title: '<span data-i18n-zh="实时带宽 ↑ / ↓" data-i18n-en="Live bandwidth ↑ / ↓">实时带宽 ↑ / ↓</span>',
                halign: 'center',
                visible: true,//false表示不显示
                formatter: function (value, row, index) {
                    var rate = row.Rate || {};
                    var upload = Number(rate.UploadRate) || 0;
                    var download = Number(rate.DownloadRate) || 0;
                    return '<span class="client-live-rate" data-live-client-id="' + Number(row.Id) + '">'
                        + '<span class="client-live-rate__direction">↑</span><span class="client-live-rate__value" data-live-client-up>' + changeunit(upload) + '/s</span>'
                        + '<span class="client-live-rate__direction">↓</span><span class="client-live-rate__value" data-live-client-down>' + changeunit(download) + '/s</span>'
                        + '</span>';
                }
            },
            {
                field: 'NowConn',
                title: '<span data-i18n-zh="实时连接" data-i18n-en="Live connections">实时连接</span>',
                halign: 'center',
                align: 'center',
                class: 'client-list__connections',
                visible: true,
                formatter: function (value, row) {
                    var limit = Number(row.MaxConn) > 0 ? Number(row.MaxConn) : '∞';
                    return '<span class="live-connections" data-live-client-id="' + Number(row.Id) + '"><span data-live-client-connections>' + npsEscapeHtml(Number(value) || 0) + ' / ' + npsEscapeHtml(limit) + '</span></span>';
                }
            },
            {
                field: 'ExpireTime',
                title: '<span data-i18n-zh="实际有效期" data-i18n-en="Effective expiry">实际有效期</span>',
                halign: 'center',
                class: 'client-list__expire-time',
                visible: !clientListCompact,
                formatter: function (value, row) {
                    return npsEscapeHtml((row && row.EffectiveExpireTime) || clientUnlimitedText());
                }
            },
            {
                field: 'Status',//域值
                title: '<span langtag="word-status"></span>',//内容
                align: 'center',
                halign: 'center',
                visible: true,//false表示不显示
                formatter: function (value, row, index) {
                    if (value) {
                        return '<span class="badge badge-primary" langtag="word-open"></span>'
                    } else {
                        return '<span class="badge badge-badge" langtag="word-close"></span>'
                    }
                }
            },
            {
                field: 'IsConnect',//域值
                title: '<span langtag="word-connect"></span>',//内容
                align: 'center',
                halign: 'center',
                visible: true,//false表示不显示
                formatter: function (value, row, index) {
                    if (value) {
                        var protocol = row.ConnectionProtocol
                            ? '<span class="client-connection-protocol">' + npsEscapeHtml(row.ConnectionProtocol) + '</span>'
                            : '';
                        return '<span class="client-connection-state"><span class="badge badge-primary" langtag="word-online"></span>' + protocol + '</span>'
                    } else {
                        return '<span class="badge badge-badge" langtag="word-offline"></span>'
                    }
                }
            },
            {
                field: 'option',//域值
                title: '<span langtag="word-option"></span>',//内容
                align: 'center',
                halign: 'center',
                class: 'client-list__option',
                width: '140px',
                visible: true,//false表示不显示
                formatter: function (value, row, index) {
                    var clientId = Number(row.Id);
                    if (!isFinite(clientId) || Math.floor(clientId) !== clientId || clientId <= 0) return '';
                    var btn_group = '<div class="client-actions client-actions--manage">'

                    // 操作顺序：停用/启用 → 修改 → 删除；停用/启用仅管理员可用
                    {{if eq true .isAdmin}}
                    if (row.Status) {
                        btn_group += '<button type="button" onclick="submitform(\'stop\', \'{{.web_base_url}}/client/changestatus\', {\'id\':' + clientId
                        btn_group += ', \'status\': 0})" class="btn btn-outline btn-warning" data-title-zh="停用客户端" data-title-en="Disable client" data-aria-label-zh="停用客户端" data-aria-label-en="Disable client"><i class="fa fa-pause" aria-hidden="true"></i></button>'
                    } else {
                        btn_group += '<button type="button" onclick="submitform(\'start\', \'{{.web_base_url}}/client/changestatus\', {\'id\':' + clientId
                        btn_group += ', \'status\': 1})" class="btn btn-outline btn-primary" data-title-zh="启用客户端" data-title-en="Enable client" data-aria-label-zh="启用客户端" data-aria-label-en="Enable client"><i class="fa fa-play" aria-hidden="true"></i></button>'
                    }
                    {{end}}
                    btn_group += '<a href="{{.web_base_url}}/client/edit?id=' + clientId
                    btn_group += '" class="btn btn-outline btn-success client-action-btn" data-title-zh="编辑客户端" data-title-en="Edit client" data-aria-label-zh="编辑客户端" data-aria-label-en="Edit client"><i class="fa fa-edit" aria-hidden="true"></i></a>'
                    btn_group += '<button type="button" onclick="submitform(\'delete\', \'{{.web_base_url}}/client/del\', {\'id\':' + clientId
                    btn_group += '})" class="btn btn-outline btn-danger" data-title-zh="删除客户端" data-title-en="Delete client" data-aria-label-zh="删除客户端" data-aria-label-en="Delete client"><i class="fa fa-trash" aria-hidden="true"></i></button>'
                    btn_group += '</div>'
                    return btn_group
                }
            },
            {
                field: 'show',//域值
                title: '<span langtag="word-show"></span>',//内容
                align: 'center',
                halign: 'center',
                class: 'client-list__view',
                width: '96px',
                visible: true,//false表示不显示
                formatter: function (value, row, index) {
                    var clientId = Number(row.Id);
                    if (!isFinite(clientId) || Math.floor(clientId) !== clientId || clientId <= 0) return '';
                    return '<div class="client-actions client-actions--view">'
                        + '<a href="{{.web_base_url}}/index/all?client_id=' + clientId
                        + '" class="btn btn-outline btn-primary client-action-btn" data-title-zh="查看隧道" data-title-en="View tunnels" data-aria-label-zh="查看隧道" data-aria-label-en="View tunnels"><i class="fa fa-retweet" aria-hidden="true"></i><span class="sr-only" langtag="word-tunnel"></span></a>'
                        + '<a href="{{.web_base_url}}/index/hostlist?client_id=' + clientId
                        + '" class="btn btn-outline btn-success client-action-btn" data-title-zh="查看主机" data-title-en="View hosts" data-aria-label-zh="查看主机" data-aria-label-en="View hosts"><i class="fa fa-globe" aria-hidden="true"></i><span class="sr-only" langtag="word-host"></span></a></div>'
                }
            }
        ]
    });

    $(document).on('click', '.client-detail__protocol-tab', function () {
        var target = String($(this).attr('data-client-protocol-tab') || '');
        if (!target) return;
        var $section = $(this).closest('.client-detail__connection-section');
        $section.find('.client-detail__protocol-tab').removeClass('active').attr('aria-selected', 'false');
        $(this).addClass('active').attr('aria-selected', 'true');
        $section.find('.client-detail__protocol-panel').removeClass('active');
        $section.find('[data-client-protocol-panel="' + target + '"]').addClass('active');
    });

    var clientUpdateState = null;

    function resetClientUpdateModal() {
        var english = npsIsEnglish();
        $('#client-update-current').text('-');
        $('#client-update-latest').html('<span class="client-update-loading"><i class="fa fa-spinner fa-spin" aria-hidden="true"></i><span>' + (english ? 'Checking…' : '检测中…') + '</span></span>');
        $('#client-update-summary').text('').prop('hidden', true);
        $('#client-update-error').text('').prop('hidden', true);
        $('#client-update-send').prop('hidden', true).prop('disabled', false).html(english ? 'Send update' : '下发升级');
    }

    function openClientUpdateModal(clientId, version) {
        var english = npsIsEnglish();
        clientUpdateState = { id: clientId, version: version };
        resetClientUpdateModal();
        $('#client-update-current').text(version || '-');
        $('#client-update-modal').modal('show');
        $.get('{{.web_base_url}}/client/updatecheck', { id: clientId }).done(function (response) {
            if (!response) return;
            if (response.check_error) {
                $('#client-update-latest').html('<span>' + (english ? 'Unavailable' : '不可用') + '</span>');
                $('#client-update-error').text(english
                    ? 'Version check failed: ' + response.check_error
                    : '版本检测失败：' + response.check_error).prop('hidden', false);
                return;
            }
            $('#client-update-latest').text(response.latest || '-');
            if (response.update_available) {
                $('#client-update-summary').html(npsEscapeHtml(english
                    ? 'A newer version is available.'
                    : '检测到新版本。')).prop('hidden', false);
                if (response.can_remote_update && response.enabled && response.online) {
                    $('#client-update-send').prop('hidden', false);
                } else {
                    var reason = !response.can_remote_update
                        ? (english ? 'This client must be updated manually once before remote updates are available.' : '该客户端需先手动升级一次，之后才能远程升级。')
                        : (!response.enabled ? (english ? 'The client is disabled.' : '客户端已停用，请先启用。') : (english ? 'The client is offline.' : '客户端当前离线。'));
                    $('#client-update-error').text(reason).prop('hidden', false);
                }
            } else {
                $('#client-update-summary').html('<span class="client-update-up-to-date"><i class="fa fa-check-circle" aria-hidden="true"></i>' + npsEscapeHtml(english ? 'Already up to date.' : '已是最新版本。') + '</span>').prop('hidden', false);
            }
        }).fail(function (xhr) {
            var message = xhr && xhr.responseJSON && xhr.responseJSON.msg;
            $('#client-update-latest').html('<span>' + (english ? 'Unavailable' : '不可用') + '</span>');
            $('#client-update-error').text(message || npsRequestErrorMessage()).prop('hidden', false);
        });
    }

    $(document).on('click', '.client-version-pill', function () {
        var clientId = Number($(this).attr('data-client-id'));
        var version = $(this).attr('data-client-version') || '';
        openClientUpdateModal(clientId, version);
    });

    $('#client-update-send').on('click', function () {
        if (!clientUpdateState || !clientUpdateState.id) return;
        var english = npsIsEnglish();
        var $button = $(this);
        $button.prop('disabled', true).attr('aria-busy', 'true').html('<i class="fa fa-spinner fa-spin" aria-hidden="true"></i>');
        $.ajax({
            type: 'POST',
            url: '{{.web_base_url}}/client/upgrade',
            data: { id: clientUpdateState.id }
        }).done(function (response) {
            if (response && response.status === 1) {
                $('#client-update-modal').modal('hide');
                npsNotify('success', english
                    ? 'Update request sent. The client restarts after downloading and verifying the release.'
                    : '升级指令已下发，客户端将在下载并校验完成后自动重启。');
                resetClientUpdateModal();
                var $table = $('#table');
                if ($table.data('npsTable')) $table.npsTable('refresh');
            } else {
                $button.prop('disabled', false).removeAttr('aria-busy').html(english ? 'Send update' : '下发升级');
                npsNotify('error', response && response.msg ? response.msg : npsRequestErrorMessage());
            }
        }).fail(function (xhr) {
            $button.prop('disabled', false).removeAttr('aria-busy').html(english ? 'Send update' : '下发升级');
            var message = xhr && xhr.responseJSON && xhr.responseJSON.msg;
            npsNotify('error', message || npsRequestErrorMessage());
        });
    });

    function copyCommand(data) {
        data.setAttribute("data-clipboard-text", data.previousElementSibling ? data.previousElementSibling.textContent : '')
    }

    var clipboard = new ClipboardJS('.copy');
    clipboard.on('success', function (e) {
        npsNotify('success', npsIsEnglish() ? 'Copied' : '复制成功');
        e.clearSelection();
    });

    clipboard.on('error', function (e) {
        npsNotify('error', npsIsEnglish() ? 'Copy failed' : '复制失败');
    });


</script>
