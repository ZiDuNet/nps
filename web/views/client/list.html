<div class="wrapper wrapper-content animated fadeInRight">

    <div class="row">
        <div class="col-lg-12">
            <div class="ibox float-e-margins">
                <div class="ibox-title">
                    <h5 langtag="page-clientlist"></h5>

                    <div class="ibox-tools">
                        <a class="collapse-link">
                            <i class="fa fa-chevron-up"></i>
                        </a>
                        <a class="close-link">
                            <i class="fa fa-times"></i>
                        </a>
                    </div>
                </div>
            <div class="content">
            {{if eq true .isAdmin}}

                <div class="table-responsive">
                    <div id="toolbar">
                        <a href="{{.web_base_url}}/client/add" class="btn btn-primary dim">
                        <i class="fa fa-fw fa-lg fa-plus"></i> <span langtag="word-add"></span></a>
                    </div>
                    <table id="taskList_table" class="table-striped table-hover" data-mobile-responsive="true"></table>
                </div>
            </div>
            {{end}}
                <div class="ibox-content">

                    <table id="table"></table>

                </div>
            </div>
        </div>
    </div>
</div>

<script>
    /*bootstrap table*/
    $('#table').bootstrapTable({
        toolbar: "#toolbar",
        method: 'post', // 服务器数据的请求方式 get or post
        url: "{{.web_base_url}}/client/list", // 服务器数据的加载地址
        contentType: "application/x-www-form-urlencoded",
        striped: true, // 设置为true会有隔行变色效果
        search: true,
        showHeader: true,
        showColumns: true,
        showRefresh: true,
        pagination: true,//分页
        sidePagination: 'server',//服务器端分页
        pageNumber: 1,
        pageList: [5, 10, 20, 50],//分页步进值
        detailView: true,
        smartDisplay: true, // 智能显示 pagination 和 cardview 等
        onExpandRow: function () {$('body').setLang ('.detail-view');},
        onPostBody: function (data) { if ($(this)[0].locale != undefined ) $('body').setLang ('#table'); },
        detailFormatter: function (index, row, element) {
            var expireDisplay = row.ExpireTime || '<span langtag="info-unrestricted"></span>';
            var kv = function(label, value) {
                return '<div style="display:inline-block;width:33%;padding:3px 0;font-size:13px;line-height:1.8">'
                    + '<span style="color:var(--c-text-secondary)">' + label + '</span>'
                    + '<span style="color:var(--c-text);margin-left:6px;font-weight:500">' + value + '</span></div>';
            };
            var section = function(icon, title, content) {
                return '<div style="margin-bottom:12px">'
                    + '<div style="font-size:11px;font-weight:600;color:var(--c-accent);padding-bottom:6px;border-bottom:1px solid var(--c-border);margin-bottom:8px;text-transform:uppercase;letter-spacing:0.5px">'
                    + '<i class="fa fa-' + icon + '" style="margin-right:6px"></i>' + title + '</div>'
                    + '<div style="display:flex;flex-wrap:wrap">' + content + '</div></div>';
            };
            var cmdRow = function(label, code) {
                return '<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap">'
                    + '<span style="color:var(--c-text-secondary);font-size:13px;white-space:nowrap;min-width:80px">' + label + '</span>'
                    + '<code style="flex:1;font-size:12px;padding:3px 8px;background:var(--c-accent-light);color:var(--c-accent);border-radius:4px;word-break:break-all;min-width:0">' + code + '</code>'
                    + '<button class="copy btn btn-outline btn-primary btn-xs" onclick="copyCommand(this)" data-clipboard-text="" style="flex-shrink:0">复制</button></div>';
            };
            return '<div style="padding:6px 8px">'
                + section('sliders-h', '基础配置',
                    kv('<span langtag="word-maxconnections"></span>', row.MaxConn)
                    + kv('<span langtag="word-curconnections"></span>', row.NowConn)
                    + kv('<span langtag="word-flowlimit"></span>', row.Flow.FlowLimit + ' M')
                    + kv('<span langtag="word-ratelimit"></span>', row.RateLimit + ' KB/s')
                    + kv('<span langtag="word-maxtunnels"></span>', row.MaxTunnelNum)
                    + kv('<span langtag="word-connectbyconfig"></span>', '<span langtag="word-' + row.ConfigConnAllow + '"></span>'))
                + '<div style="display:flex;gap:20px;flex-wrap:wrap">'
                + '<div style="flex:1;min-width:280px">'
                + section('key', '认证信息',
                    kv('<span langtag="word-webusername"></span>', row.WebUserName || '-')
                    + kv('<span langtag="word-webpassword"></span>', row.WebPassword || '-')
                    + kv('<span langtag="word-basicusername"></span>', row.Cnf.U || '-')
                    + kv('<span langtag="word-basicpassword"></span>', row.Cnf.P || '-'))
                + '</div>'
                + '<div style="flex:1;min-width:280px">'
                + section('shield-alt', '访问控制',
                    kv('<span langtag="word-ipwhite"></span>', row.IpWhite)
                    + kv('<span langtag="word-ipwhitepass"></span>', row.IpWhitePass || '-'))
                + '<div style="font-size:13px;padding:2px 0;color:var(--c-text-secondary)"><span langtag="word-ipwhitelist"></span>: <span style="color:var(--c-text)">' + (row.IpWhiteList || '-') + '</span></div>'
                + '<div style="font-size:13px;padding:2px 0;color:var(--c-text-secondary)"><span langtag="word-blackip"></span>: <span style="color:var(--c-text)">' + (row.BlackIpList || '-') + '</span></div>'
                + '</div></div>'
                + section('clock', '时间信息',
                    kv('<span langtag="word-createtime"></span>', row.CreateTime)
                    + kv('<span langtag="word-lastonlinetime"></span>', row.LastOnlineTime || '-')
                    + kv('<span langtag="word-expiretime"></span>', expireDisplay))
                + section('terminal', '连接命令',
                    cmdRow('<span langtag="word-quicklycommand"></span>', encodeToBase64(row.Remark + '|{{.ip}}:{{.p}}|' + row.VerifyKey + '|false'))
                    + cmdRow('<span langtag="word-tlsquicklycommand"></span>', encodeToBase64(row.Remark + '|{{.ip}}:{{.tls_p}}|' + row.VerifyKey + '|true'))
                    + cmdRow('<span langtag="word-commandclient"></span>', '{{.win}} -server={{.ip}}:{{.p}} -vkey=' + row.VerifyKey + ' -type=' + {{.bridgeType}})
                    + cmdRow('<span langtag="word-commandclient-tls"></span>', '{{.win}} -server={{.ip}}:{{.tls_p}} -vkey=' + row.VerifyKey + ' -tls_enable=true'))
                + '</div>';
        },
        //表格的列
        columns: [
            {
                field: 'Id',//域值
                title: '<span langtag="word-id"></span>',//标题
                halign: 'center',
                visible: true//false表示不显示
            },
            {
                field: 'Remark',//域值
                title: '<span langtag="word-remark"></span>',//标题
                halign: 'center',
                visible: true//false表示不显示
            },
            {
                field: 'UserName',
                title: '所属用户',
                halign: 'center',
                visible: true,
                formatter: function(value) {
                    return value || '-'
                }
            },
            {
                field: 'Version',//域值
                title: '<span langtag="word-version"></span>',//标题
                halign: 'center',
                visible: true//false表示不显示
            },
            {
                field: 'VerifyKey',//域值
                title: '<span langtag="word-verifykey"></span>',//标题
                halign: 'center',
                visible: true,//false表示不显示
                formatter: function (value, row, index) {
                    if (!row.NoStore) {
                        return value
                    } else {
                        return '<span langtag="word-publicvkey"></span>'
                    }
                }
            },
            {
                field: 'Addr',//域值
                title: '<span langtag="word-address"></span>',//标题
                halign: 'center',
                visible: true//false表示不显示
            },
            {
                field: 'InletFlow',//域值
                title: '<span langtag="word-inletflow"></span>',//标题
                halign: 'center',
                visible: true,//false表示不显示
                sortable: true,//启用排序
                formatter: function (value, row, index) {
                    return changeunit(row.Flow.InletFlow)
                }
            },
            {
                field: 'ExportFlow',//域值
                title: '<span langtag="word-exportflow"></span>',//标题
                halign: 'center',
                visible: true,//false表示不显示
                sortable: true,//启用排序
                formatter: function (value, row, index) {
                    return changeunit(row.Flow.ExportFlow)
                }
            },
            {
                field: 'IsConnect',//域值
                title: '<span langtag="word-speed"></span>',//内容
                halign: 'center',
                visible: true,//false表示不显示
                formatter: function (value, row, index) {
                    var nowRate = (row.Rate && row.Rate.NowRate) ? row.Rate.NowRate : 0;
                    return changeunit(nowRate) + "/S"
                }
            },
            {
                field: 'Status',//域值
                title: '<span langtag="word-status"></span>',//内容
                align: 'center',
                halign: 'center',
                visible: true,//false表示不显示
                formatter: function (value, row, index) {
                    if (value) {
                        return '<span class="badge badge-primary" langtag="word-open"></span>'
                    } else {
                        return '<span class="badge badge-badge" langtag="word-close"></span>'
                    }
                }
            },
            {
                field: 'IsConnect',//域值
                title: '<span langtag="word-connect"></span>',//内容
                align: 'center',
                halign: 'center',
                visible: true,//false表示不显示
                formatter: function (value, row, index) {
                    if (value) {
                        return '<span class="badge badge-primary" langtag="word-online"></span>'
                    } else {
                        return '<span class="badge badge-badge" langtag="word-offline"></span>'
                    }
                }
            },
            {
                field: 'option',//域值
                title: '<span langtag="word-option"></span>',//内容
                align: 'center',
                halign: 'center',
                visible: true,//false表示不显示
                formatter: function (value, row, index) {
                    btn_group = '<div class="btn-group">'

                    {{if eq true .isAdmin}}
                    if (row.Status) {
                        btn_group += '<a onclick="submitform(\'stop\', \'{{.web_base_url}}/client/changestatus\', {\'id\':' + row.Id
                        btn_group += ', \'status\': 0})" class="btn btn-outline btn-warning"><i class="fa fa-pause"></i></a>'
                    } else {
                        btn_group += '<a onclick="submitform(\'start\', \'{{.web_base_url}}/client/changestatus\', {\'id\':' + row.Id
                        btn_group += ', \'status\': 1})" class="btn btn-outline btn-primary"><i class="fa fa-play"></i></a>'
                    }
                    btn_group += '<a onclick="submitform(\'delete\', \'{{.web_base_url}}/client/del\', {\'id\':' + row.Id
                    btn_group += '})" class="btn btn-outline btn-danger"><i class="fa fa-trash"></i></a>'
                    {{end}}

                    btn_group += '<a href="{{.web_base_url}}/client/edit?id=' + row.Id
                    btn_group += '" class="btn btn-outline btn-success"><i class="fa fa-edit"></i></a></div>'
                    return btn_group
                }
            },
            {
                field: 'show',//域值
                title: '<span langtag="word-show">',//内容
                align: 'center',
                halign: 'center',
                visible: true,//false表示不显示
                formatter: function (value, row, index) {
                    return '<div class="btn-group"><a href="{{.web_base_url}}/index/all?client_id=' + row.Id
                        + '" class="btn btn-outline btn-primary" langtag="word-tunnel"></a>'
                        + '<a href="{{.web_base_url}}/index/hostlist?client_id=' + row.Id
                        + '" class="btn btn-outline btn-success" langtag="word-host"></a></div>'
                }
            }
        ]
    });

    function encodeToBase64(str){
        const utf8Str = unescape(encodeURIComponent("nps:"+str));
        return btoa(utf8Str);
    }

    function copyCommand(data) {
        data.setAttribute("data-clipboard-text", data.previousElementSibling.innerHTML)
    }

    var clipboard = new ClipboardJS('.copy');
    clipboard.on('success', function (e) {
        // alert("复制成功"+e.text)
        toastr.success('复制成功');
        e.clearSelection();
    });

    clipboard.on('error', function (e) {
        // alert("复制失败")
        toastr.error('复制失败', '提示');
    });


</script>
