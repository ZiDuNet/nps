<section class="wrapper wrapper-content animated fadeInRight management-page management-page--client" aria-labelledby="client-list-title">
    <header class="dashboard-page-header management-page-header">
        <div>
            <div class="dashboard-page-kicker" data-i18n-zh="客户端管理" data-i18n-en="Client management">客户端管理</div>
            <h1 id="client-list-title" langtag="page-clientlist"></h1>
            <p data-i18n-zh="管理客户端、访问凭证与连接状态。" data-i18n-en="Manage clients, access credentials, and connection status.">管理客户端、访问凭证与连接状态。</p>
        </div>
    </header>
    <div class="management-page-grid">
        <div class="management-page-column">
            <section class="panel ibox float-e-margins management-table-card zui-panel">
                <div class="ibox-content management-table-content">
                    <div id="toolbar" class="management-table-toolbar">
                        <a href="{{.web_base_url}}/client/add" class="btn btn-primary dim">
                            <i class="fa fa-fw fa-lg fa-plus"></i> <span langtag="word-add"></span>
                        </a>
                        {{if .accountQuota.Visible}}
                        <span class="client-list-quota" role="status">
                            <i class="fa fa-desktop" aria-hidden="true"></i>
                            <span data-i18n-zh="客户端" data-i18n-en="Clients">客户端</span>
                            <strong>{{.accountQuota.ClientUsed}} / {{if .accountQuota.ClientLimit}}{{.accountQuota.ClientLimit}}{{else}}<span data-i18n-zh="不限" data-i18n-en="Unlimited">不限</span>{{end}}</strong>
                        </span>
                        {{end}}
                        {{if eq true .isAdmin}}
                        <label class="nps-table-filter" for="client-owner-filter">
                            <span class="nps-table-filter__label" data-i18n-zh="所属用户" data-i18n-en="Owner">所属用户</span>
                            <select id="client-owner-filter" class="form-control nps-table-filter__control" data-nps-table-filter="user_id">
                                <option value="" data-i18n-zh="全部用户" data-i18n-en="All users">全部用户</option>
                                <option value="0" data-i18n-zh="未分配" data-i18n-en="Unassigned">未分配</option>
                                {{range .users}}
                                <option value="{{.Id}}">{{.Id}} · {{.UserName}}</option>
                                {{end}}
                            </select>
                        </label>
                        {{end}}
                    </div>
                    <table id="table"></table>
                </div>
            </section>
        </div>
    </div>
</section>

<script>
    /* ZUI-compatible remote table */
    var clientListCompact = window.matchMedia && window.matchMedia('(min-width: 992px) and (max-width: 1599px)').matches;

    function clientUnlimitedText() {
        return npsIsEnglish() ? 'Unlimited' : '永不过期';
    }

    $('#table').npsTable({
        toolbar: "#toolbar",
        method: 'post', // 服务器数据的请求方式 get or post
        url: "{{.web_base_url}}/client/list", // 服务器数据的加载地址
        contentType: "application/x-www-form-urlencoded",
        striped: true, // 设置为true会有隔行变色效果
        search: true,
        showHeader: true,
        showColumns: true,
        showRefresh: true,
        pagination: true,//分页
        sidePagination: 'server',//服务器端分页
        pageNumber: 1,
        pageList: [5, 10, 20, 50],//分页步进值
        // v3 keeps the action column visible even when an older browser
        // preference hid the version column (where the update action used to
        // live).  Existing preferences are intentionally not reused so the
        // remote-update action cannot disappear after an upgrade.
        storageKey: 'client-v3',
        detailView: true,
        smartDisplay: true, // 智能显示 pagination 和 cardview 等
        formatLoadingMessage: function () { return npsTableState('client', true); },
        formatNoMatches: function () { return npsTableState('client', false); },
        onExpandRow: function () {
            $('body').setLang('.detail-view');
            npsDecorateDetailControls('#table');
        },
        onCollapseRow: function () { window.setTimeout(function () { npsDecorateDetailControls('#table'); }, 0); },
        onPostBody: function (data) {
            $('body').setLang('#table');
            npsApplyTableState(this, 'client');
        },
        detailFormatter: function (index, row, element) {
            var english = npsIsEnglish();
            var flow = row.Flow || {};
            var text = function (value, fallback) {
                if (value == null || value === '') value = fallback == null ? '' : fallback;
                return npsEscapeHtml(value);
            };
            var listText = function (value) {
                if (!value || !value.length) return '-';
                return text(Array.isArray(value) ? value.join(', ') : value);
            };
            var credentialStatus = function (configured) {
                return configured ? (english ? 'Configured' : '已设置') : (english ? 'Not set' : '未设置');
            };
            var configuredExpiry = row.ExpireTime
                ? text(row.ExpireTime)
                : (Number(row.UserId) > 0 ? (english ? 'Follow user' : '跟随所属用户') : text(clientUnlimitedText()));
            var effectiveExpiry = row.EffectiveExpireTime
                ? text(row.EffectiveExpireTime)
                : text(clientUnlimitedText());
            var inletFlow = changeunit(flow.InletFlow || 0);
            var exportFlow = changeunit(flow.ExportFlow || 0);
            var kv = function(label, value) {
                return '<div class="client-detail__item">'
                    + '<span class="client-detail__label">' + label + '</span>'
                    + '<span class="client-detail__value">' + value + '</span></div>';
            };
            var section = function(icon, title, content) {
                return '<section class="client-detail__section">'
                    + '<h6 class="client-detail__section-title"><i class="fa fa-' + icon + '" aria-hidden="true"></i>' + title + '</h6>'
                    + '<div class="client-detail__grid">' + content + '</div></section>';
            };
            var cmdRow = function(label, code) {
                return '<div class="client-detail__command">'
                    + '<span class="client-detail__command-label">' + label + '</span>'
                    + '<code>' + text(code) + '</code>'
                    + '<button type="button" class="copy btn btn-outline btn-primary btn-xs client-detail__copy" onclick="copyCommand(this)" data-clipboard-text="" data-title-zh="复制命令" data-title-en="Copy command" data-aria-label-zh="复制命令" data-aria-label-en="Copy command"><i class="fa fa-copy" aria-hidden="true"></i></button></div>';
            };
            return '<div class="client-detail">'
                + section('sliders-h', english ? 'Connection' : '基础配置',
                    kv('<span langtag="word-maxconnections"></span>', text(row.MaxConn))
                    + kv('<span langtag="word-curconnections"></span>', text(row.NowConn))
                    + kv('<span langtag="word-flowlimit"></span>', text(flow.FlowLimit, 0) + ' M')
                    + kv('<span langtag="word-ratelimit"></span>', text(row.RateLimit, 0) + ' KB/s')
                    + kv('<span langtag="word-maxtunnels"></span>', text(row.MaxTunnelNum, 0))
                    + kv('<span langtag="word-connectbyconfig"></span>', npsBooleanMarkup(!!row.ConfigConnAllow)))
                + section('info-circle', english ? 'Client details' : '客户端信息',
                    kv('<span langtag="word-version"></span>', text(row.Version, '-'))
                    + kv('<span langtag="word-verifykey"></span>', text(row.VerifyKey, '-'))
                    + kv('<span langtag="word-address"></span>', text(row.Addr, '-'))
                    + kv('<span langtag="word-inletflow"></span>', text(inletFlow))
                    + kv('<span langtag="word-exportflow"></span>', text(exportFlow)))
                + '<div class="client-detail__columns">'
                + '<div class="client-detail__column">'
                + section('key', english ? 'Authentication' : '认证信息',
                    kv('<span langtag="word-webusername"></span>', text(row.WebUserName, '-'))
                    + kv('<span langtag="word-webpassword"></span>', credentialStatus(!!row.WebPasswordSet))
                    + kv('<span langtag="word-basicusername"></span>', text(row.BasicUserName, '-'))
                    + kv('<span langtag="word-basicpassword"></span>', credentialStatus(!!row.BasicPasswordSet)))
                + '</div>'
                + '<div class="client-detail__column">'
                + section('shield-alt', english ? 'Access control' : '访问控制',
                    kv('<span langtag="word-ipwhite"></span>', npsBooleanMarkup(!!row.IpWhite)))
                + '<p class="client-detail__line"><span langtag="word-ipwhitelist"></span>: <span>' + listText(row.IpWhiteList) + '</span></p>'
                + '<p class="client-detail__line"><span langtag="word-blackip"></span>: <span>' + listText(row.BlackIpList) + '</span></p>'
                + '</div></div>'
                + section('clock', english ? 'Timestamps' : '时间信息',
                    kv('<span langtag="word-createtime"></span>', text(row.CreateTime, '-'))
                    + kv('<span langtag="word-lastonlinetime"></span>', text(row.LastOnlineTime, '-'))
                    + kv(english ? 'Client expiry' : '客户端有效期', configuredExpiry)
                    + kv(english ? 'Effective expiry' : '实际有效期', effectiveExpiry))
                + section('terminal', english ? 'Connection commands' : '连接命令',
                    cmdRow('<span langtag="word-quicklycommand"></span>', encodeToBase64((row.Remark || '') + '|{{.ip}}:{{.p}}|' + (row.VerifyKey || '') + '|false'))
                    + cmdRow('<span langtag="word-tlsquicklycommand"></span>', encodeToBase64((row.Remark || '') + '|{{.ip}}:{{.tls_p}}|' + (row.VerifyKey || '') + '|true'))
                    + cmdRow('<span langtag="word-commandclient"></span>', '{{.win}} -server={{.ip}}:{{.p}} -vkey=' + (row.VerifyKey || '') + ' -type={{.bridgeType}}')
                    + cmdRow('<span langtag="word-commandclient-tls"></span>', '{{.win}} -server={{.ip}}:{{.tls_p}} -vkey=' + (row.VerifyKey || '') + ' -tls_enable=true'))
                + '</div>';
        },
        //表格的列
        columns: [
            {
                field: 'Id',//域值
                title: '<span langtag="word-id"></span>',//标题
                halign: 'center',
                class: 'client-list__id',
                width: '56px',
                visible: true//false表示不显示
            },
            {
                field: 'Remark',//域值
                title: '<span langtag="word-remark"></span>',//标题
                halign: 'center',
                visible: true,//false表示不显示
                escape: true
            },
            {
                field: 'UserName',
                title: '<span data-i18n-zh="所属用户" data-i18n-en="Assigned user">所属用户</span>',
                halign: 'center',
                visible: true,
                formatter: function(value) {
                    return npsEscapeHtml(value || '-')
                }
            },
            {
                field: 'Version',//域值
                title: '<span langtag="word-version"></span>',//标题
                halign: 'center',
                class: 'client-list__version',
                visible: !clientListCompact,//较窄桌面中在详情行保留，避免表头拥挤
                formatter: function (value, row) {
                    return npsEscapeHtml(value || '-');
                }
            },
            {
                field: 'VerifyKey',//域值
                title: '<span langtag="word-verifykey"></span>',//标题
                halign: 'center',
                class: 'client-list__verify-key',
                // Keep credentials out of the default grid. They remain
                // available in the expanded detail and column picker.
                visible: false,
                formatter: function (value, row, index) {
                    if (!row.NoStore) {
                        return npsEscapeHtml(value)
                    } else {
                        return '<span langtag="word-publicvkey"></span>'
                    }
                }
            },
            {
                field: 'Addr',//域值
                title: '<span langtag="word-address"></span>',//标题
                halign: 'center',
                visible: true,//false表示不显示
                escape: true
            },
            {
                field: 'InletFlow',//域值
                title: '<span langtag="word-inletflow"></span>',//标题
                halign: 'center',
                class: 'client-list__inlet-flow',
                visible: !clientListCompact,//较窄桌面中在详情行保留，避免表头拥挤
                sortable: true,//启用排序
                formatter: function (value, row, index) {
                    return changeunit((row.Flow || {}).InletFlow)
                }
            },
            {
                field: 'ExportFlow',//域值
                title: '<span langtag="word-exportflow"></span>',//标题
                halign: 'center',
                class: 'client-list__export-flow',
                visible: !clientListCompact,//较窄桌面中在详情行保留，避免表头拥挤
                sortable: true,//启用排序
                formatter: function (value, row, index) {
                    return changeunit((row.Flow || {}).ExportFlow)
                }
            },
            {
                field: 'IsConnect',//域值
                title: '<span langtag="word-speed"></span>',//内容
                halign: 'center',
                visible: true,//false表示不显示
                formatter: function (value, row, index) {
                    var nowRate = (row.Rate && row.Rate.NowRate) ? row.Rate.NowRate : 0;
                    return changeunit(nowRate) + "/S"
                }
            },
            {
                field: 'ExpireTime',
                title: '<span data-i18n-zh="实际有效期" data-i18n-en="Effective expiry">实际有效期</span>',
                halign: 'center',
                class: 'client-list__expire-time',
                visible: !clientListCompact,
                formatter: function (value, row) {
                    return npsEscapeHtml((row && row.EffectiveExpireTime) || clientUnlimitedText());
                }
            },
            {
                field: 'Status',//域值
                title: '<span langtag="word-status"></span>',//内容
                align: 'center',
                halign: 'center',
                visible: true,//false表示不显示
                formatter: function (value, row, index) {
                    if (value) {
                        return '<span class="badge badge-primary" langtag="word-open"></span>'
                    } else {
                        return '<span class="badge badge-badge" langtag="word-close"></span>'
                    }
                }
            },
            {
                field: 'IsConnect',//域值
                title: '<span langtag="word-connect"></span>',//内容
                align: 'center',
                halign: 'center',
                visible: true,//false表示不显示
                formatter: function (value, row, index) {
                    if (value) {
                        return '<span class="badge badge-primary" langtag="word-online"></span>'
                    } else {
                        return '<span class="badge badge-badge" langtag="word-offline"></span>'
                    }
                }
            },
            {
                field: 'option',//域值
                title: '<span langtag="word-option"></span>',//内容
                align: 'center',
                halign: 'center',
                class: 'client-list__option',
                width: '168px',
                visible: true,//false表示不显示
                formatter: function (value, row, index) {
                    var clientId = Number(row.Id);
                    if (!isFinite(clientId) || Math.floor(clientId) !== clientId || clientId <= 0) return '';
                    var btn_group = '<div class="client-actions client-actions--manage">'

                    {{if eq true .isAdmin}}
                    // Keep the remote-update action in the always-visible
                    // management column.  The version column is responsive
                    // and may be hidden on compact screens or by a saved
                    // column preference, which previously made this action
                    // impossible to discover.
                    var supported = row.CanRemoteUpdate === true;
                    var online = row.IsConnect === true && row.Status === true && row.NoStore !== true;
                    var disabled = !supported || !online;
                    var titleZh = !supported
                        ? '请先手动升级到 v{{.client_update_min_version}}，之后可远程升级'
                        : (!online ? '客户端启用并在线后才能升级' : '下发客户端升级');
                    var titleEn = !supported
                        ? 'Manually update once to v{{.client_update_min_version}} to enable remote updates'
                        : (!online ? 'Client must be enabled and online' : 'Send client update');
                    var title = npsIsEnglish() ? titleEn : titleZh;
                    btn_group += '<button type="button" class="btn btn-outline btn-primary client-version-update"'
                        + (disabled ? ' disabled' : '')
                        + ' onclick="requestClientUpgrade(this,' + clientId + ')"'
                        + ' title="' + npsEscapeHtml(title) + '" data-title-zh="' + npsEscapeHtml(titleZh) + '"'
                        + ' aria-label="' + npsEscapeHtml(title) + '" data-aria-label-zh="' + npsEscapeHtml(titleZh) + '"'
                        + ' data-title-en="' + npsEscapeHtml(titleEn) + '"'
                        + ' data-aria-label-en="' + npsEscapeHtml(titleEn) + '">'
                        + '<i class="fa fa-cloud-download" aria-hidden="true"></i></button>';
                    if (row.Status) {
                        btn_group += '<button type="button" onclick="submitform(\'stop\', \'{{.web_base_url}}/client/changestatus\', {\'id\':' + clientId
                        btn_group += ', \'status\': 0})" class="btn btn-outline btn-warning" data-title-zh="停用客户端" data-title-en="Disable client" data-aria-label-zh="停用客户端" data-aria-label-en="Disable client"><i class="fa fa-pause" aria-hidden="true"></i></button>'
                    } else {
                        btn_group += '<button type="button" onclick="submitform(\'start\', \'{{.web_base_url}}/client/changestatus\', {\'id\':' + clientId
                        btn_group += ', \'status\': 1})" class="btn btn-outline btn-primary" data-title-zh="启用客户端" data-title-en="Enable client" data-aria-label-zh="启用客户端" data-aria-label-en="Enable client"><i class="fa fa-play" aria-hidden="true"></i></button>'
                    }
                    btn_group += '<button type="button" onclick="submitform(\'delete\', \'{{.web_base_url}}/client/del\', {\'id\':' + clientId
                    btn_group += '})" class="btn btn-outline btn-danger" data-title-zh="删除客户端" data-title-en="Delete client" data-aria-label-zh="删除客户端" data-aria-label-en="Delete client"><i class="fa fa-trash" aria-hidden="true"></i></button>'
                    {{else}}
                    btn_group += '<button type="button" onclick="submitform(\'delete\', \'{{.web_base_url}}/client/del\', {\'id\':' + clientId
                    btn_group += '})" class="btn btn-outline btn-danger" data-title-zh="删除我的客户端" data-title-en="Delete my client" data-aria-label-zh="删除我的客户端" data-aria-label-en="Delete my client"><i class="fa fa-trash" aria-hidden="true"></i></button>'
                    {{end}}

                    btn_group += '<a href="{{.web_base_url}}/client/edit?id=' + clientId
                    btn_group += '" class="btn btn-outline btn-success client-action-btn" data-title-zh="编辑客户端" data-title-en="Edit client" data-aria-label-zh="编辑客户端" data-aria-label-en="Edit client"><i class="fa fa-edit" aria-hidden="true"></i></a></div>'
                    return btn_group
                }
            },
            {
                field: 'show',//域值
                title: '<span langtag="word-show"></span>',//内容
                align: 'center',
                halign: 'center',
                class: 'client-list__view',
                width: '96px',
                visible: true,//false表示不显示
                formatter: function (value, row, index) {
                    var clientId = Number(row.Id);
                    if (!isFinite(clientId) || Math.floor(clientId) !== clientId || clientId <= 0) return '';
                    return '<div class="client-actions client-actions--view">'
                        + '<a href="{{.web_base_url}}/index/all?client_id=' + clientId
                        + '" class="btn btn-outline btn-primary client-action-btn" data-title-zh="查看隧道" data-title-en="View tunnels" data-aria-label-zh="查看隧道" data-aria-label-en="View tunnels"><i class="fa fa-retweet" aria-hidden="true"></i><span class="sr-only" langtag="word-tunnel"></span></a>'
                        + '<a href="{{.web_base_url}}/index/hostlist?client_id=' + clientId
                        + '" class="btn btn-outline btn-success client-action-btn" data-title-zh="查看主机" data-title-en="View hosts" data-aria-label-zh="查看主机" data-aria-label-en="View hosts"><i class="fa fa-globe" aria-hidden="true"></i><span class="sr-only" langtag="word-host"></span></a></div>'
                }
            }
        ]
    });

    function encodeToBase64(str){
        const utf8Str = unescape(encodeURIComponent("nps:"+str));
        return btoa(utf8Str);
    }

    function copyCommand(data) {
        data.setAttribute("data-clipboard-text", data.previousElementSibling ? data.previousElementSibling.textContent : '')
    }

    function requestClientUpgrade(button, clientId) {
        var english = npsIsEnglish();
        var question = english
            ? 'Send an update request? The client will download and verify the latest GitHub release, then restart. Tunnels may briefly disconnect.'
            : '确定下发升级指令吗？客户端会下载并校验 GitHub 最新版本，随后自动重启，隧道可能短暂中断。';
        if (!button || !clientId || !window.confirm(question)) return;

        var $button = $(button);
        var originalMarkup = $button.html();
        $button.prop('disabled', true).attr('aria-busy', 'true');
        $button.html('<i class="fa fa-spinner fa-spin" aria-hidden="true"></i>');
        $.ajax({
            type: 'POST',
            url: '{{.web_base_url}}/client/upgrade',
            data: { id: clientId }
        }).done(function (response) {
            if (response && response.status === 1) {
                var sentLabel = english ? 'Update request sent' : '升级指令已下发';
                $button.html('<i class="fa fa-check" aria-hidden="true"></i>')
                    .attr('title', sentLabel).attr('aria-label', sentLabel).removeAttr('aria-busy');
                npsNotify('success', english
                    ? 'Update request sent. The client restarts after downloading and verifying the release.'
                    : '升级指令已下发，客户端将在下载并校验完成后自动重启。');
            } else {
                $button.html(originalMarkup).prop('disabled', false).removeAttr('aria-busy');
                npsNotify('error', response && response.msg ? response.msg : npsRequestErrorMessage());
            }
        }).fail(function (xhr) {
            $button.html(originalMarkup).prop('disabled', false).removeAttr('aria-busy');
            var message = xhr && xhr.responseJSON && xhr.responseJSON.msg;
            npsNotify('error', message || npsRequestErrorMessage());
        });
    }

    var clipboard = new ClipboardJS('.copy');
    clipboard.on('success', function (e) {
        npsNotify('success', npsIsEnglish() ? 'Copied' : '复制成功');
        e.clearSelection();
    });

    clipboard.on('error', function (e) {
        npsNotify('error', npsIsEnglish() ? 'Copy failed' : '复制失败');
    });


</script>
