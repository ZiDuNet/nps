name: Release

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: '要发布的 Git 标签，例如 v1.1.3；必须与源码版本一致'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GUI_DIR: cmd/npc/npc-gui
  FRONTEND_DIR: cmd/npc/npc-gui/frontend
  WAILS_VERSION: v3.0.0-beta.12
  APP_NAME: npc-gui

jobs:

  # ==================== 跨平台服务端/客户端打包 ====================
  build_assets:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Get dependencies
        run: |
          go get -v -t -d ./...
          if [ -f Gopkg.toml ]; then
              curl https://raw.githubusercontent.com/golang/dep/master/install.sh | sh
              dep ensure
          fi
      - name: Build
        run: |
          chmod +x build.assets.sh
          ./build.assets.sh
      - name: Upload cross-platform CLI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cli-assets
          path: |
            *_client.tar.gz
            *_server.tar.gz
            npc_sdk.tar.gz
          if-no-files-found: error
          retention-days: 14

  # ==================== Android APK ====================
  build_android:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Build
        run: |
          chmod +x build.android.sh
          docker run --rm -i -w /app -v $(pwd):/app -e ANDROID_HOME=/usr/local/android_sdk -e GOPROXY=direct fyneio/fyne-cross:android-latest /app/build.android.sh
          ls -la android_client.apk
      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-client
          path: android_client.apk
          if-no-files-found: error
          retention-days: 14

  # ==================== Docker 镜像 ====================
  build_docker:
    if: github.ref == 'refs/heads/master' || github.ref_type == 'tag' || inputs.release_tag != ''
    runs-on: ubuntu-latest
    env:
      DOCKER_BUILD_RECORD_UPLOAD: false
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set Docker tags
        env:
          RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
        run: |
          source_version="$(sed -nE 's/^const VERSION = "([^"]+)"$/\1/p' lib/version/version.go)"
          if [ -z "$source_version" ]; then
            echo "Unable to read lib/version.VERSION"
            exit 1
          fi
          release_tag="${RELEASE_TAG_INPUT:-}"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            release_tag="$GITHUB_REF_NAME"
          fi
          if [ -n "$release_tag" ]; then
            expected_tag="v${source_version}"
            if [ "$release_tag" != "$expected_tag" ]; then
              echo "Release tag $release_tag does not match $expected_tag"
              exit 1
            fi
            release_version="$source_version"
          else
            release_version="sha-${GITHUB_SHA::7}"
          fi
          printf 'RELEASE_VERSION=%s\n' "$release_version" >> "$GITHUB_ENV"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push nps
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.nps
          platforms: linux/amd64,linux/arm/v7,linux/arm64
          push: true
          build-args: |
            GOPROXY=https://proxy.golang.org,direct
          cache-from: type=gha,scope=nps
          cache-to: type=gha,mode=max,scope=nps
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/nps:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/nps:${{ env.RELEASE_VERSION }}
      - name: Build and push npc
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.npc
          platforms: linux/amd64,linux/arm/v7,linux/arm64
          push: true
          build-args: |
            GOPROXY=https://proxy.golang.org,direct
          cache-from: type=gha,scope=npc
          cache-to: type=gha,mode=max,scope=npc
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/npc:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/npc:${{ env.RELEASE_VERSION }}
      - name: Update Docker Hub description for nps
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/nps
          readme-filepath: ./docker/DOCKERHUB_NPS.md
      - name: Update Docker Hub description for npc
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/npc
          readme-filepath: ./docker/DOCKERHUB_NPC.md

  # ==================== Windows GUI ====================
  build_windows_gui:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows/386
            os_name: windows
            arch: 386
          - platform: windows/amd64
            os_name: windows
            arch: amd64
          - platform: windows/arm64
            os_name: windows
            arch: arm64
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn
          cache-dependency-path: ${{ env.FRONTEND_DIR }}/yarn.lock
      - name: Enable Yarn (corepack)
        run: corepack enable
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ${{ env.GUI_DIR }}/go.mod
          check-latest: true
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}
        working-directory: ${{ env.GUI_DIR }}
      - name: Build and package (Windows)
        shell: pwsh
        working-directory: ${{ env.GUI_DIR }}
        run: |
          $env:GOOS = "windows"
          $env:GOARCH = "${{ matrix.arch }}"
          wails3 build --tags npcgui
          Set-Location bin
          $zipName = "$env:APP_NAME-${{ matrix.os_name }}-${{ matrix.arch }}.zip"
          $exe = Get-ChildItem -Path . -Filter *.exe | Select-Object -First 1
          if (-not $exe) {
            $exe = Get-ChildItem -Path . -File | Select-Object -First 1
          }
          if (-not $exe) {
            Write-Host "No build output found in bin"
            Get-ChildItem -Path . | Format-Table -AutoSize
            exit 1
          }
          Compress-Archive -Path $exe.Name -DestinationPath $zipName -Force
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-builds-${{ matrix.arch }}
          path: ${{ env.GUI_DIR }}/bin/${{ env.APP_NAME }}-${{ matrix.os_name }}-${{ matrix.arch }}.zip
          retention-days: 14

  # ==================== macOS GUI ====================
  build_macos_gui:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin/amd64
            os_name: darwin
            arch: amd64
            runner: macos-15-intel
          - platform: darwin/arm64
            os_name: darwin
            arch: arm64
            runner: macos-15
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn
          cache-dependency-path: ${{ env.FRONTEND_DIR }}/yarn.lock
      - name: Enable Yarn (corepack)
        run: corepack enable
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ${{ env.GUI_DIR }}/go.mod
          check-latest: true
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}
        working-directory: ${{ env.GUI_DIR }}
      - name: Build and package (macOS)
        shell: bash
        working-directory: ${{ env.GUI_DIR }}
        run: |
          wails3 package EXTRA_TAGS=npcgui
          cd bin
          app="$(ls -1d *.app 2>/dev/null | head -n 1 || true)"
          if [ -z "$app" ]; then
            app="$(find . -maxdepth 1 -type f -perm -111 -exec basename {} \; | head -n 1 || true)"
          fi
          if [ -z "$app" ]; then
            echo "No build output found in bin"
            ls -la
            exit 1
          fi
          zip -q -r "$APP_NAME-${{ matrix.os_name }}-${{ matrix.arch }}.zip" "$app"
      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-builds-${{ matrix.arch }}
          path: ${{ env.GUI_DIR }}/bin/${{ env.APP_NAME }}-${{ matrix.os_name }}-${{ matrix.arch }}.zip
          retention-days: 14

  # ==================== Linux GUI ====================
  build_linux_gui:
    runs-on: ubuntu-latest
    env:
      WAILS_TAGS: webkit2_41
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            os_name: linux
            arch: amd64
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libgtk-4-dev libwebkitgtk-6.0-dev libsoup-3.0-dev libjavascriptcoregtk-6.0-dev libayatana-appindicator3-dev librsvg2-dev patchelf pkg-config
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn
          cache-dependency-path: ${{ env.FRONTEND_DIR }}/yarn.lock
      - name: Enable Yarn (corepack)
        run: corepack enable
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ${{ env.GUI_DIR }}/go.mod
          check-latest: true
      - name: Test GUI backend
        working-directory: ${{ env.GUI_DIR }}
        run: go test ./...
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}
        working-directory: ${{ env.GUI_DIR }}
      - name: Build and package (Linux)
        shell: bash
        working-directory: ${{ env.GUI_DIR }}
        run: |
          export GOOS=linux
          export GOARCH="${{ matrix.arch }}"
          wails3 build --tags npcgui
          cd bin
          bin="$(find . -maxdepth 1 -type f -perm -111 -printf '%f\n' | head -n 1)"
          if [ -z "$bin" ]; then
            echo "No executable file found in bin"
            ls -la
            exit 1
          fi
          zip -q "$APP_NAME-${{ matrix.os_name }}-${{ matrix.arch }}.zip" "$bin"
      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-builds-${{ matrix.arch }}
          path: ${{ env.GUI_DIR }}/bin/${{ env.APP_NAME }}-${{ matrix.os_name }}-${{ matrix.arch }}.zip
          retention-days: 14

  # ==================== 正式 Release 汇总上传 ====================
  publish_release:
    runs-on: ubuntu-latest
    needs: [build_assets, build_android, build_windows_gui, build_macos_gui, build_linux_gui]
    if: github.ref_type == 'tag' || inputs.release_tag != ''
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Validate release tag
        env:
          RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
        run: |
          release_tag="${RELEASE_TAG_INPUT:-$GITHUB_REF_NAME}"
          source_version="$(sed -nE 's/^const VERSION = "([^"]+)"$/\1/p' lib/version/version.go)"
          expected_tag="v${source_version}"
          if [ -z "$source_version" ] || [ "$release_tag" != "$expected_tag" ]; then
            echo "Release tag must equal ${expected_tag:-vX.Y.Z}; got $release_tag"
            exit 1
          fi
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: "*"
          path: release-assets
          merge-multiple: true
      - name: Generate checksums
        run: |
          cd release-assets
          find . -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.apk' -o -name '*.zip' \) -print0 \
            | sort -z | xargs -0 -r sha256sum > checksums.txt
          test -s checksums.txt
      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          make_latest: true
          files: |
            release-assets/*.tar.gz
            release-assets/*.apk
            release-assets/*.zip
            release-assets/checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
