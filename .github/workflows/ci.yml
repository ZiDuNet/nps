name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go build and core tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Build server and CLI client
        run: |
          go build -trimpath ./cmd/nps/nps.go
          go build -trimpath ./cmd/npc/npc.go

      - name: Test core packages
        run: >-
          go test -race
          ./bridge ./client ./cmd/npc ./cmd/nps
          ./lib/config ./lib/conn ./lib/file ./lib/install
          ./server ./server/connection ./server/proxy ./server/tool ./web/...

  gui-frontend:
    name: GUI frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cmd/npc/npc-gui/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: yarn
          cache-dependency-path: cmd/npc/npc-gui/frontend/yarn.lock

      - name: Enable Yarn
        run: corepack enable

      - name: Verify release version metadata
        run: |
          source_version=$(sed -nE 's/^const VERSION = "([^"]+)"$/\1/p' ../../../../lib/version/version.go)
          package_version=$(node -p 'require("./package.json").version')
          wails_version=$(node -e 'console.log(JSON.parse(require("fs").readFileSync("../wails.json", "utf8")).info.productVersion)')
          plist_versions=$(grep -A1 -E 'CFBundleVersion|CFBundleShortVersionString' ../build/darwin/Info.plist | grep '<string>' | sed -E 's/.*<string>([^<]+)<\/string>.*/\1/')
          test -n "$source_version"
          test "$package_version" = "$source_version"
          test "$wails_version" = "$source_version"
          test "$(printf '%s\n' "$plist_versions" | sort -u | wc -l | tr -d ' ')" = 1
          test "$(printf '%s\n' "$plist_versions" | head -n 1)" = "$source_version"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build frontend
        run: yarn build
