name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go build and core tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Build server and CLI client
        run: |
          go build -trimpath ./cmd/nps/nps.go
          go build -trimpath ./cmd/npc/npc.go

      - name: Test core packages
        run: >-
          go test -race
          ./bridge ./client ./cmd/npc ./cmd/nps
          ./lib/config ./lib/conn ./lib/file ./lib/install
          ./server ./server/connection ./server/proxy ./server/tool ./web/...

  gui-frontend:
    name: GUI frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cmd/npc/npc-gui/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: yarn
          cache-dependency-path: cmd/npc/npc-gui/frontend/yarn.lock

      - name: Enable Yarn
        run: corepack enable

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build frontend
        run: yarn build
